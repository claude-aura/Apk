# HORIZON LAUNCHER v2 (visual com brilho, impact frames, zíper, wallpaper colado de IA).
# Coloque em .github/workflows/launcher2.yml. Compila na nuvem e publica o APK em "Releases".
# O código-fonte do app vai comprimido (tar.gz em base64) aqui embaixo para o arquivo ficar pequeno.
# Arquivos incluídos:
#   app/build.gradle.kts
#   app/src/main/AndroidManifest.xml
#   app/src/main/java/com/horizonlauncher/Data.kt
#   app/src/main/java/com/horizonlauncher/Fx.kt
#   app/src/main/java/com/horizonlauncher/HtmlBg.kt
#   app/src/main/java/com/horizonlauncher/LauncherActivity.kt
#   app/src/main/java/com/horizonlauncher/Modes.kt
#   app/src/main/java/com/horizonlauncher/Prefs.kt
#   app/src/main/java/com/horizonlauncher/SceneView.kt
#   app/src/main/java/com/horizonlauncher/SettingsActivity.kt
#   app/src/main/java/com/horizonlauncher/VideoBg.kt
#   app/src/main/res/values/strings.xml
#   build.gradle.kts
#   gradle.properties
#   settings.gradle.kts
name: Gerar APK do Horizon Launcher v2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write


      - name: Compilar
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "=== ERROS DE COMPILACAO (me mande um print disto) ==="
            grep -E "^e: |What went wrong" -A3 build.log | head -80
            exit 1
          }
          echo "Compilou sem erros."

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: horizon-launcher-v2-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "horizon2-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --title "Horizon Launcher v2 #${{ github.run_number }}" \
            --notes "Baixe o app-debug.apk e instale. Se já tiver o Horizon antigo, desinstale antes."

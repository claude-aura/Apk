          package com.clickerinthescreen

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color

          /** Configurações salvas no aparelho. */
          object Prefs {
              private lateinit var sp: SharedPreferences

              fun init(c: Context) {
                  if (!::sp.isInitialized) sp = c.applicationContext.getSharedPreferences("cits", Context.MODE_PRIVATE)
              }

              private fun bool(k: String, d: Boolean) = sp.getBoolean(k, d)
              private fun putBool(k: String, v: Boolean) = sp.edit().putBoolean(k, v).apply()
              private fun int(k: String, d: Int) = sp.getInt(k, d)
              private fun putInt(k: String, v: Int) = sp.edit().putInt(k, v).apply()

              var overlayOn: Boolean
                  get() = bool("overlay", false)
                  set(v) = putBool("overlay", v)
              var spyOn: Boolean
                  get() = bool("spy", false)
                  set(v) = putBool("spy", v)
              var limitSec: Int                       // 0 = sem limite
                  get() = int("limit", 2)
                  set(v) = putInt("limit", v)
              var textSizeSp: Int
                  get() = int("tsize", 28)
                  set(v) = putInt("tsize", v)
              var textColor: Int
                  get() = int("tcolor", Color.WHITE)
                  set(v) = putInt("tcolor", v)
              var showCounter: Boolean
                  get() = bool("showcounter", true)
                  set(v) = putBool("showcounter", v)
              var showCps: Boolean
                  get() = bool("showcps", true)
                  set(v) = putBool("showcps", v)
              var sizeDp: Int
                  get() = int("size", 140)
                  set(v) = putInt("size", v)
              var clickMs: Int                        // quanto tempo a imagem de clique fica na tela
                  get() = int("clickms", 150)
                  set(v) = putInt("clickms", v)
              var x: Int
                  get() = int("x", -1)
                  set(v) = putInt("x", v)
              var y: Int
                  get() = int("y", -1)
                  set(v) = putInt("y", v)

              fun setPos(px: Int, py: Int) {
                  sp.edit().putInt("x", px).putInt("y", py).apply()
              }

              var editing: Boolean
                  get() = bool("editing", false)
                  set(v) = putBool("editing", v)
              var onlySelected: Boolean
                  get() = bool("only", false)
                  set(v) = putBool("only", v)

              fun selected(): Set<String> = sp.getStringSet("sel", emptySet()) ?: emptySet()
              fun setSelected(s: Set<String>) = sp.edit().putStringSet("sel", HashSet(s)).apply()
          }

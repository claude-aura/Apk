          package com.clickerinthescreen

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import java.io.File
          import java.io.FileOutputStream

          /** Três slots de imagem: 0 = parada, 1 = clique, 2 = segurando. */
          object ImageStore {
              private val names = arrayOf("idle.img", "click.img", "hold.img")

              private fun file(c: Context, slot: Int) = File(c.filesDir, names[slot])

              fun save(c: Context, uri: Uri, slot: Int): Boolean {
                  return try {
                      c.contentResolver.openInputStream(uri)?.use { inp ->
                          FileOutputStream(file(c, slot)).use { out -> inp.copyTo(out) }
                      }
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              fun remove(c: Context, slot: Int) {
                  file(c, slot).delete()
              }

              /** Lê a imagem reduzindo se for enorme. */
              fun load(c: Context, slot: Int): Bitmap? {
                  val f = file(c, slot)
                  if (!f.exists()) return null
                  return try {
                      val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      BitmapFactory.decodeFile(f.path, o)
                      var s = 1
                      while (o.outWidth / s > 1024 || o.outHeight / s > 1024) s *= 2
                      BitmapFactory.decodeFile(f.path, BitmapFactory.Options().apply { inSampleSize = s })
                  } catch (e: Exception) {
                      null
                  }
              }
          }

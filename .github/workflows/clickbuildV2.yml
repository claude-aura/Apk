# ClickerIntheScreen: este arquivo SOZINHO cria o app Android inteiro, compila na nuvem
# e publica o APK em "Releases". Coloque em .github/workflows/build.yml (pode apagar o resto do repo).
name: Gerar APK do ClickerIntheScreen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar o projeto Android
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app app/src/main app/src/main/java/com/clickerinthescreen app/src/main/res/values app/src/main/res/xml
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.clickerinthescreen"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.clickerinthescreen"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          kotlin.code.style=official
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ClickerIntheScreen"
          include(":app")
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/star_big_on"
                  android:label="@string/app_name">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".AppsActivity" android:exported="false" android:label="Escolher apps" />

                  <service
                      android:name=".ClickerService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">ClickerIntheScreen</string>
              <string name="service_desc">Mostra o clicker flutuante por cima dos outros apps, conta seus toques no modo espiao e sabe qual app esta aberto pra aparecer so onde voce escolher. Nao le o conteudo das telas.</string>
          </resources>
          EOF
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="0"
              android:description="@string/service_desc" />
          EOF
          cat > app/src/main/java/com/clickerinthescreen/AppsActivity.kt <<'EOF'
          package com.clickerinthescreen

          import android.app.Activity
          import android.content.Intent
          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView

          /** Lista os apps instalados; os marcados são onde o clicker aparece (no modo "só nos apps escolhidos"). */
          class AppsActivity : Activity() {
              private class Item(val label: String, val pkg: String, val icon: Drawable)
              private class Row(val icon: ImageView, val name: TextView, val chk: CheckBox)

              private val all = ArrayList<Item>()
              private val shown = ArrayList<Item>()
              private val sel = HashSet<String>()
              private lateinit var adapter: BaseAdapter

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Prefs.init(this)
                  sel.addAll(Prefs.selected())

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.fitsSystemWindows = true
                  root.setPadding(dp(12), dp(12), dp(12), 0)
                  val info = TextView(this)
                  info.text = "Marque os apps onde o clicker deve aparecer."
                  val search = EditText(this)
                  search.hint = "Buscar app…"
                  search.setSingleLine()
                  val list = ListView(this)
                  root.addView(info)
                  root.addView(search)
                  root.addView(list, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)

                  adapter = object : BaseAdapter() {
                      override fun getCount() = shown.size
                      override fun getItem(position: Int): Any = shown[position]
                      override fun getItemId(position: Int) = position.toLong()
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val row: Row
                          val v: View
                          if (convertView == null) {
                              val box = LinearLayout(this@AppsActivity)
                              box.orientation = LinearLayout.HORIZONTAL
                              box.gravity = Gravity.CENTER_VERTICAL
                              box.setPadding(0, dp(6), 0, dp(6))
                              val ic = ImageView(this@AppsActivity)
                              val nm = TextView(this@AppsActivity)
                              nm.setPadding(dp(12), 0, dp(12), 0)
                              val ck = CheckBox(this@AppsActivity)
                              ck.isClickable = false
                              ck.isFocusable = false
                              box.addView(ic, LinearLayout.LayoutParams(dp(40), dp(40)))
                              box.addView(nm, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                              box.addView(ck)
                              row = Row(ic, nm, ck)
                              box.tag = row
                              v = box
                          } else {
                              v = convertView
                              row = convertView.tag as Row
                          }
                          val item = shown[position]
                          row.icon.setImageDrawable(item.icon)
                          row.name.text = item.label
                          row.chk.isChecked = sel.contains(item.pkg)
                          return v
                      }
                  }
                  list.adapter = adapter
                  list.setOnItemClickListener { _, _, pos, _ ->
                      val pkg = shown[pos].pkg
                      if (!sel.add(pkg)) sel.remove(pkg)
                      Prefs.setSelected(sel)
                      ClickerService.instance?.refresh()
                      adapter.notifyDataSetChanged()
                  }
                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) { filter(s?.toString() ?: "") }
                  })

                  Thread {
                      val pm = packageManager
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val seen = HashSet<String>()
                      val tmp = ArrayList<Item>()
                      for (ri in pm.queryIntentActivities(intent, 0)) {
                          val p = ri.activityInfo.packageName
                          if (p == packageName || !seen.add(p)) continue
                          tmp.add(Item(ri.loadLabel(pm).toString(), p, ri.loadIcon(pm)))
                      }
                      tmp.sortBy { it.label.lowercase() }
                      runOnUiThread {
                          all.addAll(tmp)
                          filter(search.text.toString())
                      }
                  }.start()
              }

              private fun filter(q: String) {
                  shown.clear()
                  val k = q.trim().lowercase()
                  for (i in all) if (k.isEmpty() || i.label.lowercase().contains(k)) shown.add(i)
                  adapter.notifyDataSetChanged()
              }
          }
          EOF
          cat > app/src/main/java/com/clickerinthescreen/ClickEngine.kt <<'EOF'
          package com.clickerinthescreen

          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock

          /**
           * Sequência de cliques: cada clique soma +1 e o tempo volta pro máximo.
           * Se ficar sem clicar pelo tempo limite, a sequência acaba, mostra o resultado e zera.
           */
          class ClickEngine(private val onChange: () -> Unit) {

              enum class State { IDLE, CLICK, HOLD }

              var state = State.IDLE
                  private set
              var count = 0
                  private set
              var running = false
                  private set
              var finished = false
                  private set
              var limitMs = 0L
                  private set
              var cps = 0f
                  private set
              var onFinished: ((Int, Float) -> Unit)? = null

              /** Tempo que falta pra sequência acabar (0 se não tem limite). */
              val remainingMs: Long
                  get() = if (running && limitMs > 0) (deadline - SystemClock.uptimeMillis()).coerceAtLeast(0L) else 0L

              private val h = Handler(Looper.getMainLooper())
              private var startAt = 0L
              private var lastAt = 0L
              private var deadline = 0L
              private var isDown = false
              private var counted = false

              private val holdR = Runnable {
                  if (isDown && state == State.CLICK) { state = State.HOLD; onChange() }
              }
              private val releaseR = Runnable {
                  if (!isDown && state != State.IDLE) { state = State.IDLE; onChange() }
              }
              private val clearR = Runnable { clear(); onChange() }
              private val tickR = object : Runnable {
                  override fun run() {
                      if (limitMs > 0 && SystemClock.uptimeMillis() >= deadline) { finish(); return }
                      onChange()
                      h.postDelayed(this, 50)
                  }
              }

              fun down(limitSec: Int) {
                  val now = SystemClock.uptimeMillis()
                  h.removeCallbacks(releaseR); h.removeCallbacks(holdR); h.removeCallbacks(clearR)
                  isDown = true; counted = true
                  if (finished) clear()
                  limitMs = limitSec * 1000L
                  if (!running) {
                      running = true; count = 0; startAt = now
                      h.removeCallbacks(tickR); h.post(tickR)
                  }
                  count++
                  lastAt = now
                  if (limitMs > 0) deadline = now + limitMs     // a cada clique o tempo volta pro máximo
                  state = State.CLICK
                  h.postDelayed(holdR, HOLD_MS)
                  onChange()
              }

              fun up(releaseMs: Int) {
                  isDown = false
                  h.removeCallbacks(holdR); h.removeCallbacks(releaseR)
                  h.postDelayed(releaseR, releaseMs.toLong())
              }

              /** Toque sem "soltar" (modo espião): conta e mostra o clique por [releaseMs]. */
              fun tap(limitSec: Int, releaseMs: Int) {
                  down(limitSec)
                  up(releaseMs)
              }

              /** O toque virou arrasto: desfaz a contagem desse toque. */
              fun cancelTouch() {
                  h.removeCallbacks(holdR)
                  isDown = false
                  if (counted) {
                      counted = false; count--
                      if (count <= 0 && running) clear()
                  }
                  state = State.IDLE
                  onChange()
              }

              fun reset() { clear(); onChange() }

              fun destroy() = h.removeCallbacksAndMessages(null)

              private fun clear() {
                  h.removeCallbacks(tickR); h.removeCallbacks(clearR)
                  running = false; finished = false
                  count = 0; cps = 0f
                  state = State.IDLE
              }

              private fun finish() {
                  h.removeCallbacks(tickR); h.removeCallbacks(holdR)
                  running = false; finished = true
                  val dur = lastAt - startAt
                  cps = if (count > 1 && dur > 0) (count - 1) * 1000f / dur else 0f
                  state = State.IDLE
                  onFinished?.invoke(count, cps)
                  onChange()
                  h.postDelayed(clearR, RESULT_MS)
              }

              private companion object {
                  const val HOLD_MS = 220L       // tempo pra virar "segurando"
                  const val RESULT_MS = 3000L    // quanto tempo o resultado fica na tela antes de zerar
              }
          }
          EOF
          cat > app/src/main/java/com/clickerinthescreen/ClickerService.kt <<'EOF'
          package com.clickerinthescreen

          import android.accessibilityservice.AccessibilityService
          import android.graphics.PixelFormat
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.WindowManager
          import android.view.WindowManager.LayoutParams as LP
          import android.view.accessibility.AccessibilityEvent
          import android.view.inputmethod.InputMethodManager
          import kotlin.math.roundToInt

          /**
           * Overlay do clicker (TYPE_ACCESSIBILITY_OVERLAY, não precisa da permissão de sobrepor apps).
           *  - Modo normal: o clicker recebe seus toques (clique, segurar, arrastar).
           *  - Modo espião: o clicker vira "fantasma" e uma janela invisível de 1x1 px recebe ACTION_OUTSIDE
           *    a cada toque em qualquer app. O Android só avisa o INÍCIO do toque, então não dá pra detectar segurar.
           *  - Modo de edição: arrasta pra mudar a posição e pinça com 2 dedos pra mudar o tamanho.
           *  - "Só nos apps escolhidos": o serviço recebe TYPE_WINDOW_STATE_CHANGED com o app aberto.
           */
          class ClickerService : AccessibilityService() {
              companion object {
                  var instance: ClickerService? = null
              }

              private var wm: WindowManager? = null
              private var catcher: View? = null
              private var view: ClickerView? = null
              private lateinit var lp: LP
              private val engine = ClickEngine { view?.refresh() }
              private var px = 0
              private var py = 0
              private var fg: String? = null
              private val ignore = HashSet<String>()
              private var pinchSize = 0f
              private val baseFlags = LP.FLAG_NOT_FOCUSABLE or LP.FLAG_LAYOUT_IN_SCREEN

              private val editTouch by lazy {
                  object : View.OnTouchListener {
                      var lx = 0f
                      var ly = 0f
                      var fresh = true
                      val sg = ScaleGestureDetector(this@ClickerService, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                          override fun onScaleBegin(d: ScaleGestureDetector): Boolean {
                              pinchSize = Prefs.sizeDp.toFloat()
                              return true
                          }

                          override fun onScale(d: ScaleGestureDetector): Boolean {
                              pinchSize = (pinchSize * d.scaleFactor).coerceIn(60f, 400f)
                              Prefs.sizeDp = pinchSize.roundToInt()
                              val cx = px + lp.width / 2f
                              val cy = py + lp.height / 2f
                              computeSize()
                              px = (cx - lp.width / 2f).toInt()
                              py = (cy - lp.height / 2f).toInt()
                              place()
                              return true
                          }
                      })

                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          sg.onTouchEvent(e)
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> { lx = e.rawX; ly = e.rawY; fresh = false }
                              MotionEvent.ACTION_POINTER_DOWN, MotionEvent.ACTION_POINTER_UP -> fresh = true
                              MotionEvent.ACTION_MOVE -> if (!sg.isInProgress && e.pointerCount == 1) {
                                  if (fresh) {
                                      lx = e.rawX; ly = e.rawY; fresh = false
                                  } else {
                                      move(e.rawX - lx, e.rawY - ly)
                                      lx = e.rawX; ly = e.rawY
                                  }
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> Prefs.setPos(px, py)
                          }
                          return true
                      }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Prefs.init(this)
                  Prefs.editing = false
                  instance = this
                  val m = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = m
                  try {
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.enabledInputMethodList.forEach { ignore.add(it.packageName) }
                  } catch (_: Exception) { }
                  ignore.add("com.android.systemui")
                  ignore.add("android")
                  ignore.add(packageName)

                  val c = View(this)
                  c.setOnTouchListener { _, e ->
                      if (e.actionMasked == MotionEvent.ACTION_OUTSIDE) onSpyTap()
                      false
                  }
                  val clp = LP(
                      1, 1, LP.TYPE_ACCESSIBILITY_OVERLAY,
                      LP.FLAG_NOT_FOCUSABLE or LP.FLAG_NOT_TOUCH_MODAL or LP.FLAG_WATCH_OUTSIDE_TOUCH,
                      PixelFormat.TRANSLUCENT
                  )
                  clp.gravity = Gravity.TOP or Gravity.START
                  m.addView(c, clp)
                  catcher = c

                  val v = ClickerView(this, engine)
                  v.enableTouch(onDrag = { dx, dy -> move(dx, dy) }, onDragEnd = { Prefs.setPos(px, py) })
                  lp = LP(100, 100, LP.TYPE_ACCESSIBILITY_OVERLAY, baseFlags, PixelFormat.TRANSLUCENT)
                  lp.gravity = Gravity.TOP or Gravity.START
                  m.addView(v, lp)
                  view = v
                  refresh(true)
              }

              /** Relê as configurações. images = true também recarrega as imagens. */
              fun refresh(images: Boolean = false) {
                  val v = view ?: return
                  if (images) v.reload()
                  computeSize()
                  // toca no clicker quando: modo normal OU modo de edição. No espião o toque atravessa.
                  lp.flags = baseFlags or (if (!Prefs.spyOn || Prefs.editing) 0 else LP.FLAG_NOT_TOUCHABLE)
                  val d = resources.displayMetrics
                  if (Prefs.x < 0 || Prefs.y < 0) {
                      px = d.widthPixels - lp.width - (16 * d.density).toInt()
                      py = (180 * d.density).toInt()
                  } else {
                      px = Prefs.x
                      py = Prefs.y
                  }
                  v.editing = Prefs.editing
                  if (Prefs.editing) v.setOnTouchListener(editTouch) else v.useNormalTouch()
                  updateVisibility()
                  place()
                  v.refresh()
              }

              private fun computeSize() {
                  val v = view ?: return
                  val side = (Prefs.sizeDp * resources.displayMetrics.density).toInt()
                  lp.width = if (Prefs.showCounter) maxOf(side, v.neededWidthPx()) else side
                  lp.height = side + v.blockHeightPx()
              }

              private fun place() {
                  val v = view ?: return
                  val m = wm ?: return
                  val d = resources.displayMetrics
                  px = px.coerceIn(0, maxOf(0, d.widthPixels - lp.width))
                  py = py.coerceIn(0, maxOf(0, d.heightPixels - lp.height))
                  lp.x = px
                  lp.y = py
                  try { m.updateViewLayout(v, lp) } catch (_: Exception) { }
              }

              private fun move(dx: Float, dy: Float) {
                  px += dx.toInt()
                  py += dy.toInt()
                  place()
              }

              private fun visible(): Boolean {
                  if (!Prefs.overlayOn) return false
                  if (Prefs.editing || !Prefs.onlySelected) return true
                  val f = fg ?: return false
                  return f == packageName || Prefs.selected().contains(f)
              }

              private fun updateVisibility() {
                  val show = visible()
                  view?.visibility = if (show) View.VISIBLE else View.GONE
                  if (!show) engine.reset()
              }

              /** O app do próprio clicker avisa que está na frente (o serviço ignora eventos do próprio pacote). */
              fun setForeground(pkg: String) {
                  fg = pkg
                  updateVisibility()
              }

              private fun onSpyTap() {
                  if (!Prefs.spyOn || Prefs.editing || !visible()) return
                  engine.tap(Prefs.limitSec, Prefs.clickMs)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val p = e.packageName?.toString() ?: return
                  if (p in ignore) return
                  fg = p
                  updateVisibility()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  instance = null
                  engine.destroy()
                  try { catcher?.let { wm?.removeView(it) } } catch (_: Exception) { }
                  try { view?.let { wm?.removeView(it) } } catch (_: Exception) { }
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/clickerinthescreen/ClickerView.kt <<'EOF'
          package com.clickerinthescreen

          import android.annotation.SuppressLint
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.util.TypedValue
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import kotlin.math.hypot

          /** View única (app e overlay): imagem parada/clique/segurando em cima, contador e barra de tempo embaixo. */
          class ClickerView(ctx: Context, private val engine: ClickEngine) : View(ctx) {

              var editing = false
                  set(v) { field = v; invalidate() }

              private var idle: Bitmap? = null
              private var click: Bitmap? = null
              private var hold: Bitmap? = null
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private var text = "0"
              private var normalTouch: View.OnTouchListener? = null

              init {
                  engine.onFinished = { c, cps ->
                      announceForAccessibility(String.format("Sequência encerrada. %d cliques, %.1f por segundo.", c, cps))
                  }
                  reload()
              }

              fun textPx(): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_SP, Prefs.textSizeSp.toFloat(), resources.displayMetrics)

              /** Altura reservada pro texto + barra embaixo da imagem. */
              fun blockHeightPx(): Int = if (Prefs.showCounter) (textPx() * 1.5f + textPx() * 0.32f).toInt() else 0

              /** Largura mínima pro texto não ser cortado no tamanho de letra escolhido. */
              fun neededWidthPx(): Int {
                  val q = Paint(Paint.ANTI_ALIAS_FLAG)
                  q.typeface = Typeface.DEFAULT_BOLD
                  q.textSize = textPx()
                  return (q.measureText("99 cliques • 99.9 CPS") + 24 * resources.displayMetrics.density).toInt()
              }

              fun reload() {
                  idle = ImageStore.load(context, 0)
                  click = ImageStore.load(context, 1)
                  hold = ImageStore.load(context, 2)
                  refresh()
              }

              fun refresh() {
                  text = when {
                      engine.finished ->
                          if (Prefs.showCps && engine.cps > 0f) String.format("%d cliques • %.1f CPS", engine.count, engine.cps)
                          else String.format("%d cliques", engine.count)
                      engine.running && engine.limitMs > 0 ->
                          String.format("%d • %.1fs", engine.count, engine.remainingMs / 1000f)
                      else -> engine.count.toString()
                  }
                  if (!engine.running) contentDescription = "Área de clique. $text"
                  invalidate()
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val block = blockHeightPx().toFloat()
                  val side = minOf(w, height - block, Prefs.sizeDp * resources.displayMetrics.density).coerceAtLeast(0f)
                  val left = (w - side) / 2f
                  val bmp = when (engine.state) {
                      ClickEngine.State.IDLE -> idle
                      ClickEngine.State.CLICK -> click ?: idle
                      ClickEngine.State.HOLD -> hold ?: click ?: idle
                  }
                  if (bmp != null) {
                      val r = minOf(side / bmp.width, side / bmp.height)
                      val dw = bmp.width * r
                      val dh = bmp.height * r
                      rect.set(left + (side - dw) / 2, (side - dh) / 2, left + (side + dw) / 2, (side + dh) / 2)
                      p.style = Paint.Style.FILL
                      c.drawBitmap(bmp, null, rect, p)
                  } else {
                      drawDefault(c, left, side)
                  }
                  if (Prefs.showCounter) drawCounter(c, w, side)
                  if (editing) {
                      p.style = Paint.Style.STROKE; p.strokeWidth = 5f; p.color = 0xFF6D4AFF.toInt()
                      p.pathEffect = DashPathEffect(floatArrayOf(18f, 12f), 0f)
                      c.drawRect(3f, 3f, w - 3f, height - 3f, p)
                      p.pathEffect = null
                  }
              }

              private fun drawDefault(c: Canvas, left: Float, side: Float) {
                  val cx = left + side / 2
                  val cy = side / 2
                  val r = side * 0.4f
                  when (engine.state) {
                      ClickEngine.State.IDLE -> {
                          p.style = Paint.Style.STROKE; p.strokeWidth = side * 0.06f; p.color = 0xFF8AB4F8.toInt()
                          c.drawCircle(cx, cy, r, p)
                      }
                      ClickEngine.State.CLICK -> {
                          p.style = Paint.Style.FILL; p.color = 0xFF8AB4F8.toInt()
                          c.drawCircle(cx, cy, r, p)
                      }
                      ClickEngine.State.HOLD -> {
                          p.style = Paint.Style.FILL; p.color = 0xFFF28B82.toInt()
                          c.drawCircle(cx, cy, r, p)
                          p.style = Paint.Style.STROKE; p.strokeWidth = side * 0.04f; p.color = Color.WHITE
                          c.drawCircle(cx, cy, r * 0.65f, p)
                      }
                  }
              }

              private fun drawCounter(c: Canvas, w: Float, top: Float) {
                  var ts = textPx()
                  val zone = ts * 1.5f
                  p.typeface = Typeface.DEFAULT_BOLD
                  p.textAlign = Paint.Align.CENTER
                  p.textSize = ts
                  while (p.measureText(text) > w - 8f && ts > 10f) { ts *= 0.92f; p.textSize = ts }
                  val y = top + zone * 0.5f + ts * 0.35f
                  p.strokeJoin = Paint.Join.ROUND
                  p.style = Paint.Style.STROKE; p.strokeWidth = ts * 0.16f; p.color = Color.BLACK
                  c.drawText(text, w / 2, y, p)
                  p.style = Paint.Style.FILL; p.color = Prefs.textColor
                  c.drawText(text, w / 2, y, p)
                  p.typeface = Typeface.DEFAULT
                  // barra: tempo que falta pra sequência acabar
                  if (engine.running && engine.limitMs > 0) {
                      val bh = textPx() * 0.2f
                      val by = top + zone + bh * 0.3f
                      val bw = w * 0.7f
                      val bx = (w - bw) / 2
                      p.style = Paint.Style.FILL; p.color = Color.BLACK
                      rect.set(bx - 3f, by - 3f, bx + bw + 3f, by + bh + 3f)
                      c.drawRoundRect(rect, bh, bh, p)
                      p.color = Prefs.textColor
                      val frac = (engine.remainingMs.toFloat() / engine.limitMs).coerceIn(0f, 1f)
                      rect.set(bx, by, bx + bw * frac, by + bh)
                      c.drawRoundRect(rect, bh / 2, bh / 2, p)
                  }
              }

              /** Volta pro toque normal (clique / segurar / arrastar) depois do modo de edição. */
              fun useNormalTouch() {
                  setOnTouchListener(normalTouch)
              }

              /**
               * Toque = clique, segurar = imagem "segurando". Com [onDrag], arrastar move a view
               * (e o toque deixa de contar como clique).
               */
              @SuppressLint("ClickableViewAccessibility")
              fun enableTouch(onDrag: ((Float, Float) -> Unit)? = null, onDragEnd: (() -> Unit)? = null) {
                  val slop = ViewConfiguration.get(context).scaledTouchSlop * 2
                  var sx = 0f; var sy = 0f; var lx = 0f; var ly = 0f
                  var dragging = false
                  val l = View.OnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              v.parent?.requestDisallowInterceptTouchEvent(true)
                              sx = e.rawX; sy = e.rawY; lx = sx; ly = sy; dragging = false
                              engine.down(Prefs.limitSec)
                          }
                          MotionEvent.ACTION_MOVE -> if (onDrag != null) {
                              if (!dragging && hypot(e.rawX - sx, e.rawY - sy) > slop) {
                                  dragging = true
                                  engine.cancelTouch()
                              }
                              if (dragging) onDrag(e.rawX - lx, e.rawY - ly)
                              lx = e.rawX; ly = e.rawY
                          }
                          MotionEvent.ACTION_UP -> {
                              if (dragging) onDragEnd?.invoke() else engine.up(Prefs.clickMs)
                              dragging = false
                              v.performClick()
                          }
                          MotionEvent.ACTION_CANCEL -> {
                              if (!dragging) engine.up(Prefs.clickMs)
                              dragging = false
                          }
                      }
                      true
                  }
                  normalTouch = l
                  setOnTouchListener(l)
              }
          }

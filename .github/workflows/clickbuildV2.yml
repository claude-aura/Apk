          package com.clickerinthescreen

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val engine = ClickEngine { if (::test.isInitialized) test.refresh() }
              private lateinit var test: ClickerView
              private lateinit var status: TextView
              private lateinit var sizeBar: SeekBar
              private lateinit var appsBtn: Button
              private val thumbs = ArrayList<ImageView>()

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              private fun LinearLayout.add(v: View) {
                  addView(v, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      .apply { topMargin = dp(8) })
              }

              private fun label(s: String, size: Float, bold: Boolean) = TextView(this).apply {
                  text = s
                  if (size > 0f) textSize = size
                  if (bold) setTypeface(typeface, Typeface.BOLD)
              }

              private fun button(s: String, onClick: () -> Unit) = Button(this).apply {
                  text = s
                  minHeight = dp(48)
                  setOnClickListener { onClick() }
              }

              private fun toggle(s: String, init: Boolean, on: (Boolean) -> Unit) = Switch(this).apply {
                  text = s
                  isChecked = init
                  minHeight = dp(48)
                  setOnCheckedChangeListener { _, c -> on(c) }
              }

              private fun slider(name: String, lo: Int, hi: Int, v: Int, fmt: (Int) -> String, on: (Int) -> Unit): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  val t = label(name + ": " + fmt(v), 0f, false)
                  val s = SeekBar(this)
                  s.min = lo
                  s.max = hi
                  s.progress = v
                  s.contentDescription = name
                  s.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                          t.text = name + ": " + fmt(p)
                          if (fromUser) on(p)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })
                  box.addView(t)
                  box.addView(s)
                  return box
              }

              /** Aplica mudanças no teste do app e no clicker flutuante. */
              private fun upd(images: Boolean = false) {
                  if (images) test.reload() else test.refresh()
                  ClickerService.instance?.refresh(images)
              }

              private fun serviceActive(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  return s.contains("$packageName/") && s.contains("ClickerService")
              }

              private fun openAccessibility() = startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Prefs.init(this)
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(16), dp(16), dp(16), dp(32))
                  val scroll = ScrollView(this)
                  scroll.fitsSystemWindows = true
                  scroll.addView(col)
                  setContentView(scroll)

                  col.add(label("ClickerIntheScreen", 26f, true))
                  col.add(label("Toque na área escura pra testar: toque = clique, segurar = imagem de segurando.", 0f, false))
                  val box = FrameLayout(this)
                  box.setBackgroundColor(0xFF202124.toInt())
                  test = ClickerView(this, engine)
                  test.enableTouch()
                  box.addView(test, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  col.addView(box, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(300)).apply { topMargin = dp(8) })
                  col.add(button("Resetar rodada") { engine.reset() })

                  // ---------- imagens ----------
                  col.add(label("Imagens", 20f, true))
                  val names = arrayOf("Parada (sem toque)", "Clique", "Segurando (opcional)")
                  for (i in 0..2) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      val th = ImageView(this)
                      th.setBackgroundColor(0x22888888)
                      th.scaleType = ImageView.ScaleType.FIT_CENTER
                      th.contentDescription = names[i]
                      thumbs.add(th)
                      row.addView(th, LinearLayout.LayoutParams(dp(56), dp(56)))
                      val tv = label(names[i], 0f, false)
                      tv.setPadding(dp(12), 0, dp(8), 0)
                      row.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      row.addView(button("Escolher") { pick(20 + i) })
                      row.addView(button("Tirar") { ImageStore.remove(this, i); refreshThumbs(); upd(true) })
                      col.add(row)
                  }
                  col.add(label("Sem imagem escolhida, usa o círculo padrão. Se faltar a de clique ou a de segurando, usa a anterior.", 0f, false))

                  // ---------- contador ----------
                  col.add(label("Contador", 20f, true))
                  col.add(slider("Tempo pra zerar", 0, 30, Prefs.limitSec, { if (it == 0) "nunca zera" else "$it s" }) { Prefs.limitSec = it })
                  col.add(label("A cada clique o tempo volta pro máximo. Se ficar sem clicar esse tempo, a contagem acaba, mostra o resultado e zera.", 0f, false))
                  col.add(slider("Tamanho dos números e letras", 12, 96, Prefs.textSizeSp, { "$it sp" }) { Prefs.textSizeSp = it; upd() })
                  col.add(slider("Tempo da imagem de clique", 50, 500, Prefs.clickMs, { "$it ms" }) { Prefs.clickMs = it })
                  col.add(label("Cor do contador", 0f, false))
                  val crow = LinearLayout(this)
                  crow.orientation = LinearLayout.HORIZONTAL
                  val colors = intArrayOf(
                      0xFFFFFFFF.toInt(), 0xFFFFEB3B.toInt(), 0xFF4CAF50.toInt(),
                      0xFFF44336.toInt(), 0xFF00BCD4.toInt(), 0xFFE040FB.toInt()
                  )
                  for (c in colors) {
                      val dot = View(this)
                      val g = GradientDrawable()
                      g.shape = GradientDrawable.OVAL
                      g.setColor(c)
                      g.setStroke(dp(2), 0x88888888.toInt())
                      dot.background = g
                      dot.contentDescription = "Cor do contador"
                      dot.setOnClickListener { Prefs.textColor = c; upd() }
                      crow.addView(dot, LinearLayout.LayoutParams(dp(40), dp(40)).apply { marginEnd = dp(10) })
                  }
                  col.add(crow)
                  col.add(toggle("Mostrar contador", Prefs.showCounter) { Prefs.showCounter = it; upd() })
                  col.add(toggle("Mostrar CPS no fim da rodada", Prefs.showCps) { Prefs.showCps = it; upd() })

                  // ---------- clicker flutuante ----------
                  col.add(label("Clicker flutuante (acessibilidade)", 20f, true))
                  status = label("", 0f, true)
                  col.add(status)
                  col.add(button("Abrir ajustes de acessibilidade") { openAccessibility() })
                  col.add(toggle("Mostrar clicker flutuante", Prefs.overlayOn) {
                      Prefs.overlayOn = it
                      if (it && !serviceActive()) {
                          Toast.makeText(this, "Ative o ClickerIntheScreen em Acessibilidade", Toast.LENGTH_LONG).show()
                          openAccessibility()
                      }
                      upd()
                  })
                  col.add(toggle("Modo espião (experimental)", Prefs.spyOn) { Prefs.spyOn = it; upd() })
                  col.add(label("Espião: conta toques em qualquer app e o clicker deixa de receber toque (não arrasta). Não detecta segurar. Pra mover ou redimensionar, use o Modo de edição.", 0f, false))
                  col.add(label("Posição e tamanho", 20f, true))
                  col.add(toggle("Modo de edição (arraste o clicker; pinça com 2 dedos muda o tamanho)", Prefs.editing) { Prefs.editing = it; upd() })
                  col.add(label("Desligue o modo de edição quando terminar, senão o clicker não conta os cliques.", 0f, false))
                  val sz = slider("Tamanho do clicker", 60, 400, Prefs.sizeDp, { "$it dp" }) { Prefs.sizeDp = it; upd() }
                  sizeBar = sz.getChildAt(1) as SeekBar
                  col.add(sz)
                  col.add(label("Onde aparece", 20f, true))
                  col.add(toggle("Só nos apps que eu escolher", Prefs.onlySelected) { Prefs.onlySelected = it; upd() })
                  appsBtn = button("") { startActivity(Intent(this, AppsActivity::class.java)) }
                  col.add(appsBtn)
                  col.add(button("Voltar o clicker pra posição inicial") { Prefs.x = -1; Prefs.y = -1; upd() })
                  col.add(label("Limite do Android: ele avisa quando você TOCA, mas não onde nem quando o dedo sai. No espião, a imagem de clique dura um tempo fixo.", 0f, false))
              }

              override fun onResume() {
                  super.onResume()
                  status.text = if (serviceActive()) "Serviço: ATIVO ✔"
                  else "Serviço: DESATIVADO. Abra os ajustes de acessibilidade e ligue o ClickerIntheScreen."
                  refreshThumbs()
                  appsBtn.text = "Escolher apps (" + Prefs.selected().size + " escolhidos)"
                  sizeBar.progress = Prefs.sizeDp
                  ClickerService.instance?.setForeground(packageName)
              }

              override fun onDestroy() {
                  engine.destroy()
                  super.onDestroy()
              }

              private fun refreshThumbs() {
                  for (i in 0..2) thumbs[i].setImageBitmap(ImageStore.load(this, i))
              }

              private fun pick(code: Int) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "image/*"
                  @Suppress("DEPRECATION")
                  startActivityForResult(i, code)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  val slot = requestCode - 20
                  if (slot !in 0..2 || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  if (ImageStore.save(this, uri, slot)) {
                      refreshThumbs()
                      upd(true)
                      Toast.makeText(this, "Pronto!", Toast.LENGTH_SHORT).show()
                  } else {
                      Toast.makeText(this, "Não consegui abrir essa imagem.", Toast.LENGTH_LONG).show()
                  }
              }
          }

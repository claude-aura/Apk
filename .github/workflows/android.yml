          /** Lê uma imagem (PNG, JPG ou WEBP) do disco, reduzindo se for enorme. */
          fun loadBitmap(f: File): Bitmap? {
              if (!f.exists()) return null
              return try {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(f.path, o)
                  var s = 1
                  while (o.outWidth / s > 1024 || o.outHeight / s > 1024) s *= 2
                  BitmapFactory.decodeFile(f.path, BitmapFactory.Options().apply { inSampleSize = s })
              } catch (e: Exception) {
                  null
              }
          }

          fun drawFit(c: Canvas, b: Bitmap, w: Float, h: Float, p: Paint) {
              val r = minOf(w / b.width, h / b.height)
              val dw = b.width * r
              val dh = b.height * r
              c.drawBitmap(b, null, RectF((w - dw) / 2, (h - dh) / 2, (w + dw) / 2, (h + dh) / 2), p)
          }

          private fun editBox(c: Canvas, w: Float, h: Float, p: Paint) {
              p.style = Paint.Style.STROKE
              p.strokeWidth = 4f
              p.color = Color.parseColor("#FFD400")
              p.pathEffect = DashPathEffect(floatArrayOf(14f, 10f), 0f)
              c.drawRect(2f, 2f, w - 2f, h - 2f, p)
              p.pathEffect = null
          }

          /** Bateria: ícone padrão desenhado, ou a imagem do usuário, mais a porcentagem. */
          class BatteryView(c: Context) : View(c) {
              var level = 100
              var charging = false
              var showPct = true
              var bmp: Bitmap? = null
              var editing = false
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val iw = h * 1.3f
                  val b = bmp
                  if (b != null) {
                      drawFit(cv, b, iw, h, p)
                  } else {
                      val col = if (charging) Color.parseColor("#35C7E8") else if (level <= 20) Color.parseColor("#E53935") else Color.parseColor("#3FD16A")
                      val body = RectF(h * 0.06f, h * 0.2f, iw - h * 0.16f, h * 0.8f)
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = h * 0.07f
                      p.color = Color.WHITE
                      cv.drawRoundRect(body, h * 0.1f, h * 0.1f, p)
                      p.style = Paint.Style.FILL
                      cv.drawRect(iw - h * 0.16f, h * 0.38f, iw - h * 0.06f, h * 0.62f, p)
                      p.color = col
                      val fw = (body.width() - h * 0.14f) * level.coerceIn(0, 100) / 100f
                      cv.drawRect(body.left + h * 0.07f, body.top + h * 0.07f, body.left + h * 0.07f + fw, body.bottom - h * 0.07f, p)
                  }
                  if (showPct) {
                      val t = level.toString() + "%"
                      p.textAlign = Paint.Align.LEFT
                      p.textSize = h * 0.52f
                      p.typeface = Typeface.DEFAULT_BOLD
                      val y = h * 0.5f + p.textSize * 0.35f
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = h * 0.12f
                      p.color = Color.BLACK
                      cv.drawText(t, iw + h * 0.1f, y, p)
                      p.style = Paint.Style.FILL
                      p.color = Color.WHITE
                      cv.drawText(t, iw + h * 0.1f, y, p)
                  }
                  if (editing) editBox(cv, w, h, p)
              }
          }

          /** Desenhos padrão do indicador de internet: formiga com folha, semente, pedra, metal e exclamação. */
          fun drawNetDefault(c: Canvas, st: Int, s: Float) {
              val u = s / 100f
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              when {
                  st >= 3 -> {
                      val ls = if (st == 4) 1f else 0.7f
                      p.style = Paint.Style.FILL
                      p.color = Color.parseColor("#3FAE49")
                      c.save()
                      c.rotate(-18f, 45 * u, 42 * u)
                      c.drawOval(RectF(45 * u - 26 * u * ls, 42 * u - 12 * u * ls, 45 * u + 26 * u * ls, 42 * u + 12 * u * ls), p)
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = 1.6f * u
                      p.color = Color.parseColor("#2A7D32")
                      c.drawLine(45 * u - 24 * u * ls, 42 * u, 45 * u + 24 * u * ls, 42 * u, p)
                      c.restore()
                      p.style = Paint.Style.FILL
                      p.color = Color.parseColor("#4A2C17")
                      c.drawCircle(30 * u, 66 * u, 14 * u, p)
                      c.drawCircle(52 * u, 66 * u, 8 * u, p)
                      c.drawCircle(68 * u, 64 * u, 9 * u, p)
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = 3 * u
                      p.strokeCap = Paint.Cap.ROUND
                      c.drawLine(52 * u, 70 * u, 42 * u, 90 * u, p)
                      c.drawLine(52 * u, 72 * u, 54 * u, 92 * u, p)
                      c.drawLine(52 * u, 70 * u, 64 * u, 90 * u, p)
                      c.drawLine(72 * u, 58 * u, 84 * u, 46 * u, p)
                      c.drawLine(76 * u, 60 * u, 90 * u, 54 * u, p)
                  }
                  st == 2 -> {
                      p.style = Paint.Style.FILL
                      p.color = Color.parseColor("#8A5A2B")
                      c.save()
                      c.rotate(28f, 50 * u, 52 * u)
                      c.drawOval(RectF(28 * u, 36 * u, 72 * u, 68 * u), p)
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = 2 * u
                      p.color = Color.parseColor("#C99A63")
                      c.drawLine(32 * u, 52 * u, 68 * u, 52 * u, p)
                      c.restore()
                  }
                  st == 1 -> {
                      val path = Path()
                      path.moveTo(18 * u, 72 * u); path.lineTo(26 * u, 46 * u); path.lineTo(50 * u, 32 * u)
                      path.lineTo(76 * u, 42 * u); path.lineTo(84 * u, 68 * u); path.lineTo(60 * u, 78 * u); path.close()
                      p.style = Paint.Style.FILL
                      p.color = Color.parseColor("#8D8D92")
                      c.drawPath(path, p)
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = 2 * u
                      p.color = Color.parseColor("#5C5C61")
                      c.drawLine(40 * u, 40 * u, 52 * u, 62 * u, p)
                      c.drawLine(52 * u, 62 * u, 70 * u, 58 * u, p)
                  }
                  st == 0 -> {
                      p.style = Paint.Style.FILL
                      p.shader = LinearGradient(0f, 40 * u, 0f, 64 * u,
                          intArrayOf(Color.parseColor("#F5F5F5"), Color.parseColor("#8E8E93"), Color.parseColor("#D8D8DC")),
                          null, Shader.TileMode.CLAMP)
                      c.drawRoundRect(RectF(14 * u, 40 * u, 86 * u, 64 * u), 6 * u, 6 * u, p)
                      p.shader = null
                  }
                  else -> {
                      p.style = Paint.Style.FILL
                      p.color = Color.parseColor("#E53935")
                      c.drawCircle(50 * u, 50 * u, 40 * u, p)
                      p.color = Color.WHITE
                      p.textAlign = Paint.Align.CENTER
                      p.typeface = Typeface.DEFAULT_BOLD
                      p.textSize = 62 * u
                      c.drawText("!", 50 * u, 50 * u + 22 * u, p)
                  }
              }
          }

          /** Indicador de internet. Estados: 4..0 = pontos de sinal, -1 = sem conexão. */
          class NetView(c: Context) : View(c) {
              var state = -1
              var editing = false
              val bmps = HashMap<Int, Bitmap>()
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val b = bmps[state]
                  if (b != null) drawFit(cv, b, w, h, p) else drawNetDefault(cv, state, minOf(w, h))
                  if (editing) editBox(cv, w, h, p)
              }
          }

          /** Área perto da câmera onde os dois círculos são desenhados (só aparece no modo de edição). */
          class ZoneView(c: Context) : View(c) {
              var editing = false
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(cv: Canvas) {
                  if (!editing) return
                  val w = width.toFloat()
                  val h = height.toFloat()
                  p.style = Paint.Style.FILL
                  p.color = Color.argb(50, 109, 74, 255)
                  cv.drawCircle(w / 2, h / 2, minOf(w, h) / 2, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 4f
                  p.color = Color.parseColor("#FFD400")
                  p.pathEffect = DashPathEffect(floatArrayOf(14f, 10f), 0f)
                  cv.drawCircle(w / 2, h / 2, minOf(w, h) / 2 - 2f, p)
                  p.pathEffect = null
                  p.style = Paint.Style.FILL
                  p.color = Color.WHITE
                  p.textAlign = Paint.Align.CENTER
                  p.textSize = minOf(w, h) * 0.14f
                  cv.drawText("círculos aqui", w / 2, h / 2 + p.textSize * 0.35f, p)
              }

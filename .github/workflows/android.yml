          package com.notchcircle

          import android.content.Context
          import android.content.SharedPreferences

          /** Todas as configurações ficam aqui, salvas no aparelho. */
          object Prefs {
              private lateinit var sp: SharedPreferences

              fun init(c: Context) {
                  if (!::sp.isInitialized) sp = c.applicationContext.getSharedPreferences("notch", Context.MODE_PRIVATE)
              }

              fun bool(k: String, d: Boolean): Boolean = sp.getBoolean(k, d)
              fun putBool(k: String, v: Boolean) = sp.edit().putBoolean(k, v).apply()
              fun int(k: String, d: Int): Int = sp.getInt(k, d)
              fun putInt(k: String, v: Int) = sp.edit().putInt(k, v).apply()
              fun long(k: String, d: Long): Long = sp.getLong(k, d)
              fun putLong(k: String, v: Long) = sp.edit().putLong(k, v).apply()
              fun strs(k: String): Set<String> = sp.getStringSet(k, emptySet()) ?: emptySet()
              fun putStrs(k: String, v: Set<String>) = sp.edit().putStringSet(k, HashSet(v)).apply()

              /** Cada elemento (zone, btn, bat, clk, tim, net) liga e desliga sozinho. */
              fun on(id: String): Boolean = bool(id + "_on", id == "zone")

              fun resetPositions() {
                  val e = sp.edit()
                  val rx = Regex("^(zone|btn|bat|clk|tim|net)_[xy]_[lp]$")
                  for (k in sp.all.keys) if (rx.matches(k)) e.remove(k)
                  e.apply()
              }

              fun resetAll() = sp.edit().clear().apply()
          }

          /** Botão do seletor de apps: segure o tempo configurado pra abrir o círculo. */
          class BtnView(c: Context) : View(c) {
              var editing = false
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat()
                  val r = w / 2
                  p.style = Paint.Style.FILL
                  p.color = Color.argb(170, 109, 74, 255)
                  cv.drawCircle(r, r, r - 3f, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = w * 0.07f
                  p.color = Color.WHITE
                  cv.drawCircle(r, r, r * 0.55f, p)
                  if (editing) editBox(cv, w, w, p)
              }
          }

          /** Detecta dois círculos rápidos em sequência. */
          class CircleDetector(private val onTwo: () -> Unit) {
              var thresholdDeg = 290f
              var gapMs = 1200L
              var minStep = 12f
              private var lastX = 0f
              private var lastY = 0f
              private var lastDir = Float.NaN
              private var ang = 0f
              private var circles = 0
              private var firstT = 0L

              fun onTouch(e: MotionEvent) {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          lastX = e.x; lastY = e.y; lastDir = Float.NaN; ang = 0f
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = e.x - lastX
                          val dy = e.y - lastY
                          if (hypot(dx, dy) < minStep) return
                          val dir = atan2(dy, dx)
                          if (!lastDir.isNaN()) {
                              var d = dir - lastDir
                              while (d > PI) d -= (2 * PI).toFloat()
                              while (d < -PI) d += (2 * PI).toFloat()
                              ang += d
                          }
                          lastDir = dir; lastX = e.x; lastY = e.y
                          if (abs(ang) >= Math.toRadians(thresholdDeg.toDouble()).toFloat()) {
                              ang = 0f
                              done()
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> lastDir = Float.NaN
                  }
              }

              private fun done() {
                  val now = SystemClock.uptimeMillis()
                  if (circles == 1 && now - firstT <= gapMs) {
                      circles = 0
                      onTwo()
                  } else {
                      circles = 1
                      firstT = now
                  }
              }
          }

          /** O círculo de ícones (usado pelas notificações e pelo seletor de apps). */
          class RingView(c: Context) : View(c) {
              class Item(val key: String, val label: String, val pkg: String, val badge: Int, val text: String?)

              var items: List<Item> = emptyList()
              var cx = 0f
              var cy = 0f
              var radius = 0f
              var perPage = 8
              var dimAlpha = 51
              var dropCenter = false
              var emptyMsg = "Nada por aqui"
              var onTap: (Item) -> Unit = {}
              var onDrop: (Item) -> Unit = {}
              var onClose: () -> Unit = {}

              private val dn = resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tp = TextPaint(Paint.ANTI_ALIAS_FLAG)
              private val icons = HashMap<String, Drawable?>()
              private var page = 0
              private var touchItem: Item? = null
              private var sx = 0f
              private var sy = 0f
              private var fx = 0f
              private var fy = 0f
              private var moved = false
              private var preview: Item? = null
              private val longRun = Runnable {
                  val t = touchItem
                  if (!moved && t != null && t.text != null) {
                      preview = t
                      invalidate()
                  }
              }

              private fun pages() = maxOf(1, (items.size + perPage - 1) / perPage)

              private fun pageItems(): List<Item> {
                  page = page.coerceIn(0, pages() - 1)
                  return items.drop(page * perPage).take(perPage)
              }

              private fun icon(i: Item): Drawable? = icons.getOrPut(i.pkg) {
                  try { context.packageManager.getApplicationIcon(i.pkg) } catch (_: Exception) { null }
              }

              /** Ângulo inicial e abertura do arco visível (180° se o centro está na borda da tela). */
              private fun arc(): Pair<Float, Float> {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val need = radius * 1.25f
                  val m = minOf(minOf(cy, h - cy), minOf(cx, w - cx))
                  if (m >= need) return Pair(-90f, 360f)
                  return when (m) {
                      cy -> Pair(0f, 180f)
                      h - cy -> Pair(180f, 180f)
                      cx -> Pair(-90f, 180f)
                      else -> Pair(90f, 180f)
                  }
              }

              private fun iconSize(n: Int): Float {
                  val sw = arc().second
                  val len = radius * Math.toRadians(sw.toDouble()).toFloat()
                  return minOf(radius * 0.36f, len / maxOf(n, 1) * 0.82f)
              }

              private fun positions(n: Int): List<PointF> {
                  val (a0, sw) = arc()
                  val full = sw >= 360f
                  return List(n) { i ->
                      val deg = if (full) a0 + sw * i / n else a0 + sw * (i + 0.5f) / n
                      val a = Math.toRadians(deg.toDouble())
                      PointF(cx + radius * cos(a).toFloat(), cy + radius * sin(a).toFloat())
                  }
              }

              private fun navBase(): PointF {
                  val (a0, sw) = arc()
                  if (sw >= 360f) return PointF(cx, cy)
                  val mid = Math.toRadians((a0 + sw / 2).toDouble())
                  return PointF(cx + 0.42f * radius * cos(mid).toFloat(), cy + 0.42f * radius * sin(mid).toFloat())
              }

              private fun txt(c: Canvas, s: String, x: Float, y: Float, size: Float, align: Paint.Align, bold: Boolean) {
                  tp.color = Color.WHITE
                  tp.textSize = size
                  tp.textAlign = align
                  tp.isFakeBoldText = bold
                  c.drawText(s, x, y, tp)
              }

              override fun onDraw(c: Canvas) {
                  c.drawColor(Color.argb(dimAlpha, 0, 0, 0))
                  val list = pageItems()
                  val n = list.size
                  val (a0, sw) = arc()
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 2 * dn
                  p.color = Color.argb(70, 255, 255, 255)
                  c.drawArc(RectF(cx - radius, cy - radius, cx + radius, cy + radius), a0, sw, false, p)
                  val nb = navBase()
                  if (n == 0) txt(c, emptyMsg, width / 2f, nb.y + 40 * dn, 16 * dn, Paint.Align.CENTER, true)
                  val ic = iconSize(n)
                  val pos = positions(n)
                  for (i in 0 until n) {
                      val it0 = list[i]
                      val faded = touchItem === it0 && moved
                      val x = pos[i].x
                      val y = pos[i].y
                      p.style = Paint.Style.FILL
                      p.color = Color.argb(if (faded) 40 else 200, 30, 30, 40)
                      c.drawCircle(x, y, ic * 0.62f, p)
                      val d = icon(it0)
                      if (d != null) {
                          d.setBounds((x - ic / 2).toInt(), (y - ic / 2).toInt(), (x + ic / 2).toInt(), (y + ic / 2).toInt())
                          d.alpha = if (faded) 90 else 255
                          d.draw(c)
                      }
                      if (it0.badge > 1) {
                          p.color = Color.parseColor("#E53935")
                          c.drawCircle(x + ic * 0.38f, y - ic * 0.38f, ic * 0.24f, p)
                          txt(c, it0.badge.toString(), x + ic * 0.38f, y - ic * 0.38f + ic * 0.09f, ic * 0.26f, Paint.Align.CENTER, true)
                      }
                  }
                  if (dropCenter) {
                      val s = ic * 0.45f
                      p.style = Paint.Style.FILL
                      p.color = Color.argb(140, 255, 80, 80)
                      c.drawRoundRect(RectF(cx - s, cy - s, cx + s, cy + s), 8 * dn, 8 * dn, p)
                      txt(c, "✕", cx, cy + s * 0.35f, s, Paint.Align.CENTER, true)
                  }
                  if (pages() > 1) {
                      val ar = radius * 0.3f
                      txt(c, "‹", nb.x - ar, nb.y + 10 * dn, 34 * dn, Paint.Align.CENTER, true)
                      txt(c, "›", nb.x + ar, nb.y + 10 * dn, 34 * dn, Paint.Align.CENTER, true)
                      txt(c, (page + 1).toString() + "/" + pages(), nb.x, nb.y + 6 * dn, 14 * dn, Paint.Align.CENTER, false)
                  }
                  val t = touchItem
                  if (t != null && moved) {
                      val d = icon(t)
                      if (d != null) {
                          val s = ic * 1.15f
                          d.setBounds((fx - s / 2).toInt(), (fy - s / 2).toInt(), (fx + s / 2).toInt(), (fy + s / 2).toInt())
                          d.alpha = 255
                          d.draw(c)
                      }
                  }
                  val pv = preview
                  if (pv != null) {
                      val body = pv.text ?: ""
                      val w = width * 0.8f
                      tp.textSize = 14 * dn
                      tp.color = Color.WHITE
                      tp.isFakeBoldText = false
                      val lay = StaticLayout.Builder.obtain(body, 0, body.length, tp, (w - 24 * dn).toInt())
                          .setMaxLines(4).setEllipsize(TextUtils.TruncateAt.END).build()
                      val th = lay.height + 52 * dn
                      val left = (width - w) / 2
                      val top = minOf(height - th - 24 * dn, maxOf(cy + radius * 1.35f, 24 * dn))
                      p.style = Paint.Style.FILL
                      p.color = Color.argb(235, 28, 28, 34)
                      c.drawRoundRect(RectF(left, top, left + w, top + th), 18 * dn, 18 * dn, p)
                      txt(c, pv.label, left + 12 * dn, top + 26 * dn, 15 * dn, Paint.Align.LEFT, true)
                      tp.textAlign = Paint.Align.LEFT
                      tp.isFakeBoldText = false
                      tp.textSize = 14 * dn
                      c.save()
                      c.translate(left + 12 * dn, top + 36 * dn)
                      lay.draw(c)
                      c.restore()
                  }
              }

              private fun hit(x: Float, y: Float): Item? {
                  val list = pageItems()
                  val ic = iconSize(list.size)
                  val pos = positions(list.size)
                  for (i in list.indices) if (hypot(x - pos[i].x, y - pos[i].y) <= ic * 0.65f) return list[i]
                  return null
              }

              private fun navHit(x: Float, y: Float): Boolean {
                  if (pages() <= 1) return false
                  val nb = navBase()
                  val ar = radius * 0.3f
                  val r = maxOf(radius * 0.18f, 28 * dn)
                  if (hypot(x - (nb.x - ar), y - nb.y) <= r) { page = (page + pages() - 1) % pages(); return true }
                  if (hypot(x - (nb.x + ar), y - nb.y) <= r) { page = (page + 1) % pages(); return true }
                  return false
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          sx = e.x; sy = e.y; fx = e.x; fy = e.y; moved = false; preview = null
                          touchItem = hit(e.x, e.y)
                          if (touchItem != null) postDelayed(longRun, 450)
                      }
                      MotionEvent.ACTION_MOVE -> if (touchItem != null) {
                          fx = e.x; fy = e.y
                          if (hypot(e.x - sx, e.y - sy) > 14 * dn) {
                              moved = true
                              removeCallbacks(longRun)
                              preview = null
                          }
                          invalidate()
                      }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longRun)
                          val t = touchItem
                          if (t != null) {
                              if (moved) {
                                  val dist = hypot(e.x - cx, e.y - cy)
                                  val drop = if (dropCenter) dist < iconSize(1) else dist > radius * 1.6f
                                  if (drop) onDrop(t)
                              } else if (preview == null) {
                                  onTap(t)
                              }
                          } else if (!navHit(e.x, e.y)) {
                              onClose()
                          }
                          touchItem = null; preview = null; moved = false
                          invalidate()
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          removeCallbacks(longRun)
                          touchItem = null; preview = null; moved = false
                          invalidate()
                      }
                  }
                  return true
              }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">NOTCH CIRCLE</string>
              <string name="service_desc">Mostra painéis circulares e indicadores (bateria, relógio, tempo de uso, internet) por cima dos apps. Só vê qual app está aberto, não lê o conteúdo das telas.</string>
          </resources>
          EOF
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="0"
              android:description="@string/service_desc" />
          EOF

      - name: Compilar
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "=== ERROS DE COMPILACAO (me mande um print disto) ==="
            grep -E "^e: |What went wrong" -A3 build.log | head -80
            exit 1
          }
          echo "Compilou sem erros."

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: notch-circle-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "notch-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --title "NOTCH CIRCLE #${{ github.run_number }}" \
            --notes "Baixe o app-debug.apk e instale no celular."

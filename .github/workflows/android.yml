# NOTCH CIRCLE. Coloque este arquivo em .github/workflows/android.yml
# Ele monta o projeto Android, compila na nuvem e publica o APK em "Releases" (e como artefato).
name: Gerar APK do NOTCH CIRCLE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar o projeto Android
        run: |
          mkdir -p app app/src/main app/src/main/java/com/notchcircle app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NotchCircle"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.notchcircle"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.notchcircle"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:label="@string/app_name">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".AppsActivity" android:exported="false" android:label="Escolher apps" />

                  <service
                      android:name=".NotchService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".NotifService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/notchcircle/AppsActivity.kt <<'EOF'
          package com.notchcircle

          import android.app.Activity
          import android.content.Intent
          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView

          /** Lista os apps instalados; os marcados são onde o gato aparece (no modo "só nos apps escolhidos"). */
          class AppsActivity : Activity() {
              private class Item(val label: String, val pkg: String, val icon: Drawable)
              private class Row(val icon: ImageView, val name: TextView, val chk: CheckBox)

              private val all = ArrayList<Item>()
              private val shown = ArrayList<Item>()
              private val sel = HashSet<String>()
              private lateinit var adapter: BaseAdapter
              private lateinit var key: String

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Prefs.init(this)
                  key = intent.getStringExtra("key") ?: "sel_notif"
                  sel.addAll(Prefs.strs(key))

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.fitsSystemWindows = true
                  root.setPadding(dp(12), dp(12), dp(12), 0)
                  val info = TextView(this)
                  info.text = intent.getStringExtra("title") ?: "Marque os apps."
                  val search = EditText(this)
                  search.hint = "Buscar app…"
                  search.setSingleLine()
                  val list = ListView(this)
                  root.addView(info)
                  root.addView(search)
                  root.addView(list, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)

                  adapter = object : BaseAdapter() {
                      override fun getCount() = shown.size
                      override fun getItem(position: Int): Any = shown[position]
                      override fun getItemId(position: Int) = position.toLong()
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val row: Row
                          val v: View
                          if (convertView == null) {
                              val box = LinearLayout(this@AppsActivity)
                              box.orientation = LinearLayout.HORIZONTAL
                              box.gravity = Gravity.CENTER_VERTICAL
                              box.setPadding(0, dp(6), 0, dp(6))
                              val ic = ImageView(this@AppsActivity)
                              val nm = TextView(this@AppsActivity)
                              nm.setPadding(dp(12), 0, dp(12), 0)
                              val ck = CheckBox(this@AppsActivity)
                              ck.isClickable = false
                              ck.isFocusable = false
                              box.addView(ic, LinearLayout.LayoutParams(dp(40), dp(40)))
                              box.addView(nm, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                              box.addView(ck)
                              row = Row(ic, nm, ck)
                              box.tag = row
                              v = box
                          } else {
                              v = convertView
                              row = convertView.tag as Row
                          }
                          val item = shown[position]
                          row.icon.setImageDrawable(item.icon)
                          row.name.text = item.label
                          row.chk.isChecked = sel.contains(item.pkg)
                          return v
                      }
                  }
                  list.adapter = adapter
                  list.setOnItemClickListener { _, _, pos, _ ->
                      val pkg = shown[pos].pkg
                      if (!sel.add(pkg)) sel.remove(pkg)
                      Prefs.putStrs(key, sel)
                      NotchService.instance?.refresh()
                      adapter.notifyDataSetChanged()
                  }
                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) { filter(s?.toString() ?: "") }
                  })

                  Thread {
                      val pm = packageManager
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val seen = HashSet<String>()
                      val tmp = ArrayList<Item>()
                      for (ri in pm.queryIntentActivities(intent, 0)) {
                          val p = ri.activityInfo.packageName
                          if (p == packageName || !seen.add(p)) continue
                          tmp.add(Item(ri.loadLabel(pm).toString(), p, ri.loadIcon(pm)))
                      }
                      tmp.sortBy { it.label.lowercase() }
                      runOnUiThread {
                          all.addAll(tmp)
                          filter(search.text.toString())
                      }
                  }.start()
              }

              private fun filter(q: String) {
                  shown.clear()
                  val k = q.trim().lowercase()
                  for (i in all) if (k.isEmpty() || i.label.lowercase().contains(k)) shown.add(i)
                  adapter.notifyDataSetChanged()
              }
          }
          EOF
          cat > app/src/main/java/com/notchcircle/MainActivity.kt <<'EOF'
          package com.notchcircle

          import android.Manifest
          import android.app.Activity
          import android.app.AppOpsManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private lateinit var col: LinearLayout
              private val checks = ArrayList<Triple<TextView, String, () -> Boolean>>()
              private val imgIds = mapOf(100 to "bat", 101 to "n4", 102 to "n3", 103 to "n2", 104 to "n1", 105 to "n0", 106 to "nx")

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              private fun LinearLayout.add(v: View, top: Int = 8) {
                  addView(v, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      .apply { topMargin = dp(top) })
              }

              private fun txt(s: String, size: Float = 0f, bold: Boolean = false) = TextView(this).apply {
                  text = s
                  if (size > 0f) textSize = size
                  if (bold) setTypeface(typeface, Typeface.BOLD)
              }

              private fun head(s: String) = col.add(txt(s, 20f, true), 24)

              private fun btn(s: String, onClick: () -> Unit) = Button(this).apply {
                  text = s
                  minHeight = dp(48)
                  setOnClickListener { onClick() }
              }

              private fun upd(images: Boolean = false) {
                  NotchService.instance?.refresh(images)
              }

              private fun tog(label: String, key: String, def: Boolean) = Switch(this).apply {
                  text = label
                  isChecked = Prefs.bool(key, def)
                  minHeight = dp(48)
                  setOnCheckedChangeListener { _, c -> Prefs.putBool(key, c); upd() }
              }

              private fun sld(name: String, key: String, lo: Int, hi: Int, def: Int, unit: String): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  val v = Prefs.int(key, def)
                  val t = txt("$name: $v$unit")
                  val s = SeekBar(this)
                  s.min = lo
                  s.max = hi
                  s.progress = v
                  s.contentDescription = name
                  s.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                          t.text = "$name: $p$unit"
                          if (fromUser) { Prefs.putInt(key, p); upd() }
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })
                  box.addView(t)
                  box.addView(s)
                  return box
              }

              private fun cyc(title: String, key: String, names: List<String>): Button {
                  val b = btn("") {}
                  val show = { b.text = title + ": " + names[Prefs.int(key, 0).coerceIn(0, names.size - 1)] }
                  show()
                  b.setOnClickListener {
                      Prefs.putInt(key, (Prefs.int(key, 0) + 1) % names.size)
                      show()
                      upd()
                  }
                  return b
              }

              private fun apps(key: String, title: String) = Intent(this, AppsActivity::class.java).putExtra("key", key).putExtra("title", title)

              private fun perm(title: String, ok: () -> Boolean, action: () -> Unit) {
                  val t = txt("")
                  checks.add(Triple(t, title, ok))
                  col.add(t)
                  col.add(btn("Abrir: $title", action), 4)
              }

              private fun accOn(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  return s.contains(packageName) && s.contains("NotchService")
              }

              private fun notifOn(): Boolean =
                  (Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: "").contains(packageName)

              @Suppress("DEPRECATION")
              private fun usageOn(): Boolean = try {
                  val ops = getSystemService(APP_OPS_SERVICE) as AppOpsManager
                  ops.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName) == AppOpsManager.MODE_ALLOWED
              } catch (_: Exception) { false }

              private fun image(label: String, code: Int) = btn(label) { pick(code) }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Prefs.init(this)
                  col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(16), dp(16), dp(16), dp(40))
                  val scroll = ScrollView(this)
                  scroll.fitsSystemWindows = true
                  scroll.addView(col)
                  setContentView(scroll)

                  col.add(txt("NOTCH CIRCLE", 28f, true))
                  col.add(txt("Painéis circulares e indicadores por cima dos apps. Cada recurso liga e desliga sozinho."))
                  status = txt("", 0f, true)
                  col.add(status)
                  col.add(tog("Ligar o NOTCH CIRCLE (geral)", "enabled", true))
                  col.add(tog("Modo de edição: arraste cada elemento na tela (prévia ao vivo)", "editing", false))
                  col.add(txt("Desligue o modo de edição quando terminar. Nele, os gestos e botões não funcionam."))
                  col.add(btn("Voltar todas as posições ao padrão") { Prefs.resetPositions(); upd() })

                  head("1. Notificações circulares")
                  col.add(tog("Ativar a área do gesto (dois círculos perto da câmera)", "zone_on", true))
                  col.add(sld("Tamanho da área", "zone_size", 60, 260, 120, " dp"))
                  col.add(sld("Sensibilidade (maior = reconhece círculos mais abertos)", "z_sens", 1, 10, 5, ""))
                  col.add(sld("Tempo máximo entre os dois círculos", "z_gap", 300, 2500, 1200, " ms"))
                  col.add(sld("Escurecer o fundo", "dim", 0, 60, 20, "%"))
                  col.add(sld("Tamanho do círculo", "n_radius", 90, 220, 140, " dp"))
                  col.add(sld("Notificações por página", "n_per", 4, 12, 8, ""))
                  col.add(txt("A posição da área muda no modo de edição. A área captura os toques dentro dela, então deixe pequena. Toque abre, segure mostra prévia, arraste pra fora dispensa."))
                  col.add(btn("Abrir o painel de notificações agora (teste)") {
                      val s = NotchService.instance
                      if (s == null) Toast.makeText(this, "Ligue o serviço de acessibilidade primeiro.", Toast.LENGTH_LONG).show()
                      else s.openRing(0)
                  })

                  head("2. Seletor circular de apps")
                  col.add(tog("Ativar o botão do seletor", "btn_on", false))
                  col.add(sld("Tempo segurando pra abrir", "btn_hold", 300, 3000, 1000, " ms"))
                  col.add(sld("Tamanho do botão", "btn_size", 32, 120, 56, " dp"))
                  col.add(sld("Tamanho do círculo", "a_radius", 90, 220, 130, " dp"))
                  col.add(sld("Apps por página", "a_per", 4, 14, 10, ""))
                  col.add(txt("Arraste um app pro quadrado do centro pra tirá-lo do círculo. O Android não deixa remover apps dos recentes do sistema, então ele só some daqui."))
                  col.add(btn("Trazer de volta os apps removidos do círculo") { Prefs.putStrs("ring_hidden", emptySet()) })

                  head("3. Bateria")
                  col.add(tog("Mostrar a bateria", "bat_on", false))
                  col.add(sld("Tamanho", "bat_size", 14, 80, 28, " dp"))
                  col.add(tog("Mostrar a porcentagem", "bat_pct", true))
                  col.add(image("Usar minha imagem de bateria", 100))

                  head("4. Relógio")
                  col.add(tog("Mostrar o relógio", "clk_on", false))
                  col.add(sld("Tamanho do texto", "clk_size", 10, 80, 22, " sp"))
                  col.add(tog("Formato de 24 horas", "clk_24", true))

                  head("5. Tempo nos aplicativos")
                  col.add(tog("Mostrar o tempo no app atual", "tim_on", false))
                  col.add(sld("Tamanho do texto", "tim_size", 10, 60, 16, " sp"))
                  col.add(tog("Mostrar também o total do dia nesse app", "tim_day", false))
                  col.add(tog("Formato por extenso (12 min 30 s)", "tim_long", false))

                  head("6. Conexão")
                  col.add(tog("Mostrar o indicador de internet", "net_on", false))
                  col.add(sld("Tamanho", "net_size", 16, 100, 28, " dp"))
                  col.add(cyc("Fonte", "net_src", listOf("Automática", "Só Wi-Fi", "Só rede móvel")))
                  col.add(txt("Imagens por nível (padrão: formiga com folha, semente, pedra, metal, exclamação):"))
                  col.add(image("Imagem: 4 pontos", 101))
                  col.add(image("Imagem: 3 pontos", 102))
                  col.add(image("Imagem: 2 pontos", 103))
                  col.add(image("Imagem: 1 ponto", 104))
                  col.add(image("Imagem: 0 pontos", 105))
                  col.add(image("Imagem: sem conexão", 106))
                  col.add(btn("Voltar às imagens padrão (bateria e conexão)") {
                      for (id in imgIds.values) File(filesDir, "img_$id").delete()
                      upd(true)
                  })

                  head("7. Personalização")
                  col.add(txt("Arraste tudo no modo de edição (ligado lá em cima). O tamanho de cada item é o controle de tamanho da sua seção. Imagens PNG, JPG e WEBP."))
                  col.add(btn("Restaurar TODAS as configurações padrão") {
                      Prefs.resetAll()
                      upd(true)
                      recreate()
                  })

                  head("8. Privacidade")
                  col.add(tog("Ler notificações", "n_read", true))
                  col.add(cyc("Conteúdo das notificações", "n_priv", listOf("Normal", "Modo privado (ocultar o texto)", "Só ícone e quantidade")))
                  col.add(tog("Mostrar só os apps que eu escolher", "n_only", false))
                  col.add(btn("Escolher apps que podem aparecer nas notificações") {
                      startActivity(apps("sel_notif", "Apps que podem aparecer no círculo de notificações."))
                  })
                  col.add(tog("Esconder indicadores nos apps que eu escolher", "hide_on", false))
                  col.add(btn("Escolher apps onde os indicadores somem") {
                      startActivity(apps("sel_hide", "Nestes apps, bateria, relógio, tempo e internet ficam escondidos."))
                  })

                  head("9. Permissões")
                  perm("Serviço de acessibilidade (obrigatório)", { accOn() }) { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  perm("Acesso a notificações", { notifOn() }) { startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) }
                  perm("Aparecer sobre outros apps (ajuda a abrir os apps)", { Settings.canDrawOverlays(this) }) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  perm("Acesso ao uso (ordena os apps pelos mais recentes)", { usageOn() }) { startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)) }
                  perm("Telefone (sinal da rede móvel)", { checkSelfPermission(Manifest.permission.READ_PHONE_STATE) == PackageManager.PERMISSION_GRANTED }) {
                      requestPermissions(arrayOf(Manifest.permission.READ_PHONE_STATE), 9)
                  }
                  col.add(txt("Se o botão da acessibilidade ficar cinza, vá em Ajustes > Apps > NOTCH CIRCLE > 3 pontinhos > Permitir configurações restritas."))
              }

              override fun onResume() {
                  super.onResume()
                  val on = accOn() && Prefs.bool("enabled", true)
                  status.text = if (on) "Estado: ATIVO ✔" else if (!accOn()) "Estado: INATIVO. Ligue o serviço de acessibilidade (seção Permissões)." else "Estado: DESLIGADO no botão geral."
                  for ((tv, title, ok) in checks) tv.text = (if (ok()) "✔ " else "✖ ") + title
                  NotchService.instance?.setForeground(packageName)
              }

              private fun pick(code: Int) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "image/*"
                  @Suppress("DEPRECATION")
                  startActivityForResult(i, code)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  val id = imgIds[requestCode] ?: return
                  if (resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  try {
                      contentResolver.openInputStream(uri)?.use { inp ->
                          FileOutputStream(File(filesDir, "img_$id")).use { out -> inp.copyTo(out) }
                      }
                      upd(true)
                      Toast.makeText(this, "Pronto!", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Não consegui abrir essa imagem.", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/notchcircle/NotchService.kt <<'EOF'
          package com.notchcircle

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.usage.UsageStatsManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.wifi.WifiManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.telephony.TelephonyManager
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.WindowManager.LayoutParams as LP
          import android.view.accessibility.AccessibilityEvent
          import android.view.inputmethod.InputMethodManager
          import android.widget.TextView
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          private class Elem(val id: String, val view: View, val lp: LP)

          /**
           * O coração do NOTCH CIRCLE (serviço de acessibilidade):
           *  - área de gesto perto da câmera (dois círculos abrem o painel de notificações);
           *  - botão do seletor de apps (segurar abre o círculo de apps);
           *  - indicadores: bateria, relógio, tempo no app e internet;
           *  - sabe qual app está na frente (pra contar o tempo e esconder indicadores).
           */
          class NotchService : AccessibilityService() {
              companion object {
                  var instance: NotchService? = null
                  private val FLAGS = LP.FLAG_NOT_FOCUSABLE or LP.FLAG_LAYOUT_IN_SCREEN or LP.FLAG_LAYOUT_NO_LIMITS
                  val DEF = mapOf("zone" to 120, "btn" to 56, "bat" to 28, "clk" to 22, "tim" to 16, "net" to 28)
              }

              private val ui = Handler(Looper.getMainLooper())
              private var wm: WindowManager? = null
              private val elems = ArrayList<Elem>()
              private val ignore = HashSet<String>()
              private var ready = false
              private var fg: String? = null
              private var panel: RingView? = null
              private var screenOn = true
              private var tickRunning = false

              private lateinit var zoneV: ZoneView
              private lateinit var btnV: BtnView
              private lateinit var batV: BatteryView
              private lateinit var clkV: TextView
              private lateinit var timV: TextView
              private lateinit var netV: NetView

              // tempo de uso
              private var curPkg: String? = null
              private var curStart = -1L
              private var sessStart = 0L

              private val detector = CircleDetector { openRing(0) }
              private val openApps = Runnable { openRing(1) }
              private val zoneTouch = View.OnTouchListener { _, e -> detector.onTouch(e); true }
              private val btnTouch = View.OnTouchListener { _, e ->
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> ui.postDelayed(openApps, Prefs.int("btn_hold", 1000).toLong())
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> ui.removeCallbacks(openApps)
                  }
                  true
              }

              private val tickRun = object : Runnable {
                  var n = 0
                  override fun run() {
                      if (!ready || !screenOn || !anyTick()) { tickRunning = false; return }
                      updateTexts()
                      n++
                      if (n % 5 == 0) updateNet()
                      ui.postDelayed(this, 1000)
                  }
              }

              private val batRcv = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      if (i == null) return
                      val lv = i.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                      val sc = i.getIntExtra(BatteryManager.EXTRA_SCALE, 100)
                      val st = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                      batV.level = if (lv >= 0) lv * 100 / maxOf(sc, 1) else 100
                      batV.charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                      batV.invalidate()
                  }
              }

              private val scrRcv = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      when (i?.action) {
                          Intent.ACTION_SCREEN_OFF -> {
                              screenOn = false
                              flush()
                              curStart = -1L
                              closeRing()
                          }
                          else -> {
                              screenOn = true
                              if (curPkg != null) curStart = SystemClock.uptimeMillis()
                              startTick()
                          }
                      }
                  }
              }

              private val netCb = object : ConnectivityManager.NetworkCallback() {
                  override fun onAvailable(network: Network) { ui.post { updateNet() } }
                  override fun onLost(network: Network) { ui.post { updateNet() } }
                  override fun onCapabilitiesChanged(network: Network, caps: NetworkCapabilities) { ui.post { updateNet() } }
              }

              // ---------------------------------------------------------------- criação
              private fun baseLp(): LP {
                  val l = LP(LP.WRAP_CONTENT, LP.WRAP_CONTENT, LP.TYPE_ACCESSIBILITY_OVERLAY, FLAGS, PixelFormat.TRANSLUCENT)
                  l.gravity = Gravity.TOP or Gravity.START
                  if (Build.VERSION.SDK_INT >= 28) l.layoutInDisplayCutoutMode = LP.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  return l
              }

              private fun add(id: String, v: View) {
                  val lp = baseLp()
                  wm?.addView(v, lp)
                  elems.add(Elem(id, v, lp))
              }

              private fun label(): TextView {
                  val t = TextView(this)
                  t.setTextColor(Color.WHITE)
                  t.setShadowLayer(5f, 0f, 0f, Color.BLACK)
                  t.setPadding(8, 4, 8, 4)
                  return t
              }

              private fun reg(r: BroadcastReceiver, f: IntentFilter): Intent? =
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(r, f, Context.RECEIVER_NOT_EXPORTED) else registerReceiver(r, f)

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Prefs.init(this)
                  instance = this
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  try {
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.enabledInputMethodList.forEach { ignore.add(it.packageName) }
                  } catch (_: Exception) { }
                  ignore.add("com.android.systemui")
                  ignore.add("android")
                  ignore.add(packageName)

                  zoneV = ZoneView(this); add("zone", zoneV)
                  btnV = BtnView(this); add("btn", btnV)
                  batV = BatteryView(this); add("bat", batV)
                  clkV = label(); add("clk", clkV)
                  timV = label(); add("tim", timV)
                  netV = NetView(this); add("net", netV)
                  ready = true

                  reg(batRcv, IntentFilter(Intent.ACTION_BATTERY_CHANGED))?.let { batRcv.onReceive(this, it) }
                  val sf = IntentFilter()
                  sf.addAction(Intent.ACTION_SCREEN_OFF)
                  sf.addAction(Intent.ACTION_SCREEN_ON)
                  sf.addAction(Intent.ACTION_USER_PRESENT)
                  reg(scrRcv, sf)
                  try {
                      (getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager).registerDefaultNetworkCallback(netCb)
                  } catch (_: Exception) { }
                  refresh(true)
              }

              // ---------------------------------------------------------------- posição e visibilidade
              private fun orient() = if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) "_l" else "_p"

              private fun elem(id: String): Elem = elems.first { it.id == id }

              private fun size(id: String) = Prefs.int(id + "_size", DEF.getValue(id))

              private fun dims(id: String, size: Int, dn: Float): Pair<Int, Int> = when (id) {
                  "zone", "btn", "net" -> Pair((size * dn).toInt(), (size * dn).toInt())
                  "bat" -> Pair((size * 2.6f * dn).toInt(), (size * dn).toInt())
                  else -> Pair(LP.WRAP_CONTENT, LP.WRAP_CONTENT)
              }

              private fun defaultPos(id: String, w: Int, h: Int, dn: Float, sw: Int, sh: Int): Pair<Int, Int> = when (id) {
                  "zone" -> Pair((sw - w) / 2, 0)
                  "btn" -> Pair(sw - w - (12 * dn).toInt(), (sh * 0.4f).toInt())
                  "bat" -> Pair(sw - w - (12 * dn).toInt(), (44 * dn).toInt())
                  "net" -> Pair(sw - w - (12 * dn).toInt(), (8 * dn).toInt())
                  "clk" -> Pair((12 * dn).toInt(), (44 * dn).toInt())
                  else -> Pair((12 * dn).toInt(), (90 * dn).toInt())
              }

              private fun shown(id: String): Boolean {
                  if (!Prefs.bool("enabled", true) || !Prefs.on(id)) return false
                  if (Prefs.bool("editing", false)) return true
                  val f = fg
                  if (id != "zone" && id != "btn" && Prefs.bool("hide_on", false) && f != null && Prefs.strs("sel_hide").contains(f)) return false
                  return true
              }

              private fun anyTick() = shown("clk") || shown("tim") || shown("net")

              private fun place(e: Elem, touchable: Boolean) {
                  val d = resources.displayMetrics
                  val dn = d.density
                  val s = size(e.id)
                  val (w, h) = dims(e.id, s, dn)
                  e.lp.width = w
                  e.lp.height = h
                  val vw = if (w > 0) w else maxOf(e.view.width, (s * dn * 4).toInt())
                  val vh = if (h > 0) h else maxOf(e.view.height, (s * dn * 1.6f).toInt())
                  val (dx, dy) = defaultPos(e.id, vw, vh, dn, d.widthPixels, d.heightPixels)
                  val sfx = orient()
                  e.lp.x = Prefs.int(e.id + "_x" + sfx, dx).coerceIn(0, maxOf(0, d.widthPixels - vw))
                  e.lp.y = Prefs.int(e.id + "_y" + sfx, dy).coerceIn(0, maxOf(0, d.heightPixels - vh))
                  e.lp.flags = FLAGS or (if (touchable) 0 else LP.FLAG_NOT_TOUCHABLE)
                  try { wm?.updateViewLayout(e.view, e.lp) } catch (_: Exception) { }
              }

              private fun dragger(e: Elem): View.OnTouchListener {
                  var lx = 0f
                  var ly = 0f
                  return View.OnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { lx = ev.rawX; ly = ev.rawY }
                          MotionEvent.ACTION_MOVE -> {
                              val d = resources.displayMetrics
                              val vw = if (e.lp.width > 0) e.lp.width else maxOf(e.view.width, 1)
                              val vh = if (e.lp.height > 0) e.lp.height else maxOf(e.view.height, 1)
                              e.lp.x = (e.lp.x + (ev.rawX - lx)).toInt().coerceIn(0, maxOf(0, d.widthPixels - vw))
                              e.lp.y = (e.lp.y + (ev.rawY - ly)).toInt().coerceIn(0, maxOf(0, d.heightPixels - vh))
                              lx = ev.rawX
                              ly = ev.rawY
                              try { wm?.updateViewLayout(e.view, e.lp) } catch (_: Exception) { }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              Prefs.putInt(e.id + "_x" + orient(), e.lp.x)
                              Prefs.putInt(e.id + "_y" + orient(), e.lp.y)
                          }
                      }
                      true
                  }
              }

              /** Relê todas as configurações. images=true também recarrega as imagens do usuário. */
              fun refresh(images: Boolean = false) {
                  if (!ready) return
                  val edit = Prefs.bool("editing", false)
                  val dn = resources.displayMetrics.density
                  detector.thresholdDeg = 340f - Prefs.int("z_sens", 5) * 10f
                  detector.gapMs = Prefs.int("z_gap", 1200).toLong()
                  detector.minStep = 6 * dn
                  zoneV.editing = edit; btnV.editing = edit; batV.editing = edit; netV.editing = edit
                  batV.showPct = Prefs.bool("bat_pct", true)
                  clkV.textSize = size("clk").toFloat()
                  timV.textSize = size("tim").toFloat()
                  val tint = if (edit) Color.argb(110, 109, 74, 255) else Color.TRANSPARENT
                  clkV.setBackgroundColor(tint)
                  timV.setBackgroundColor(tint)
                  if (images) {
                      batV.bmp = loadBitmap(File(filesDir, "img_bat"))
                      netV.bmps.clear()
                      for ((st, id) in listOf(4 to "n4", 3 to "n3", 2 to "n2", 1 to "n1", 0 to "n0", -1 to "nx")) {
                          val b = loadBitmap(File(filesDir, "img_$id"))
                          if (b != null) netV.bmps[st] = b
                      }
                  }
                  for (e in elems) {
                      val vis = shown(e.id)
                      e.view.visibility = if (vis) View.VISIBLE else View.GONE
                      place(e, vis && (edit || e.id == "zone" || e.id == "btn"))
                      e.view.setOnTouchListener(when {
                          edit -> dragger(e)
                          e.id == "zone" -> zoneTouch
                          e.id == "btn" -> btnTouch
                          else -> null
                      })
                  }
                  if (!Prefs.bool("enabled", true) || edit) closeRing()
                  updateTexts()
                  updateNet()
                  startTick()
                  for (e in elems) e.view.invalidate()
              }

              private fun startTick() {
                  if (tickRunning || !ready || !screenOn || !anyTick()) return
                  tickRunning = true
                  ui.post(tickRun)
              }

              // ---------------------------------------------------------------- textos e tempo
              private fun day() = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())

              private fun flush() {
                  val p = curPkg ?: return
                  if (curStart < 0) return
                  val now = SystemClock.uptimeMillis()
                  val k = "d_" + day() + "_" + p
                  Prefs.putLong(k, Prefs.long(k, 0L) + (now - curStart))
                  curStart = now
              }

              private fun switchTo(p: String) {
                  if (p == curPkg) return
                  flush()
                  curPkg = p
                  curStart = SystemClock.uptimeMillis()
                  sessStart = curStart
              }

              private fun fmt(ms: Long, long: Boolean): String {
                  val s = ms / 1000
                  val h = s / 3600
                  val m = (s % 3600) / 60
                  val sec = s % 60
                  return if (long) {
                      if (h > 0) "$h h $m min" else if (m > 0) "$m min $sec s" else "$sec s"
                  } else {
                      if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, sec) else String.format(Locale.US, "%d:%02d", m, sec)
                  }
              }

              private fun updateTexts() {
                  if (!ready) return
                  if (shown("clk")) {
                      val f = if (Prefs.bool("clk_24", true)) "HH:mm" else "h:mm a"
                      clkV.text = SimpleDateFormat(f, Locale.getDefault()).format(Date())
                  }
                  if (shown("tim")) {
                      val p = curPkg
                      if (p != null && curStart >= 0) {
                          val now = SystemClock.uptimeMillis()
                          val long = Prefs.bool("tim_long", false)
                          val sb = StringBuilder(fmt(now - sessStart, long))
                          if (Prefs.bool("tim_day", false)) {
                              val tot = Prefs.long("d_" + day() + "_" + p, 0L) + (now - curStart)
                              sb.append("  ·  hoje ").append(fmt(tot, long))
                          }
                          timV.text = sb.toString()
                      } else {
                          timV.text = "0:00"
                      }
                  }
              }

              // ---------------------------------------------------------------- internet
              @Suppress("DEPRECATION")
              private fun wifiLevel(): Int = try {
                  val w = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager
                  WifiManager.calculateSignalLevel(w.connectionInfo.rssi, 5)
              } catch (_: Exception) { 3 }

              private fun cellLevel(): Int = try {
                  val tm = getSystemService(TELEPHONY_SERVICE) as TelephonyManager
                  tm.signalStrength?.level ?: 3
              } catch (_: Exception) { 3 }

              /** 4..0 = pontos de sinal; -1 = sem conexão de verdade (não validada). */
              private fun netState(): Int {
                  val cm = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                  val n = cm.activeNetwork ?: return -1
                  val c = cm.getNetworkCapabilities(n) ?: return -1
                  if (!c.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) ||
                      !c.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)) return -1
                  val wifi = c.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)
                  val cell = c.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)
                  val src = Prefs.int("net_src", 0)
                  if (src == 1 && !wifi) return -1
                  if (src == 2 && !cell) return -1
                  return if (wifi) wifiLevel() else if (cell) cellLevel() else 4
              }

              private fun updateNet() {
                  if (!ready || !shown("net")) return
                  netV.state = try { netState() } catch (_: Exception) { -1 }
                  netV.invalidate()
              }

              // ---------------------------------------------------------------- painéis circulares
              private fun appLabel(pkg: String): String = try {
                  packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
              } catch (_: Exception) { pkg }

              private fun notifItems(gone: Set<String>): List<RingView.Item> {
                  val ns = NotifService.instance ?: return emptyList()
                  if (!Prefs.bool("n_read", true)) return emptyList()
                  val only = Prefs.bool("n_only", false)
                  val allow = Prefs.strs("sel_notif")
                  val mode = Prefs.int("n_priv", 0)
                  val groups = ns.active()
                      .filter { !it.isOngoing && it.packageName != packageName && !gone.contains(it.packageName) }
                      .filter { !only || allow.contains(it.packageName) }
                      .groupBy { it.packageName }
                  return groups.entries.sortedByDescending { en -> en.value.maxOf { it.postTime } }.map { en ->
                      val last = en.value.maxByOrNull { it.postTime }!!
                      val ex = last.notification.extras
                      val t = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                      val b = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                      val txt = when (mode) {
                          0 -> (t + "\n" + b).trim()
                          1 -> "Conteúdo oculto"
                          else -> null
                      }
                      RingView.Item(en.key, appLabel(en.key), en.key, en.value.size, txt)
                  }
              }

              private fun recentUsage(): Map<String, Long> = try {
                  val um = getSystemService(USAGE_STATS_SERVICE) as UsageStatsManager
                  val now = System.currentTimeMillis()
                  um.queryUsageStats(UsageStatsManager.INTERVAL_DAILY, now - 7 * 86400000L, now).associate { it.packageName to it.lastTimeUsed }
              } catch (_: Exception) { emptyMap() }

              private fun appItems(): List<RingView.Item> {
                  val pm = packageManager
                  val hidden = Prefs.strs("ring_hidden")
                  val used = recentUsage()
                  val seen = HashSet<String>()
                  val out = ArrayList<RingView.Item>()
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  for (ri in pm.queryIntentActivities(intent, 0)) {
                      val p = ri.activityInfo.packageName
                      if (p == packageName || hidden.contains(p) || !seen.add(p)) continue
                      out.add(RingView.Item(p, ri.loadLabel(pm).toString(), p, 0, null))
                  }
                  return out.sortedWith(compareByDescending<RingView.Item> { used[it.pkg] ?: 0L }.thenBy { it.label.lowercase() })
              }

              private fun launch(pkg: String) {
                  try {
                      val i = packageManager.getLaunchIntentForPackage(pkg) ?: return
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                      startActivity(i)
                  } catch (_: Exception) { }
              }

              private fun openNotif(pkg: String) {
                  val ns = NotifService.instance
                  val sbn = ns?.active()?.filter { it.packageName == pkg }?.maxByOrNull { it.postTime }
                  val pi = sbn?.notification?.contentIntent
                  if (ns != null && sbn != null && pi != null) {
                      try {
                          pi.send()
                          if ((sbn.notification.flags and Notification.FLAG_AUTO_CANCEL) != 0) ns.cancelNotification(sbn.key)
                          return
                      } catch (_: Exception) { }
                  }
                  launch(pkg)
              }

              private fun dismissNotif(pkg: String) {
                  val ns = NotifService.instance ?: return
                  ns.active().filter { it.packageName == pkg }.forEach { ns.cancelNotification(it.key) }
              }

              /** mode 0 = notificações (centro na câmera); mode 1 = seletor de apps (centro no botão). */
              fun openRing(mode: Int) {
                  if (!ready || !Prefs.bool("enabled", true) || Prefs.bool("editing", false)) return
                  closeRing()
                  val dn = resources.displayMetrics.density
                  val e = elem(if (mode == 0) "zone" else "btn")
                  val rv = RingView(this)
                  rv.cx = (e.lp.x + e.lp.width / 2).toFloat()
                  rv.cy = (e.lp.y + e.lp.height / 2).toFloat()
                  rv.radius = Prefs.int(if (mode == 0) "n_radius" else "a_radius", if (mode == 0) 140 else 130) * dn
                  rv.dimAlpha = Prefs.int("dim", 20) * 255 / 100
                  rv.perPage = Prefs.int(if (mode == 0) "n_per" else "a_per", if (mode == 0) 8 else 10)
                  rv.dropCenter = mode == 1
                  rv.emptyMsg = when {
                      mode == 1 -> "Nenhum app"
                      NotifService.instance == null -> "Autorize o acesso a notificações no NOTCH CIRCLE"
                      !Prefs.bool("n_read", true) -> "Leitura de notificações desativada"
                      else -> "Sem notificações"
                  }
                  val gone = HashSet<String>()
                  fun reload() {
                      rv.items = if (mode == 0) notifItems(gone) else appItems()
                      rv.invalidate()
                  }
                  rv.onClose = { closeRing() }
                  rv.onTap = { it0 ->
                      if (mode == 0) openNotif(it0.pkg) else launch(it0.pkg)
                      closeRing()
                  }
                  rv.onDrop = { it0 ->
                      if (mode == 0) {
                          gone.add(it0.pkg)
                          dismissNotif(it0.pkg)
                      } else {
                          Prefs.putStrs("ring_hidden", Prefs.strs("ring_hidden") + it0.pkg)
                      }
                      reload()
                  }
                  reload()
                  val lp = LP(LP.MATCH_PARENT, LP.MATCH_PARENT, LP.TYPE_ACCESSIBILITY_OVERLAY, FLAGS, PixelFormat.TRANSLUCENT)
                  if (Build.VERSION.SDK_INT >= 28) lp.layoutInDisplayCutoutMode = LP.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  try {
                      wm?.addView(rv, lp)
                      panel = rv
                  } catch (_: Exception) { }
              }

              fun closeRing() {
                  val p = panel ?: return
                  try { wm?.removeView(p) } catch (_: Exception) { }
                  panel = null
              }

              // ---------------------------------------------------------------- eventos
              /** O próprio app avisa que está na frente (o serviço ignora os eventos do próprio pacote). */
              fun setForeground(pkg: String) {
                  fg = pkg
                  switchTo(pkg)
                  refresh()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val p = e.packageName?.toString() ?: return
                  if (p in ignore || p == fg) return
                  fg = p
                  switchTo(p)
                  closeRing()
                  refresh()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  ui.post { closeRing(); refresh() }
              }

              override fun onInterrupt() {
                  closeRing()
              }

              override fun onDestroy() {
                  instance = null
                  flush()
                  ui.removeCallbacksAndMessages(null)
                  closeRing()
                  try { unregisterReceiver(batRcv) } catch (_: Exception) { }
                  try { unregisterReceiver(scrRcv) } catch (_: Exception) { }
                  try { (getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager).unregisterNetworkCallback(netCb) } catch (_: Exception) { }
                  if (ready) for (e in elems) try { wm?.removeView(e.view) } catch (_: Exception) { }
                  super.onDestroy()
              }
          }

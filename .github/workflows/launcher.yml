          class ListEnv(v: SceneView, private val wall: Boolean) : Env(v) {
              private val sc = floatArrayOf(0f, 0f)
              private val vel = floatArrayOf(0f, 0f)
              private var touchCol = -1
              private var w = 0f
              private var h = 0f

              private fun listMode() = Prefs.int("present", 0) == 1
              private fun items(col: Int) = if (col == 0) v.games else v.apps
              private fun n(col: Int) = items(col).size
              private fun gap() = v.iconPx * (if (listMode()) 1.28f else 1.08f)
              private fun maxSc(col: Int) = max(0f, (n(col) - 1).toFloat())

              override fun layout(w: Int, h: Int) {

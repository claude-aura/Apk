          import java.io.File

          /** Vídeo de wallpaper: toca em loop, sem som, preenchendo a tela (corta as sobras). */
          class VideoBg(c: Context) : TextureView(c), TextureView.SurfaceTextureListener {
              private var mp: MediaPlayer? = null
              private var file: File? = null
              private var surface: Surface? = null
              private var vw = 0
              private var vh = 0
              private var wantPlay = true

              init {
                  surfaceTextureListener = this
              }

              fun play(f: File) {
                  file = f
                  if (isAvailable && surface != null) start()
              }

              fun clear() {
                  file = null
                  release()
              }

              fun pausePlayback() {
                  wantPlay = false
                  try { mp?.pause() } catch (_: Exception) { }
              }

              fun resumePlayback() {
                  wantPlay = true
                  try { mp?.start() } catch (_: Exception) { }
              }

              private fun start() {
                  release()
                  val f = file ?: return
                  val m = MediaPlayer()
                  try {
                      m.setSurface(surface)
                      m.setDataSource(f.path)
                      m.isLooping = true
                      m.setVolume(0f, 0f)
                      m.setOnVideoSizeChangedListener { _, w, h -> vw = w; vh = h; fit() }
                      m.setOnPreparedListener { if (wantPlay) it.start() }
                      m.prepareAsync()
                      mp = m
                  } catch (e: Exception) {
                      m.release()
                  }
              }

              private fun release() {
                  try { mp?.release() } catch (_: Exception) { }
                  mp = null
              }

              private fun fit() {
                  if (vw <= 0 || vh <= 0 || width <= 0 || height <= 0) return
                  val av = vw.toFloat() / vh
                  val aw = width.toFloat() / height
                  val m = Matrix()
                  val sx = if (av > aw) av / aw else 1f
                  val sy = if (av > aw) 1f else aw / av
                  m.setScale(sx, sy, width / 2f, height / 2f)
                  setTransform(m)
              }

              override fun onSurfaceTextureAvailable(st: SurfaceTexture, w: Int, h: Int) {
                  surface = Surface(st)
                  if (file != null) start()
              }

              override fun onSurfaceTextureSizeChanged(st: SurfaceTexture, w: Int, h: Int) { fit() }

              override fun onSurfaceTextureDestroyed(st: SurfaceTexture): Boolean {
                  release()
                  surface?.release()
                  surface = null
                  return true
              }

              override fun onSurfaceTextureUpdated(st: SurfaceTexture) {}
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Horizon Launcher</string>
          </resources>
          EOF

      - name: Compilar
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "=== ERROS DE COMPILACAO (me mande um print disto) ==="
            grep -E "^e: |What went wrong" -A3 build.log | head -80
            exit 1
          }
          echo "Compilou sem erros."

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: horizon-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "horizon-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --title "Horizon Launcher #${{ github.run_number }}" \
            --notes "Baixe o app-debug.apk e instale. Depois defina como launcher padrão nas configurações."

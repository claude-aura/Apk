          package com.horizonlauncher

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.graphics.drawable.AnimatedImageDrawable
          import android.graphics.drawable.Drawable
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.View
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          private class Trans(val snap: Bitmap, val kind: Int, val t0: Long, val dur: Long)

          /**
           * A tela inteira do launcher desenhada em Canvas: ambiente (fundo + apps), widgets, relógio,
           * Wi-Fi, bateria, três círculos, engrenagem e setas. Os 6 ambientes ficam em Modes.kt.
           */
          class SceneView(c: Context) : View(c) {
              val dn = resources.displayMetrics.density
              var games: List<AppItem> = emptyList()
              var apps: List<AppItem> = emptyList()
              var mode = 0
              var wallDrawable: Drawable? = null
              var wallVideo = false
              var bgColor = Color.BLACK
              var batLevel = 100
              var charging = false
              var wifi = -1
              var ringer = 2
              var showArrows = true
              var anim = 0
              var transOn = true
              var widgets: List<Widget> = emptyList()
              var time = 0f
              var moveWidget: Widget? = null
              var onOpen: (AppItem) -> Unit = {}
              var onMenu: (AppItem) -> Unit = {}
              var onHud: (String) -> Unit = {}
              var onWidget: (Widget, Boolean) -> Unit = { _, _ -> }
              var onWidgetMoved: () -> Unit = {}

              val iconPx: Float get() = Prefs.int("icon_dp", 56) * dn

              private val envs by lazy {
                  listOf<Env>(ListEnv(this, false), TerraEnv(this), BhEnv(this), SeaEnv(this), RpEnv(this), ListEnv(this, true))
              }
              val env: Env get() = envs[mode]

              val ip = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val shadowP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rf = RectF()
              private val src = Rect()
              private val path = Path()
              private val fmt = SimpleDateFormat("HH:mm", Locale.getDefault())
              private var lastMin = -1L
              private var clockStr = ""

              private var trans: Trans? = null
              private var running = false
              private var last = 0L
              private var downX = 0f
              private var downY = 0f
              private var lastY = 0f
              private var lastT = 0L
              private var offX = 0f
              private var offY = 0f
              private var moved = false
              private var longFired = false
              private var touching = false
              private var downItem: AppItem? = null
              private var downWidget: Widget? = null
              private var downHud: String? = null

              private val cb = object : Drawable.Callback {
                  override fun invalidateDrawable(who: Drawable) { invalidate() }
                  override fun scheduleDrawable(who: Drawable, what: Runnable, whenMs: Long) {
                      postDelayed(what, max(0L, whenMs - SystemClock.uptimeMillis()))
                  }
                  override fun unscheduleDrawable(who: Drawable, what: Runnable) { removeCallbacks(what) }
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val now = SystemClock.uptimeMillis()
                      val dt = min((now - last) / 1000f, 0.05f)
                      last = now
                      step(dt)
                      invalidate()
                      if (!needLoop()) { running = false; return }
                      val iv = if (anim == 1 && trans == null && !touching && !env.busy()) 66L else if (mode == 3 || mode == 4) 33L else 16L
                      postDelayed(this, iv)
                  }
              }

              private val longRun = Runnable {
                  longFired = true
                  val it0 = downItem
                  val wd = downWidget
                  if (it0 != null) onMenu(it0) else if (wd != null) onWidget(wd, true)
              }

              private val minuteTick = object : Runnable {
                  override fun run() {
                      invalidate()
                      postDelayed(this, 30000L)
                  }
              }

              // ---------------------------------------------------------------- ciclo de vida do desenho
              private fun needLoop() = anim != 2 || trans != null || env.busy() || touching

              fun start() {
                  if (running) return
                  running = true
                  last = SystemClock.uptimeMillis()
                  post(loop)
              }

              fun stop() {
                  running = false
                  removeCallbacks(loop)
              }

              fun kick() = start()

              private fun step(dt: Float) {
                  time += dt
                  env.update(dt)
                  val t = trans
                  if (t != null && SystemClock.uptimeMillis() - t.t0 >= t.dur) {
                      trans = null
                      t.snap.recycle()
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  postDelayed(minuteTick, 30000L)
              }

              override fun onDetachedFromWindow() {
                  removeCallbacks(minuteTick)
                  stop()
                  super.onDetachedFromWindow()
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  layoutAll()
              }

              fun setItems(g: List<AppItem>, a: List<AppItem>) {
                  games = g
                  apps = a
                  layoutAll()
              }

              fun layoutAll() {
                  if (width <= 0) return
                  for (e in envs) e.layout(width, height)
                  env.update(0f)
                  invalidate()
              }

              fun setMode(m: Int, animate: Boolean) {
                  if (m == mode) return
                  if (animate && transOn) beginTransition(m)
                  mode = m
                  env.update(0f)
                  kick()
              }

              // ---------------------------------------------------------------- transições
              private fun snapshot(): Bitmap? = try {
                  val b = Bitmap.createBitmap(max(1, width / 2), max(1, height / 2), Bitmap.Config.ARGB_8888)
                  val cv = Canvas(b)
                  cv.scale(0.5f, 0.5f)
                  drawScene(cv)
                  b
              } catch (_: Throwable) {
                  null
              }

              /** kind = ambiente de destino (0..5). 5 também é usado quando o wallpaper é trocado. */
              fun beginTransition(kind: Int) {
                  if (width <= 0 || !transOn) return
                  val old = trans
                  if (old != null) { trans = null; old.snap.recycle() }
                  val b = snapshot() ?: return
                  trans = Trans(b, kind, SystemClock.uptimeMillis(), if (kind == 4) 850L else 950L)
                  kick()
              }

              private fun ease(t: Float) = t * t * (3f - 2f * t)

              private fun drawTrans(c: Canvas, t: Trans) {
                  val k = ((SystemClock.uptimeMillis() - t.t0).toFloat() / t.dur).coerceIn(0f, 1f)
                  val e = ease(k)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  rf.set(0f, 0f, w, h)
                  ip.alpha = 255
                  when (t.kind) {
                      1 -> { // TERRA: o ambiente antigo se afasta como quem entra na atmosfera
                          c.save(); c.scale(1f + 1.1f * e, 1f + 1.1f * e, w / 2, h / 2)
                          ip.alpha = ((1f - k) * 255).toInt(); c.drawBitmap(t.snap, null, rf, ip); c.restore()
                      }
                      2 -> { // BURACO NEGRO: o antigo gira e é engolido pelo centro
                          c.save(); c.rotate(540f * e, w / 2, h / 2); val s = 1f - 0.97f * e; c.scale(s, s, w / 2, h / 2)
                          ip.alpha = ((1f - k * k) * 255).toInt(); c.drawBitmap(t.snap, null, rf, ip); c.restore()
                      }
                      3 -> { // MAR: uma onda desce e revela o novo ambiente
                          val amp = h * 0.05f
                          path.reset()
                          var x = 0f
                          path.moveTo(0f, 0f)
                          while (x <= w + 30f) {
                              val y = -amp + (h + 2 * amp) * e + amp * sin(x * 0.012f + e * 14f)
                              if (x == 0f) path.moveTo(0f, y) else path.lineTo(x, y)
                              x += 30f
                          }
                          path.lineTo(w, h); path.lineTo(0f, h); path.close()
                          c.save(); c.clipPath(path); c.drawBitmap(t.snap, null, rf, ip); c.restore()
                      }
                      4 -> { // RP: o antigo desliza como uma porta
                          c.save(); c.translate(-w * e, 0f); ip.alpha = ((1f - 0.5f * k) * 255).toInt()
                          c.drawBitmap(t.snap, null, rf, ip); c.restore()
                      }
                      5 -> { // WALLPAPER: troca suave com um leve zoom
                          c.save(); val s = 1f + 0.06f * e; c.scale(s, s, w / 2, h / 2)
                          ip.alpha = ((1f - e) * 255).toInt(); c.drawBitmap(t.snap, null, rf, ip); c.restore()
                      }
                      else -> { // SISTEMA: esmaece
                          ip.alpha = ((1f - e) * 255).toInt(); c.drawBitmap(t.snap, null, rf, ip)
                      }
                  }
                  ip.alpha = 255
              }

              // ---------------------------------------------------------------- animações de wallpaper e widgets
              fun attachAnim(d: Drawable?) {
                  if (d == null) return
                  d.callback = cb
                  if (d is AnimatedImageDrawable) d.repeatCount = AnimatedImageDrawable.REPEAT_INFINITE
              }

              fun setAnimPlaying(play: Boolean) {
                  val all = listOf(wallDrawable) + widgets.map { it.anim }
                  for (d in all) if (d is AnimatedImageDrawable) { if (play) d.start() else d.stop() }
              }

              // ---------------------------------------------------------------- desenho
              fun drawItem(c: Canvas, it0: AppItem) {
                  if (it0.a <= 0.01f || it0.s <= 0.01f) return
                  val r = it0.r * it0.s
                  shadowP.style = Paint.Style.FILL
                  shadowP.color = Color.argb((it0.a * 70).toInt(), 0, 0, 0)
                  c.drawCircle(it0.x + r * 0.06f, it0.y + r * 0.1f, r, shadowP)
                  rf.set(it0.x - r, it0.y - r, it0.x + r, it0.y + r)
                  ip.alpha = (it0.a * 255).toInt()
                  c.drawBitmap(it0.icon, null, rf, ip)
                  ip.alpha = 255
                  if (it0.game) {
                      shadowP.style = Paint.Style.STROKE
                      shadowP.strokeWidth = max(1.5f, r * 0.05f)
                      shadowP.color = Color.argb((it0.a * 170).toInt(), 110, 175, 255)
                      c.drawCircle(it0.x, it0.y, r, shadowP)
                  }
              }

              fun drawWall(c: Canvas) {
                  val d = wallDrawable
                  if (d == null) { c.drawColor(Color.BLACK); return }
                  val iw = max(d.intrinsicWidth, 1)
                  val ih = max(d.intrinsicHeight, 1)
                  val s = max(width / iw.toFloat(), height / ih.toFloat())
                  val dw = (iw * s).toInt()
                  val dh = (ih * s).toInt()
                  val l = (width - dw) / 2
                  val t = (height - dh) / 2
                  d.setBounds(l, t, l + dw, t + dh)
                  d.draw(c)
              }

              private fun drawScene(c: Canvas) {
                  env.draw(c)
                  drawWidgets(c)
              }

              override fun onDraw(c: Canvas) {
                  drawScene(c)
                  val t = trans
                  if (t != null) drawTrans(c, t)
                  drawHud(c)
              }

              private fun resetP(style: Paint.Style) {
                  tp.shader = null
                  tp.style = style
                  tp.pathEffect = null
                  tp.clearShadowLayer()
                  tp.typeface = Typeface.DEFAULT
                  tp.textAlign = Paint.Align.LEFT
                  tp.strokeCap = Paint.Cap.BUTT
                  tp.letterSpacing = 0f
              }

              private fun fitText(s: String, maxW: Float): String {
                  val n = tp.breakText(s, true, maxW, null)
                  return if (n >= s.length) s else s.substring(0, max(0, n - 1)) + "…"
              }

              private fun drawCrop(c: Canvas, b: Bitmap, r: RectF) {
                  val s = max(r.width() / b.width, r.height() / b.height)
                  val sw = r.width() / s
                  val sh = r.height() / s
                  src.set(((b.width - sw) / 2).toInt(), ((b.height - sh) / 2).toInt(), ((b.width + sw) / 2).toInt(), ((b.height + sh) / 2).toInt())
                  c.drawBitmap(b, src, r, ip)
              }

              fun layoutWidgets() {
                  for (w in widgets) {
                      val ww = w.fw * width
                      val hh = if (w.type == "link" || w.type == "sound") max(ww * 0.32f, 56 * dn) else ww * 9f / 16f
                      w.rect.set(w.fx * width, w.fy * height, w.fx * width + ww, w.fy * height + hh)
                  }
              }

              private fun drawWidgets(c: Canvas) {
                  if (!Prefs.bool("widgets_on", false)) return
                  layoutWidgets()
                  for (w in widgets) {
                      c.save()
                      path.reset()
                      path.addRoundRect(w.rect, 16 * dn, 16 * dn, Path.Direction.CW)
                      c.clipPath(path)
                      resetP(Paint.Style.FILL)
                      tp.color = Color.argb(170, 30, 30, 50)
                      c.drawRect(w.rect, tp)
                      when (w.type) {
                          "gif" -> {
                              val d = w.anim
                              if (d != null) { d.setBounds(w.rect.left.toInt(), w.rect.top.toInt(), w.rect.right.toInt(), w.rect.bottom.toInt()); d.draw(c) }
                          }
                          "photo" -> { val b = w.bmp; if (b != null) drawCrop(c, b, w.rect) }
                          "video" -> {
                              val b = w.bmp
                              if (b != null) drawCrop(c, b, w.rect)
                              tp.color = Color.argb(200, 255, 255, 255)
                              val cx = w.rect.centerX(); val cy = w.rect.centerY(); val s = w.rect.height() * 0.18f
                              path.reset(); path.moveTo(cx - s * 0.6f, cy - s); path.lineTo(cx - s * 0.6f, cy + s); path.lineTo(cx + s, cy); path.close()
                              c.drawPath(path, tp)
                          }
                          else -> {
                              tp.color = Color.WHITE
                              tp.textSize = w.rect.height() * 0.3f
                              tp.typeface = Typeface.DEFAULT_BOLD
                              val icon = if (w.type == "sound") (if (w.playing) "■" else "▶") else "🔗"
                              c.drawText(icon, w.rect.left + w.rect.height() * 0.25f, w.rect.centerY() + tp.textSize * 0.35f, tp)
                              val tx = w.rect.left + w.rect.height() * 1.0f
                              tp.textSize = w.rect.height() * 0.24f
                              tp.typeface = Typeface.DEFAULT_BOLD
                              c.drawText(fitText(w.title.ifEmpty { w.data }, w.rect.right - tx - 10 * dn), tx, w.rect.centerY() - tp.textSize * 0.1f, tp)
                              if (w.type == "link") {
                                  tp.typeface = Typeface.DEFAULT
                                  tp.textSize = w.rect.height() * 0.17f
                                  tp.color = Color.argb(170, 255, 255, 255)
                                  c.drawText(fitText(w.data, w.rect.right - tx - 10 * dn), tx, w.rect.centerY() + tp.textSize * 1.6f, tp)
                              }
                          }
                      }
                      c.restore()
                      if (moveWidget === w) {
                          resetP(Paint.Style.STROKE)
                          tp.strokeWidth = 3 * dn
                          tp.color = Color.parseColor("#FFD400")
                          tp.pathEffect = DashPathEffect(floatArrayOf(14f, 10f), 0f)
                          c.drawRoundRect(w.rect, 16 * dn, 16 * dn, tp)
                      }
                  }
              }

              // ---------------------------------------------------------------- HUD (relógio, Wi-Fi, bateria, círculos, engrenagem, setas)
              private fun circlesY() = if (mode == 0 || mode == 5) height * 0.52f else height * 0.86f
              private fun circleX(i: Int) = width / 2f + (i - 1) * height * 0.16f
              private fun cr() = height * 0.055f

              private fun drawWifi(c: Canvas, cx: Float, cy: Float, s: Float) {
                  resetP(Paint.Style.STROKE)
                  tp.strokeCap = Paint.Cap.ROUND
                  tp.strokeWidth = s * 0.17f
                  val on = wifi >= 0
                  for (i in 1..3) {
                      val r = s * 0.42f * i
                      tp.color = Color.argb(if (on && i <= max(wifi, 1)) 255 else 70, 255, 255, 255)
                      rf.set(cx - r, cy + s * 0.5f - r, cx + r, cy + s * 0.5f + r)
                      c.drawArc(rf, 225f, 90f, false, tp)
                  }
                  tp.style = Paint.Style.FILL
                  tp.color = Color.argb(if (on) 255 else 70, 255, 255, 255)
                  c.drawCircle(cx, cy + s * 0.5f, s * 0.1f, tp)
                  if (!on) {
                      tp.style = Paint.Style.STROKE
                      tp.color = Color.argb(200, 255, 80, 80)
                      c.drawLine(cx - s * 0.6f, cy - s * 0.2f, cx + s * 0.6f, cy + s * 0.7f, tp)
                  }
              }

              private fun drawBattery(c: Canvas, x: Float, cy: Float, s: Float) {
                  resetP(Paint.Style.STROKE)
                  tp.strokeWidth = s * 0.1f
                  tp.color = Color.WHITE
                  rf.set(x, cy - s * 0.5f, x + s * 1.9f, cy + s * 0.5f)
                  c.drawRoundRect(rf, s * 0.15f, s * 0.15f, tp)
                  tp.style = Paint.Style.FILL
                  c.drawRect(x + s * 1.9f, cy - s * 0.18f, x + s * 2.05f, cy + s * 0.18f, tp)
                  tp.color = if (charging) Color.parseColor("#4CE08A") else if (batLevel <= 15) Color.parseColor("#FF5252") else Color.WHITE
                  rf.set(x + s * 0.12f, cy - s * 0.38f, x + s * 0.12f + (s * 1.66f) * batLevel / 100f, cy + s * 0.38f)
                  c.drawRoundRect(rf, s * 0.08f, s * 0.08f, tp)
                  tp.color = Color.WHITE
                  tp.textSize = s * 0.95f
                  tp.typeface = Typeface.DEFAULT_BOLD
                  c.drawText(batLevel.toString() + "%" + (if (charging) " ⚡" else ""), x + s * 2.3f, cy + s * 0.33f, tp)
              }

              private fun drawSound(c: Canvas, cx: Float, cy: Float, r: Float) {
                  resetP(Paint.Style.FILL)
                  tp.color = Color.WHITE
                  if (ringer == 1) {
                      rf.set(cx - r * 0.16f, cy - r * 0.34f, cx + r * 0.16f, cy + r * 0.34f)
                      tp.style = Paint.Style.STROKE; tp.strokeWidth = r * 0.09f; tp.strokeCap = Paint.Cap.ROUND
                      c.drawRoundRect(rf, r * 0.06f, r * 0.06f, tp)
                      for (k in 1..2) {
                          val rr = r * (0.28f + 0.14f * k)
                          rf.set(cx - rr, cy - rr, cx + rr, cy + rr)
                          c.drawArc(rf, 150f, 60f, false, tp)
                          c.drawArc(rf, -30f, 60f, false, tp)
                      }
                      return
                  }
                  path.reset()
                  path.moveTo(cx - r * 0.42f, cy - r * 0.16f); path.lineTo(cx - r * 0.2f, cy - r * 0.16f); path.lineTo(cx + r * 0.05f, cy - r * 0.38f)
                  path.lineTo(cx + r * 0.05f, cy + r * 0.38f); path.lineTo(cx - r * 0.2f, cy + r * 0.16f); path.lineTo(cx - r * 0.42f, cy + r * 0.16f); path.close()
                  c.drawPath(path, tp)
                  tp.style = Paint.Style.STROKE; tp.strokeWidth = r * 0.09f; tp.strokeCap = Paint.Cap.ROUND
                  if (ringer == 2) {
                      for (k in 1..2) {
                          val rr = r * (0.18f + 0.2f * k)
                          rf.set(cx + r * 0.05f - rr, cy - rr, cx + r * 0.05f + rr, cy + rr)
                          c.drawArc(rf, -45f, 90f, false, tp)
                      }
                  } else {
                      tp.color = Color.parseColor("#FF5252")
                      c.drawLine(cx - r * 0.5f, cy - r * 0.5f, cx + r * 0.5f, cy + r * 0.5f, tp)
                  }
              }

              private fun drawGear(c: Canvas, gx: Float, gy: Float, gr: Float) {
                  resetP(Paint.Style.FILL)
                  tp.color = Color.argb(220, 255, 255, 255)
                  for (i in 0 until 8) {
                      c.save(); c.rotate(i * 45f, gx, gy)
                      rf.set(gx - gr * 0.16f, gy - gr * 1.05f, gx + gr * 0.16f, gy - gr * 0.65f)
                      c.drawRect(rf, tp); c.restore()
                  }
                  tp.style = Paint.Style.STROKE
                  tp.strokeWidth = gr * 0.3f
                  c.drawCircle(gx, gy, gr * 0.62f, tp)
              }

              private fun drawChevron(c: Canvas, x: Float, cy: Float, s: Float, dir: Int) {
                  resetP(Paint.Style.STROKE)
                  tp.strokeCap = Paint.Cap.ROUND
                  tp.strokeWidth = s * 0.28f
                  tp.color = Color.argb(150, 255, 255, 255)
                  path.reset()
                  path.moveTo(x + dir * s * 0.35f, cy - s); path.lineTo(x - dir * s * 0.35f, cy); path.lineTo(x + dir * s * 0.35f, cy + s)
                  c.drawPath(path, tp)
              }

              private fun drawHud(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val m = System.currentTimeMillis() / 60000
                  if (m != lastMin) { lastMin = m; clockStr = fmt.format(Date()) }
                  resetP(Paint.Style.FILL)
                  tp.color = Color.WHITE
                  tp.typeface = Typeface.DEFAULT_BOLD
                  tp.textAlign = Paint.Align.CENTER
                  tp.textSize = h * 0.09f
                  tp.setShadowLayer(10f, 0f, 0f, Color.BLACK)
                  c.drawText(clockStr, w / 2, h * 0.115f, tp)
                  tp.clearShadowLayer()
                  val s = h * 0.032f
                  drawWifi(c, w / 2 - s * 2.8f, h * 0.15f, s)
                  drawBattery(c, w / 2 - s * 0.6f, h * 0.165f, s)

                  val cy = circlesY()
                  val r = cr()
                  for (i in 0..2) {
                      val x = circleX(i)
                      resetP(Paint.Style.FILL)
                      tp.color = Color.argb(150, 18, 18, 28)
                      c.drawCircle(x, cy, r, tp)
                      tp.style = Paint.Style.STROKE
                      tp.strokeWidth = r * 0.06f
                      tp.color = Color.argb(210, 255, 255, 255)
                      c.drawCircle(x, cy, r, tp)
                      when (i) {
                          0 -> {
                              resetP(Paint.Style.FILL)
                              tp.typeface = Typeface.DEFAULT_BOLD; tp.textAlign = Paint.Align.CENTER; tp.textSize = r * 1.15f
                              tp.color = Color.parseColor("#4285F4")
                              c.drawText("G", x, cy + r * 0.4f, tp)
                          }
                          1 -> {
                              resetP(Paint.Style.FILL)
                              val a = r * 0.42f
                              val cols = intArrayOf(Color.parseColor("#34A853"), Color.parseColor("#4285F4"), Color.parseColor("#EA4335"))
                              val px = floatArrayOf(x - a * 0.8f, cy - a, x - a * 0.8f, cy + a, x + a * 1.1f, cy)
                              val mx = (px[0] + px[2] + px[4]) / 3f
                              val my = (px[1] + px[3] + px[5]) / 3f
                              for (k in 0..2) {
                                  val j = (k + 1) % 3
                                  path.reset(); path.moveTo(mx, my); path.lineTo(px[k * 2], px[k * 2 + 1]); path.lineTo(px[j * 2], px[j * 2 + 1]); path.close()
                                  tp.color = cols[k]
                                  c.drawPath(path, tp)
                              }
                          }
                          else -> {
                              drawSound(c, x, cy, r)
                              resetP(Paint.Style.FILL)
                              tp.color = Color.argb(200, 255, 255, 255); tp.textAlign = Paint.Align.CENTER; tp.textSize = r * 0.3f
                              c.drawText(if (ringer == 2) "SOM" else if (ringer == 1) "VIBRAR" else "SILÊNCIO", x, cy + r * 1.5f, tp)
                          }
                      }
                  }
                  drawGear(c, w / 2, h * 0.955f, h * 0.032f)
                  if (showArrows) {
                      drawChevron(c, w * 0.03f, h * 0.5f, h * 0.035f, 1)
                      drawChevron(c, w * 0.97f, h * 0.5f, h * 0.035f, -1)
                  }
              }

              private fun hudAt(x: Float, y: Float): String? {
                  val r = cr() * 1.25f
                  val cy = circlesY()
                  val names = arrayOf("google", "play", "sound")
                  for (i in 0..2) if (hypot(x - circleX(i), y - cy) <= r) return names[i]
                  if (hypot(x - width / 2f, y - height * 0.955f) <= height * 0.06f) return "gear"
                  if (showArrows && abs(y - height * 0.5f) < height * 0.18f) {
                      if (x < width * 0.075f) return "prev"
                      if (x > width * 0.925f) return "next"
                  }
                  return null
              }

              // ---------------------------------------------------------------- toque
              private fun widgetAt(x: Float, y: Float): Widget? {
                  if (!Prefs.bool("widgets_on", false)) return null
                  for (i in widgets.indices.reversed()) if (widgets[i].rect.contains(x, y)) return widgets[i]
                  return null
              }

              private fun itemAt(x: Float, y: Float): AppItem? {
                  var best: AppItem? = null
                  var bd = Float.MAX_VALUE
                  for (l in arrayOf(games, apps)) for (it0 in l) {
                      if (it0.a < 0.3f || it0.s < 0.3f) continue
                      val r = max(it0.r * it0.s, 22 * dn)
                      val d = hypot(x - it0.x, y - it0.y)
                      if (d <= r && d < bd) { best = it0; bd = d }
                  }
                  return best
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val x = e.x
                  val y = e.y
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = x; downY = y; lastY = y; lastT = e.eventTime
                          moved = false; longFired = false; touching = true
                          downHud = hudAt(x, y)
                          downWidget = if (downHud == null) widgetAt(x, y) else null
                          downItem = if (downHud == null && downWidget == null) itemAt(x, y) else null
                          val mw = moveWidget
                          if (mw != null) { offX = x - mw.rect.left; offY = y - mw.rect.top }
                          env.down(x, y)
                          if (mw == null && (downItem != null || downWidget != null)) postDelayed(longRun, 520)
                          kick()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (!moved && hypot(x - downX, y - downY) > 10 * dn) { moved = true; removeCallbacks(longRun) }
                          val mw = moveWidget
                          if (mw != null) {
                              mw.fx = ((x - offX) / width).coerceIn(0f, 0.95f)
                              mw.fy = ((y - offY) / height).coerceIn(0f, 0.95f)
                              invalidate()
                          } else if (moved) {
                              env.drag(y - lastY, (e.eventTime - lastT) / 1000f)
                          }
                          lastY = y; lastT = e.eventTime
                      }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longRun)
                          touching = false
                          if (moveWidget != null) {
                              moveWidget = null
                              onWidgetMoved()
                          } else if (!moved && !longFired) {
                              val hd = downHud
                              val wd = downWidget
                              val it0 = downItem
                              if (hd != null) { if (hudAt(x, y) == hd) onHud(hd) }
                              else if (wd != null) onWidget(wd, false)
                              else if (it0 != null) onOpen(it0)
                              else env.tap(x, y)
                          }
                          env.up()
                          kick()
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          removeCallbacks(longRun)
                          touching = false
                          env.up()
                      }
                  }
                  return true
              }
          }

# HORIZON LAUNCHER (launcher Android horizontal). Coloque em .github/workflows/launcher.yml
# Monta o projeto, compila na nuvem e publica o APK em "Releases" (e como artefato).
name: Gerar APK do Horizon Launcher

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar o projeto Android
        run: |
          mkdir -p app app/src/main app/src/main/java/com/horizonlauncher app/src/main/res/values
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HorizonLauncher"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.horizonlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.horizonlauncher"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false"
                      android:label="Configurações"
                      android:screenOrientation="sensorLandscape"
                      android:theme="@android:style/Theme.DeviceDefault" />
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/horizonlauncher/Data.kt <<'EOF'
          package com.horizonlauncher

          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.drawable.Drawable
          import android.media.MediaMetadataRetriever
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          /** Um app ou jogo instalado. Os campos soltos são usados pelos ambientes (posição, estado, etc.). */
          class AppItem(val pkg: String, val label: String, var game: Boolean, var hidden: Boolean, val icon: Bitmap) {
              var x = 0f; var y = 0f; var r = 20f; var s = 1f; var a = 1f
              var ang = 0f; var rad = 0f; var ring = 0; var ph = 0f; var sp = 0f
              var vx = 0f; var vy = 0f; var wx = 0f; var wy = 0f; var tm = 0f
              var st = 0; var act = 0; var floor = 0; var yF = 0f; var tfloor = 0
              var energy = 1f; var sleeper = false; var lastUsed = 0L
          }

          /** Widget personalizado: gif, link, foto, vídeo ou som. Posição e largura são frações da tela. */
          class Widget(val id: String, var type: String, var title: String, var data: String, var fx: Float, var fy: Float, var fw: Float) {
              var bmp: Bitmap? = null
              var anim: Drawable? = null
              var playing = false
              val rect = RectF()
          }

          object Store {
              fun loadWidgets(): ArrayList<Widget> {
                  val out = ArrayList<Widget>()
                  try {
                      val a = JSONArray(Prefs.str("widgets", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          out.add(Widget(o.getString("id"), o.getString("type"), o.optString("title", ""), o.optString("data", ""),
                              o.optDouble("fx", 0.3).toFloat(), o.optDouble("fy", 0.3).toFloat(), o.optDouble("fw", 0.22).toFloat()))
                      }
                  } catch (_: Exception) { }
                  return out
              }

              fun saveWidgets(l: List<Widget>) {
                  val a = JSONArray()
                  for (w in l) {
                      a.put(JSONObject().put("id", w.id).put("type", w.type).put("title", w.title).put("data", w.data)
                          .put("fx", w.fx.toDouble()).put("fy", w.fy.toDouble()).put("fw", w.fw.toDouble()))
                  }
                  Prefs.putStr("widgets", a.toString())
              }
          }

          fun loadBitmap(f: File): Bitmap? {
              if (!f.exists()) return null
              return try {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(f.path, o)
                  var s = 1
                  while (o.outWidth / s > 1280 || o.outHeight / s > 1280) s *= 2
                  BitmapFactory.decodeFile(f.path, BitmapFactory.Options().apply { inSampleSize = s })
              } catch (e: Exception) {
                  null
              }
          }

          fun videoPoster(f: File): Bitmap? {
              val r = MediaMetadataRetriever()
              return try {
                  r.setDataSource(f.path)
                  r.getFrameAtTime(0)
              } catch (e: Exception) {
                  null
              } finally {
                  try { r.release() } catch (_: Exception) { }
              }
          }

          object AppRepo {
              fun toBitmap(d: Drawable, s: Int): Bitmap {
                  val b = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                  val c = Canvas(b)
                  val p = Path()
                  p.addCircle(s / 2f, s / 2f, s / 2f, Path.Direction.CW)
                  c.clipPath(p)
                  d.setBounds(0, 0, s, s)
                  d.draw(c)
                  return b
              }

              /** Uso real dos apps (precisa da permissão "acesso ao uso"; sem ela volta vazio). */
              fun usage(ctx: Context): Pair<Map<String, Long>, Map<String, Long>> = try {
                  val um = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                  val now = System.currentTimeMillis()
                  val st = um.queryUsageStats(UsageStatsManager.INTERVAL_MONTHLY, now - 30L * 86400000L, now)
                  val tot = HashMap<String, Long>()
                  val last = HashMap<String, Long>()
                  for (s in st) {
                      tot[s.packageName] = (tot[s.packageName] ?: 0L) + s.totalTimeInForeground
                      last[s.packageName] = maxOf(last[s.packageName] ?: 0L, s.lastTimeUsed)
                  }
                  Pair(tot, last)
              } catch (_: Exception) {
                  Pair(emptyMap(), emptyMap())
              }

              fun loadAll(ctx: Context): List<AppItem> {
                  val pm = ctx.packageManager
                  val hidden = Prefs.strs("hidden")
                  val fg = Prefs.strs("force_games")
                  val fa = Prefs.strs("force_apps")
                  val (_, last) = usage(ctx)
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val seen = HashSet<String>()
                  val out = ArrayList<AppItem>()
                  for (ri in pm.queryIntentActivities(intent, 0)) {
                      val p = ri.activityInfo.packageName
                      if (p == ctx.packageName || !seen.add(p)) continue
                      val game = if (fg.contains(p)) true else if (fa.contains(p)) false
                      else ri.activityInfo.applicationInfo.category == ApplicationInfo.CATEGORY_GAME
                      val it0 = AppItem(p, ri.loadLabel(pm).toString(), game, hidden.contains(p), toBitmap(ri.loadIcon(pm), 128))
                      it0.lastUsed = maxOf(last[p] ?: 0L, Prefs.long("lo_" + p, 0L))
                      out.add(it0)
                  }
                  return out
              }

              /** Separa em (jogos, apps) já ordenados e sem os ocultos. */
              fun split(all: List<AppItem>, totals: Map<String, Long>): Pair<List<AppItem>, List<AppItem>> {
                  val vis = all.filter { !it.hidden }
                  return Pair(order(vis.filter { it.game }, "games", totals), order(vis.filter { !it.game }, "apps", totals))
              }

              private fun order(l: List<AppItem>, key: String, totals: Map<String, Long>): List<AppItem> = when (Prefs.int("order_mode", 0)) {
                  1 -> l.sortedBy { it.label.lowercase() }
                  2 -> l.sortedWith(compareByDescending<AppItem> { totals[it.pkg] ?: 0L }.thenBy { it.label.lowercase() })
                  else -> {
                      val ord = Prefs.str("order_" + key, "").split(",").filter { it.isNotEmpty() }
                      val idx = ord.withIndex().associate { it.value to it.index }
                      l.sortedWith(compareBy<AppItem> { idx[it.pkg] ?: Int.MAX_VALUE }.thenBy { it.label.lowercase() })
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/horizonlauncher/LauncherActivity.kt <<'EOF'
          package com.horizonlauncher

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.ImageDecoder
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.net.wifi.WifiManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.inputmethod.EditorInfo
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.Toast
          import android.widget.VideoView
          import java.io.File
          import kotlin.math.max

          /** A tela inicial (HOME). Liga o SceneView ao Android: apps, bateria, Wi-Fi, som, widgets e wallpaper. */
          class LauncherActivity : Activity() {
              private lateinit var scene: SceneView
              private lateinit var video: VideoBg
              private lateinit var search: EditText
              private var all: List<AppItem> = emptyList()
              private var totals: Map<String, Long> = emptyMap()
              private var widgets = ArrayList<Widget>()
              private var widgetsSig = ""
              private var wallVer = -1
              private var lastMode = -1
              private var player: MediaPlayer? = null
              private var playingW: Widget? = null
              private var batLevel = 100
              private var charging = false
              private val ui = Handler(Looper.getMainLooper())

              private val batRcv = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      if (i == null) return
                      val lv = i.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                      val sc = i.getIntExtra(BatteryManager.EXTRA_SCALE, 100)
                      val st = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                      batLevel = if (lv >= 0) lv * 100 / max(sc, 1) else 100
                      charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                      scene.batLevel = batLevel
                      scene.charging = charging
                      scene.invalidate()
                      applyWallAnim()
                  }
              }
              private val ringRcv = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) { syncRinger() }
              }
              private val pkgRcv = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) { loadItems() }
              }
              private val netCb = object : ConnectivityManager.NetworkCallback() {
                  override fun onAvailable(network: Network) { runOnUiThread { updateWifi() } }
                  override fun onLost(network: Network) { runOnUiThread { updateWifi() } }
                  override fun onCapabilitiesChanged(network: Network, caps: NetworkCapabilities) { runOnUiThread { updateWifi() } }
              }
              private val wifiTick = object : Runnable {
                  override fun run() {
                      updateWifi()
                      ui.postDelayed(this, 10000L)
                  }
              }

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              private fun reg(r: BroadcastReceiver, f: IntentFilter): Intent? =
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(r, f, Context.RECEIVER_NOT_EXPORTED) else registerReceiver(r, f)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Prefs.init(this)
                  window.setDecorFitsSystemWindows(false)
                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  video = VideoBg(this)
                  video.visibility = View.GONE
                  root.addView(video, FrameLayout.LayoutParams(mp, mp))
                  scene = SceneView(this)
                  root.addView(scene, FrameLayout.LayoutParams(mp, mp))
                  search = makeSearch()
                  val lp = FrameLayout.LayoutParams(dp(300), ViewGroup.LayoutParams.WRAP_CONTENT)
                  lp.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  lp.topMargin = dp(88)
                  root.addView(search, lp)
                  setContentView(root)

                  scene.onOpen = { openApp(it) }
                  scene.onMenu = { itemMenu(it) }
                  scene.onHud = { hud(it) }
                  scene.onWidget = { w, long -> widgetAction(w, long) }
                  scene.onWidgetMoved = { saveWidgets() }

                  reg(batRcv, IntentFilter(Intent.ACTION_BATTERY_CHANGED))?.let { batRcv.onReceive(this, it) }
                  reg(ringRcv, IntentFilter(AudioManager.RINGER_MODE_CHANGED_ACTION))
                  val pf = IntentFilter()
                  pf.addAction(Intent.ACTION_PACKAGE_ADDED)
                  pf.addAction(Intent.ACTION_PACKAGE_REMOVED)
                  pf.addAction(Intent.ACTION_PACKAGE_REPLACED)
                  pf.addDataScheme("package")
                  reg(pkgRcv, pf)
                  try { (getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager).registerDefaultNetworkCallback(netCb) } catch (_: Exception) { }
                  loadItems()
              }

              private fun makeSearch(): EditText {
                  val e = EditText(this)
                  e.hint = "Pesquisar no Google"
                  e.setHintTextColor(Color.argb(160, 255, 255, 255))
                  e.setTextColor(Color.WHITE)
                  e.setSingleLine()
                  e.inputType = InputType.TYPE_CLASS_TEXT
                  e.imeOptions = EditorInfo.IME_ACTION_SEARCH
                  e.background = GradientDrawable().apply {
                      cornerRadius = 200f
                      setColor(Color.argb(150, 20, 20, 30))
                      setStroke(2, Color.argb(120, 255, 255, 255))
                  }
                  e.setPadding(dp(18), dp(6), dp(18), dp(6))
                  e.visibility = View.GONE
                  e.setOnEditorActionListener { tv, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) {
                          val q = tv.text.toString().trim()
                          if (q.isNotEmpty()) {
                              openUrl("https://www.google.com/search?q=" + Uri.encode(q))
                              tv.text = ""
                              tv.clearFocus()
                          }
                          true
                      } else false
                  }
                  return e
              }

              private fun immersive() {
                  window.insetsController?.let { c ->
                      c.hide(WindowInsets.Type.systemBars())
                      c.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              override fun onResume() {
                  super.onResume()
                  immersive()
                  applyPrefs()
                  scene.start()
                  syncRinger()
                  updateWifi()
                  ui.removeCallbacks(wifiTick)
                  ui.postDelayed(wifiTick, 10000L)
                  if (all.isNotEmpty()) applyItems()
              }

              override fun onPause() {
                  scene.stop()
                  ui.removeCallbacks(wifiTick)
                  video.pausePlayback()
                  stopSound()
                  super.onPause()
              }

              override fun onDestroy() {
                  try { unregisterReceiver(batRcv) } catch (_: Exception) { }
                  try { unregisterReceiver(ringRcv) } catch (_: Exception) { }
                  try { unregisterReceiver(pkgRcv) } catch (_: Exception) { }
                  try { (getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager).unregisterNetworkCallback(netCb) } catch (_: Exception) { }
                  stopSound()
                  super.onDestroy()
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  // launcher: voltar não faz nada
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  immersive()
                  scene.invalidate()
              }

              // ---------------------------------------------------------------- dados
              private fun loadItems() {
                  Thread {
                      val list = AppRepo.loadAll(this)
                      val (tot, _) = AppRepo.usage(this)
                      runOnUiThread { all = list; totals = tot; applyItems() }
                  }.start()
              }

              private fun applyItems() {
                  val (g, a) = AppRepo.split(all, totals)
                  scene.setItems(g, a)
              }

              private fun animAllowed(): Boolean {
                  if (Prefs.int("anim", 0) == 2) return false
                  return when (Prefs.int("wall_anim", 0)) {
                      0 -> true
                      1 -> !(batLevel <= 20 && !charging)
                      else -> false
                  }
              }

              private fun applyWallAnim() {
                  scene.setAnimPlaying(animAllowed())
                  updateVideo()
              }

              private fun updateVideo() {
                  val show = scene.mode == 5 && scene.wallVideo
                  video.visibility = if (show) View.VISIBLE else View.GONE
                  if (show && animAllowed()) video.resumePlayback() else video.pausePlayback()
              }

              private fun applyPrefs() {
                  scene.anim = Prefs.int("anim", 0)
                  scene.transOn = Prefs.bool("trans_on", true)
                  scene.showArrows = Prefs.bool("arrows_on", true)
                  scene.bgColor = Prefs.int("bg_color", Color.BLACK)
                  val m = Prefs.int("mode", 0).coerceIn(0, 5)
                  val first = lastMode == -1
                  val ver = Prefs.int("wall_ver", 0)
                  if (ver != wallVer) {
                      if (!first && m == 5 && lastMode == 5) scene.beginTransition(5)
                      wallVer = ver
                      loadWallpaper()
                  }
                  scene.setMode(m, !first)
                  lastMode = m
                  search.visibility = if (Prefs.bool("search_on", false)) View.VISIBLE else View.GONE
                  val sig = Prefs.str("widgets", "[]")
                  if (sig != widgetsSig) {
                      widgetsSig = sig
                      val saved = Store.loadWidgets()
                      for (w in saved) loadMedia(w)
                      widgets = saved
                      scene.widgets = widgets
                  }
                  applyWallAnim()
                  scene.invalidate()
              }

              private fun loadWallpaper() {
                  val f = File(filesDir, "wall.bin")
                  val kind = Prefs.str("wall_kind", "")
                  scene.wallDrawable = null
                  scene.wallVideo = false
                  video.clear()
                  if (!f.exists()) return
                  if (kind == "video") {
                      scene.wallVideo = true
                      video.play(f)
                  } else if (kind == "image") {
                      try {
                          val d = ImageDecoder.decodeDrawable(ImageDecoder.createSource(f)) { dec, info, _ ->
                              dec.setTargetSampleSize(max(1, max(info.size.width / 2400, info.size.height / 1400)))
                          }
                          scene.attachAnim(d)
                          scene.wallDrawable = d
                      } catch (_: Exception) { }
                  }
              }

              private fun loadMedia(w: Widget) {
                  val f = File(filesDir, "w_" + w.id)
                  when (w.type) {
                      "photo" -> w.bmp = loadBitmap(f)
                      "video" -> w.bmp = videoPoster(f)
                      "gif" -> try {
                          val d = ImageDecoder.decodeDrawable(ImageDecoder.createSource(f))
                          scene.attachAnim(d)
                          w.anim = d
                      } catch (_: Exception) { }
                  }
              }

              private fun saveWidgets() {
                  Store.saveWidgets(widgets)
                  widgetsSig = Prefs.str("widgets", "[]")
                  scene.invalidate()
              }

              // ---------------------------------------------------------------- Wi-Fi e som
              @Suppress("DEPRECATION")
              private fun updateWifi() {
                  try {
                      val cm = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                      val caps = cm.getNetworkCapabilities(cm.activeNetwork)
                      if (caps != null && caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) {
                          val w = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager
                          scene.wifi = WifiManager.calculateSignalLevel(w.connectionInfo.rssi, 4)
                      } else {
                          scene.wifi = -1
                      }
                  } catch (_: Exception) {
                      scene.wifi = -1
                  }
                  scene.invalidate()
              }

              private fun syncRinger() {
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager
                  scene.ringer = when (am.ringerMode) {
                      AudioManager.RINGER_MODE_NORMAL -> 2
                      AudioManager.RINGER_MODE_VIBRATE -> 1
                      else -> 0
                  }
                  scene.invalidate()
              }

              private fun cycleSound() {
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager
                  val next = when (am.ringerMode) {
                      AudioManager.RINGER_MODE_NORMAL -> AudioManager.RINGER_MODE_VIBRATE
                      AudioManager.RINGER_MODE_VIBRATE -> AudioManager.RINGER_MODE_SILENT
                      else -> AudioManager.RINGER_MODE_NORMAL
                  }
                  try {
                      am.ringerMode = next
                  } catch (e: SecurityException) {
                      Toast.makeText(this, "Para o modo silencioso, libere o acesso ao Não perturbe.", Toast.LENGTH_LONG).show()
                      try { startActivity(Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)) } catch (_: Exception) { }
                  }
                  syncRinger()
              }

              // ---------------------------------------------------------------- ações
              private fun openUrl(url: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (_: Exception) {
                      Toast.makeText(this, "Não consegui abrir o link.", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun launchOr(pkg: String, fallback: () -> Unit) {
                  val i = packageManager.getLaunchIntentForPackage(pkg)
                  if (i != null) {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      try { startActivity(i) } catch (_: Exception) { fallback() }
                  } else {
                      fallback()
                  }
              }

              private fun hud(a: String) {
                  when (a) {
                      "google" -> launchOr("com.google.android.googlequicksearchbox") { openUrl("https://www.google.com") }
                      "play" -> launchOr("com.android.vending") { openUrl("https://play.google.com/store") }
                      "sound" -> cycleSound()
                      "gear" -> startActivity(Intent(this, SettingsActivity::class.java))
                      "prev", "next" -> {
                          val m = (Prefs.int("mode", 0) + (if (a == "next") 1 else 5)) % 6
                          Prefs.putInt("mode", m)
                          lastMode = m
                          scene.setMode(m, true)
                          updateVideo()
                      }
                  }
              }

              private fun openApp(it0: AppItem) {
                  val i = packageManager.getLaunchIntentForPackage(it0.pkg)
                  if (i == null) { Toast.makeText(this, "Não consegui abrir " + it0.label, Toast.LENGTH_SHORT).show(); return }
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                  val now = System.currentTimeMillis()
                  Prefs.putLong("lo_" + it0.pkg, now)
                  it0.lastUsed = now
                  try { startActivity(i) } catch (_: Exception) { }
              }

              private fun itemMenu(it0: AppItem) {
                  val opts = arrayOf("Esconder (sem desinstalar)", if (it0.game) "Mover para APP" else "Mover para JOGOS",
                      "Mover para o início da lista", "Informações do app")
                  AlertDialog.Builder(this).setTitle(it0.label).setItems(opts) { _, which ->
                      when (which) {
                          0 -> { Prefs.putStrs("hidden", Prefs.strs("hidden") + it0.pkg); it0.hidden = true; applyItems() }
                          1 -> {
                              val to = if (it0.game) "force_apps" else "force_games"
                              val from = if (it0.game) "force_games" else "force_apps"
                              Prefs.putStrs(to, Prefs.strs(to) + it0.pkg)
                              Prefs.putStrs(from, Prefs.strs(from) - it0.pkg)
                              it0.game = !it0.game
                              applyItems()
                          }
                          2 -> {
                              val k = if (it0.game) "games" else "apps"
                              val cur = (if (it0.game) scene.games else scene.apps).map { x -> x.pkg }.filter { p -> p != it0.pkg }
                              Prefs.putStr("order_$k", (listOf(it0.pkg) + cur).joinToString(","))
                              Prefs.putInt("order_mode", 0)
                              applyItems()
                          }
                          3 -> startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + it0.pkg)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          else -> { }
                      }
                  }.show()
              }

              // ---------------------------------------------------------------- widgets
              private fun widgetAction(w: Widget, long: Boolean) {
                  if (long) { widgetMenu(w); return }
                  when (w.type) {
                      "link" -> openUrl(w.data)
                      "sound" -> toggleSound(w)
                      "video" -> playVideo(w)
                      else -> { }
                  }
              }

              private fun widgetMenu(w: Widget) {
                  val opts = arrayOf("Mover", "Maior", "Menor", "Configurar", "Remover")
                  AlertDialog.Builder(this).setTitle(w.title.ifEmpty { w.type }).setItems(opts) { _, which ->
                      when (which) {
                          0 -> { scene.moveWidget = w; Toast.makeText(this, "Arraste o widget para onde quiser.", Toast.LENGTH_SHORT).show() }
                          1 -> { w.fw = minOf(0.9f, w.fw * 1.2f); saveWidgets() }
                          2 -> { w.fw = maxOf(0.08f, w.fw / 1.2f); saveWidgets() }
                          3 -> configWidget(w)
                          4 -> {
                              stopSound()
                              File(filesDir, "w_" + w.id).delete()
                              widgets.remove(w)
                              saveWidgets()
                          }
                          else -> { }
                      }
                  }.show()
              }

              private fun configWidget(w: Widget) {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(20), dp(8), dp(20), 0)
                  val t = EditText(this); t.hint = "Título"; t.setText(w.title)
                  box.addView(t)
                  val u = EditText(this); u.hint = "Endereço do link"; u.setText(w.data)
                  if (w.type == "link") box.addView(u)
                  AlertDialog.Builder(this).setTitle("Configurar widget").setView(box)
                      .setPositiveButton("Salvar") { _, _ ->
                          w.title = t.text.toString().trim()
                          if (w.type == "link") {
                              val s = u.text.toString().trim()
                              w.data = if (s.startsWith("http")) s else "https://$s"
                          }
                          saveWidgets()
                      }.setNegativeButton("Cancelar", null).show()
              }

              private fun toggleSound(w: Widget) {
                  if (playingW === w) { stopSound(); return }
                  stopSound()
                  try {
                      val m = MediaPlayer()
                      m.setDataSource(File(filesDir, "w_" + w.id).path)
                      m.setOnCompletionListener { stopSound() }
                      m.prepare()
                      m.start()
                      player = m; playingW = w; w.playing = true
                  } catch (e: Exception) {
                      Toast.makeText(this, "Não consegui tocar esse som.", Toast.LENGTH_SHORT).show()
                  }
                  scene.invalidate()
              }

              private fun stopSound() {
                  try { player?.release() } catch (_: Exception) { }
                  player = null
                  playingW?.playing = false
                  playingW = null
                  if (::scene.isInitialized) scene.invalidate()
              }

              private fun playVideo(w: Widget) {
                  val vv = VideoView(this)
                  vv.setVideoPath(File(filesDir, "w_" + w.id).path)
                  val mc = MediaController(this)
                  mc.setAnchorView(vv)
                  vv.setMediaController(mc)
                  val d = AlertDialog.Builder(this).setView(vv).create()
                  d.setOnDismissListener { vv.stopPlayback() }
                  d.show()
                  vv.start()
              }
          }

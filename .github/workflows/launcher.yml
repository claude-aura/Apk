              private fun assign(snap: Boolean) {
                  var idx = 0
                  for (k in 0..2) {
                      if (idx >= order.size) break
                      val cp = max(1, floor(TAU * ringR[k] / (ir * 2.5f)).toInt())
                      val n = if (k == 2) order.size - idx else min(cp, order.size - idx)
                      for (j in 0 until n) {

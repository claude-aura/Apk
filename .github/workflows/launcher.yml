              override fun busy(): Boolean = pull != null

              override fun tap(x: Float, y: Float): Boolean {
                  if (pull != null || order.isEmpty() || hypot(x - cx, y - cy) > rb * 1.3f) return false
                  val it0 = order[(Math.random() * order.size).toInt().coerceIn(0, order.size - 1)]
                  pull = it0; pr0 = it0.rad; phase = 1; pt = 0f
                  return true
              }

              private fun place(it0: AppItem) {
                  val a = it0.ang + it0.sp
                  it0.x = cx + cos(a) * it0.rad
                  it0.y = cy + sin(a) * it0.rad
              }

              override fun update(dt: Float) {
                  val span = ringR[2] - ringR[0] + 1f
                  for (it0 in order) {
                      if (it0 === pull) continue
                      val k = min(1f, dt * 5f)
                      var d = it0.wx - it0.ang
                      while (d > PIF) d -= TAU
                      while (d < -PIF) d += TAU
                      it0.ang += d * k
                      it0.rad += (it0.wy - it0.rad) * k
                      it0.sp += dt * 0.22f * (1.25f - 0.5f * ((it0.rad - ringR[0]) / span))
                      it0.r = ir; it0.s = 1f; it0.a = 1f
                      place(it0)
                  }
                  val pl = pull ?: return
                  pt += dt
                  if (phase == 1) {
                      val u = min(pt / 0.95f, 1f); val e = u * u
                      pl.rad = pr0 * (1f - e)
                      pl.ang += dt * (2f + 12f * e)
                      pl.s = 1f - 0.95f * e; pl.a = 1f - 0.5f * e; pl.r = ir
                      place(pl)
                      if (u >= 1f) {
                          val old = order.indexOf(pl)
                          order.remove(pl)
                          var ni = (Math.random() * (order.size + 1)).toInt().coerceIn(0, order.size)
                          if (order.isNotEmpty() && ni == old) ni = (ni + 1 + (Math.random() * order.size).toInt()) % (order.size + 1)
                          order.add(ni, pl)
                          assign(false)
                          pl.ang = pl.wx; pl.rad = pl.wy
                          phase = 2; pt = 0f
                      }
                  } else if (phase == 2) {
                      val u = min(pt / 0.6f, 1f)
                      pl.s = 1f - (1f - u) * (1f - u) * (1f - u); pl.a = 1f; pl.r = ir
                      pl.sp += dt * 0.22f
                      place(pl)
                      if (u >= 1f) { pull = null; phase = 0 }
                  }
              }

              override fun draw(c: Canvas) {
                  c.drawColor(0xFF02020A.toInt())
                  starField(c, stars, w, h, 150)
                  p.style = Paint.Style.FILL
                  p.shader = glowSh; c.drawCircle(cx, cy, rb * 3.2f, p); p.shader = null
                  c.save()
                  c.rotate(v.time * 8f, cx, cy)
                  c.scale(1f, 0.32f, cx, cy)
                  p.style = Paint.Style.STROKE
                  for (i in 0..3) {
                      p.strokeWidth = rb * (0.22f - i * 0.03f)
                      p.color = Color.argb(200 - i * 40, 255, 170 - i * 25, 60 + i * 20)
                      c.drawCircle(cx, cy, rb * (1.25f + i * 0.28f), p)
                  }
                  c.restore()
                  p.style = Paint.Style.FILL
                  p.color = Color.BLACK
                  c.drawCircle(cx, cy, rb, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = rb * 0.05f
                  p.color = Color.argb(130, 255, 255, 255)
                  c.drawCircle(cx, cy, rb * 1.02f, p)
                  val pl = pull
                  for (it0 in order) if (it0 !== pl) v.drawItem(c, it0)
                  if (pl != null) v.drawItem(c, pl)
              }
          }

          // ====================================================================== MAR
          class SeaEnv(v: SceneView) : Env(v) {
              private var w = 0f
              private var h = 0f
              private val zone = FloatArray(8)
              private val rnd = java.util.Random(11)
              private var ir = 0f
              private var bg: Shader? = null

              private fun items(g: Int) = if (g == 0) v.games else v.apps

              override fun layout(w: Int, h: Int) {
                  this.w = w.toFloat(); this.h = h.toFloat()
                  if (Prefs.int("sea_split", 0) == 0) {
                      zone[0] = this.w * 0.04f; zone[1] = this.h * 0.2f; zone[2] = this.w * 0.48f; zone[3] = this.h * 0.8f
                      zone[4] = this.w * 0.52f; zone[5] = this.h * 0.2f; zone[6] = this.w * 0.96f; zone[7] = this.h * 0.8f
                  } else {
                      zone[0] = this.w * 0.05f; zone[1] = this.h * 0.19f; zone[2] = this.w * 0.95f; zone[3] = this.h * 0.48f
                      zone[4] = this.w * 0.05f; zone[5] = this.h * 0.52f; zone[6] = this.w * 0.95f; zone[7] = this.h * 0.8f
                  }
                  var best = v.iconPx / 2f
                  for (g in 0..1) {
                      val area = (zone[g * 4 + 2] - zone[g * 4]) * (zone[g * 4 + 3] - zone[g * 4 + 1])
                      best = min(best, sqrt(area * 0.30f / (max(items(g).size, 1) * PIF)))
                  }
                  ir = max(best, 11f * v.dn)
                  for (g in 0..1) for (it0 in items(g)) {
                      val l = zone[g * 4]; val t = zone[g * 4 + 1]; val r = zone[g * 4 + 2]; val b = zone[g * 4 + 3]
                      if (it0.x < l || it0.x > r || it0.y < t || it0.y > b) {
                          it0.x = l + rnd.nextFloat() * (r - l); it0.y = t + rnd.nextFloat() * (b - t)
                          it0.wx = it0.x; it0.wy = it0.y; it0.tm = rnd.nextFloat() * 3f; it0.ph = rnd.nextFloat() * 6.28f
                      }
                      it0.r = ir; it0.s = 1f; it0.a = 1f
                  }
                  bg = LinearGradient(0f, 0f, 0f, this.h, intArrayOf(0xFF0C7BA8.toInt(), 0xFF0A4F82.toInt(), 0xFF052244.toInt()), null, Shader.TileMode.CLAMP)
              }

              override fun update(dt: Float) {
                  val speed = (40f + Prefs.int("sea_speed", 50) * 1.6f) * v.dn
                  for (g in 0..1) {
                      val l = zone[g * 4]; val t = zone[g * 4 + 1]; val r = zone[g * 4 + 2]; val b = zone[g * 4 + 3]
                      val list = items(g)
                      for (it0 in list) {
                          it0.tm -= dt
                          val dx = it0.wx - it0.x
                          val dy = it0.wy - it0.y
                          val dist = hypot(dx, dy)
                          if (it0.tm <= 0f || dist < it0.r) {
                              it0.wx = l + ir + rnd.nextFloat() * (r - l - 2 * ir)
                              it0.wy = t + ir + rnd.nextFloat() * (b - t - 2 * ir)
                              it0.tm = 3f + rnd.nextFloat() * 6f
                          }
                          val len = max(1f, dist)
                          val k = min(1f, dt * 0.9f)
                          it0.vx += (dx / len * speed - it0.vx) * k
                          it0.vy += (dy / len * speed - it0.vy) * k
                          it0.x += it0.vx * dt
                          it0.y += it0.vy * dt
                          it0.r = ir; it0.s = 1f; it0.a = 1f
                      }
                      // sem sobreposição permanente: um empurra o outro
                      for (i in 0 until list.size) for (j in i + 1 until list.size) {
                          val a = list[i]; val c = list[j]
                          val ddx = c.x - a.x; val ddy = c.y - a.y
                          val d2 = ddx * ddx + ddy * ddy
                          val md = (a.r + c.r) * 1.12f
                          if (d2 < md * md && d2 > 0.01f) {
                              val d = sqrt(d2)
                              val push = (md - d) * 0.5f
                              val nx = ddx / d; val ny = ddy / d
                              a.x -= nx * push; a.y -= ny * push; c.x += nx * push; c.y += ny * push
                          }
                      }
                      for (it0 in list) {
                          it0.x = it0.x.coerceIn(l + ir, max(l + ir, r - ir))
                          it0.y = it0.y.coerceIn(t + ir, max(t + ir, b - ir))
                      }
                  }
              }

              override fun draw(c: Canvas) {
                  p.style = Paint.Style.FILL
                  p.shader = bg; c.drawRect(0f, 0f, w, h, p); p.shader = null
                  for (l in 0..2) {
                      path.reset()
                      val base = h * (0.1f + 0.055f * l)
                      path.moveTo(0f, h)
                      var x = 0f
                      while (x <= w + 28f) {
                          path.lineTo(x, base + sin(x * (0.004f + 0.002f * l) + v.time * (0.7f + 0.3f * l) + l) * h * 0.016f)
                          x += 28f
                      }
                      path.lineTo(w, h); path.close()
                      p.color = Color.argb(26 + 10 * l, 255, 255, 255)
                      c.drawPath(path, p)
                  }
                  p.color = Color.argb(70, 255, 255, 255)
                  p.textAlign = Paint.Align.LEFT
                  p.textSize = h * 0.03f
                  p.typeface = Typeface.DEFAULT_BOLD
                  c.drawText("JOGOS", zone[0], zone[1] - h * 0.015f, p)
                  c.drawText("APP", zone[4], zone[5] - h * 0.015f, p)
                  for (g in 0..1) for (it0 in items(g)) {
                      val oy = it0.y
                      it0.y += sin(v.time * 1.4f + it0.ph) * it0.r * 0.12f
                      v.drawItem(c, it0)
                      it0.y = oy
                  }
              }
          }

          // ====================================================================== RP (casa viva)
          class RpEnv(v: SceneView) : Env(v) {
              private var w = 0f
              private var h = 0f
              private var x0 = 0f
              private var x1 = 0f
              private var gy = 0f
              private var fh = 0f
              private var roofH = 0f
              private var floors = 2
              private var ir = 0f
              private val rnd = java.util.Random(5)
              private val all = ArrayList<AppItem>()
              private var lastKey = ""
              private val stars = FloatArray(80)
              private val avail = BooleanArray(6)
              private var hour = 12
              private var hourT = 0f
              private var skySh: Shader? = null
              private var skyNight = false

              init { fillStars(stars, 21L) }

              private fun xm() = (x0 + x1) / 2f
              private fun floorY(f: Float) = gy - f * fh
              private fun night() = hour < 6 || hour >= 19

              /** Tipo de cômodo: 1 cozinha, 2 quarto, 3 esporte, 4 videogame, 5 sala (TV). */
              private fun kind(f: Int, side: Int): Int = when (f % 3) {
                  0 -> if (side == 0) 1 else 4
                  1 -> if (side == 0) 2 else 3
                  else -> if (side == 0) 2 else 5
              }

              override fun layout(w: Int, h: Int) {
                  this.w = w.toFloat(); this.h = h.toFloat()
                  all.clear(); all.addAll(v.games); all.addAll(v.apps)
                  floors = ((all.size + 5) / 6).coerceIn(2, 6)
                  x0 = this.w * 0.14f; x1 = this.w * 0.86f; gy = this.h * 0.80f
                  roofH = this.h * 0.07f
                  fh = (gy - this.h * 0.2f - roofH) / floors
                  ir = min(v.iconPx / 2f, fh * 0.2f)
                  for (i in 0..5) avail[i] = false
                  for (f in 0 until floors) for (s in 0..1) avail[kind(f, s)] = true
                  hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val key = all.joinToString(",") { it.pkg } + floors
                  if (key != lastKey) { lastKey = key; for (it0 in all) spawn(it0) }
                  for (it0 in all) it0.r = ir
              }

              private fun spawn(it0: AppItem) {
                  val days = if (it0.lastUsed > 0L) (System.currentTimeMillis() - it0.lastUsed) / 86400000f else 3f
                  it0.energy = (1.1f - days / 6f).coerceIn(0.15f, 1f)
                  it0.sleeper = days > 5f
                  it0.floor = rnd.nextInt(floors); it0.yF = it0.floor.toFloat(); it0.tfloor = it0.floor
                  it0.x = x0 + (x1 - x0) * (0.1f + 0.8f * rnd.nextFloat())
                  it0.ph = rnd.nextFloat() * 6.28f
                  it0.st = 0; it0.tm = rnd.nextFloat() * 2f; it0.act = 0
              }

              private fun decide(it0: AppItem) {
                  val e = it0.energy
                  val wg = floatArrayOf(0f, 1f, 0.7f, 1f, 1f, 1f)
                  if (it0.game) { wg[4] *= 2.2f; wg[3] *= 1.4f; wg[1] *= 0.5f } else { wg[1] *= 1.6f; wg[5] *= 1.4f; wg[4] *= 0.6f }
                  wg[2] *= (1.7f - e * 1.3f); wg[3] *= (0.4f + e); wg[4] *= (0.4f + e)
                  if (it0.sleeper) wg[2] *= 12f
                  for (i in 1..5) if (!avail[i]) wg[i] = 0f
                  var tot = 0f
                  for (i in 1..5) tot += wg[i]
                  var r = rnd.nextFloat() * tot
                  var a = 1
                  for (i in 1..5) { r -= wg[i]; if (r <= 0f && wg[i] > 0f) { a = i; break } }
                  it0.act = a
                  val cf = ArrayList<IntArray>()
                  for (f in 0 until floors) for (s in 0..1) if (kind(f, s) == a) cf.add(intArrayOf(f, s))
                  val pick = cf[rnd.nextInt(cf.size)]
                  val rw = xm() - x0
                  val center = if (pick[1] == 0) x0 + rw / 2 else xm() + rw / 2
                  it0.tfloor = pick[0]
                  it0.wx = center + (rnd.nextFloat() - 0.5f) * rw * 0.5f
                  it0.st = 1
              }

              private fun doTime(it0: AppItem): Float {
                  val base = if (it0.act == 2) 12f + rnd.nextFloat() * 14f else 5f + rnd.nextFloat() * 8f
                  return base * (if (it0.act == 2 && it0.sleeper) 2.2f else 1f)
              }

              override fun update(dt: Float) {
                  hourT += dt
                  if (hourT > 30f) { hourT = 0f; hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY) }
                  val sp = 55f * v.dn
                  for (it0 in all) {
                      it0.r = ir; it0.s = 1f; it0.a = 1f
                      when (it0.st) {
                          0, 2 -> { it0.tm -= dt; if (it0.tm <= 0f) decide(it0) }
                          1 -> {
                              val speed = sp * (0.6f + it0.energy * 0.6f)
                              if (it0.floor != it0.tfloor) {
                                  val sx = xm()
                                  if (abs(it0.x - sx) < 3f) { it0.x = sx; it0.st = 3; it0.tm = 0f }
                                  else it0.x += sign(sx - it0.x) * min(abs(sx - it0.x), speed * dt)
                              } else {
                                  if (abs(it0.x - it0.wx) < 3f) { it0.st = 2; it0.tm = doTime(it0) }
                                  else it0.x += sign(it0.wx - it0.x) * min(abs(it0.wx - it0.x), speed * dt)
                              }
                          }
                          3 -> {
                              it0.tm += dt
                              val dir = if (it0.tfloor > it0.floor) 1 else -1
                              it0.yF = it0.floor + dir * it0.tm.coerceIn(0f, 1f)
                              if (it0.tm >= 1f) { it0.floor += dir; it0.yF = it0.floor.toFloat(); it0.st = 1 }
                          }
                      }
                      val sleeping = it0.st == 2 && it0.act == 2
                      it0.y = floorY(it0.yF) - (if (sleeping) ir * 0.95f else ir * 1.55f)
                  }
              }

              private fun sky(night: Boolean): Shader {
                  if (skySh == null || skyNight != night) {
                      skyNight = night
                      skySh = LinearGradient(0f, 0f, 0f, gy,
                          if (night) intArrayOf(0xFF0A0F2C.toInt(), 0xFF1B2550.toInt()) else intArrayOf(0xFF5CB8FF.toInt(), 0xFFCFEBFF.toInt()),
                          null, Shader.TileMode.CLAMP)
                  }
                  return skySh!!
              }

              private fun furniture(c: Canvas, kind: Int, rx0: Float, rx1: Float, fy: Float) {
                  val cx = (rx0 + rx1) / 2
                  val rw = rx1 - rx0
                  p.style = Paint.Style.FILL
                  p.shader = null
                  when (kind) {
                      1 -> {
                          p.color = 0xFF8D6E63.toInt(); c.drawRect(cx - rw * 0.22f, fy - fh * 0.28f, cx + rw * 0.22f, fy, p)
                          p.color = 0xFF37474F.toInt(); c.drawRect(cx - rw * 0.2f, fy - fh * 0.3f, cx + rw * 0.2f, fy - fh * 0.28f, p)
                          for (k in 0..2) {
                              val u = (v.time * 0.6f + k * 0.33f) % 1f
                              p.color = Color.argb(((1f - u) * 130).toInt(), 255, 255, 255)
                              c.drawCircle(cx - rw * 0.1f + k * rw * 0.1f, fy - fh * 0.32f - u * fh * 0.3f, fh * 0.03f * (1f + u), p)
                          }
                      }
                      2 -> {
                          p.color = 0xFF7E57C2.toInt(); c.drawRect(cx - rw * 0.28f, fy - fh * 0.16f, cx + rw * 0.28f, fy - fh * 0.05f, p)
                          p.color = 0xFFECEFF1.toInt(); c.drawRect(cx - rw * 0.28f, fy - fh * 0.2f, cx - rw * 0.18f, fy - fh * 0.16f, p)
                          p.color = 0xFF4E342E.toInt(); c.drawRect(cx - rw * 0.28f, fy - fh * 0.05f, cx - rw * 0.26f, fy, p); c.drawRect(cx + rw * 0.26f, fy - fh * 0.05f, cx + rw * 0.28f, fy, p)
                      }
                      3 -> {
                          p.color = 0xFF455A64.toInt(); c.drawRect(cx - rw * 0.25f, fy - fh * 0.08f, cx + rw * 0.25f, fy, p)
                          p.color = 0xFF90A4AE.toInt()
                          for (k in 0..4) { val sx = cx - rw * 0.25f + ((v.time * 40f * v.dn + k * rw * 0.1f) % (rw * 0.5f)); c.drawRect(sx, fy - fh * 0.08f, sx + rw * 0.02f, fy, p) }
                      }
                      4 -> {
                          p.color = 0xFF263238.toInt(); c.drawRect(cx - rw * 0.12f, fy - fh * 0.5f, cx + rw * 0.12f, fy - fh * 0.28f, p)
                          p.color = Color.HSVToColor(floatArrayOf((v.time * 60f) % 360f, 0.6f, 0.95f)); c.drawRect(cx - rw * 0.105f, fy - fh * 0.485f, cx + rw * 0.105f, fy - fh * 0.295f, p)
                          p.color = 0xFF37474F.toInt(); c.drawRect(cx - rw * 0.08f, fy - fh * 0.12f, cx + rw * 0.08f, fy - fh * 0.04f, p)
                      }
                      else -> {
                          p.color = 0xFF5D4037.toInt(); c.drawRect(cx - rw * 0.3f, fy - fh * 0.2f, cx - rw * 0.02f, fy, p)
                          p.color = 0xFF263238.toInt(); c.drawRect(cx + rw * 0.1f, fy - fh * 0.42f, cx + rw * 0.32f, fy - fh * 0.22f, p)
                          p.color = Color.argb((120 + 100 * abs(sin(v.time * 3f))).toInt(), 140, 190, 255); c.drawRect(cx + rw * 0.115f, fy - fh * 0.405f, cx + rw * 0.305f, fy - fh * 0.235f, p)
                      }
                  }
              }

              private fun drawChar(c: Canvas, it0: AppItem) {
                  val sleeping = it0.st == 2 && it0.act == 2
                  val moving = it0.st == 1 || it0.st == 3
                  val fy = floorY(it0.yF)
                  p.style = Paint.Style.FILL; p.shader = null
                  p.color = Color.argb(60, 0, 0, 0)
                  rf.set(it0.x - ir, fy - ir * 0.15f, it0.x + ir, fy + ir * 0.15f)
                  c.drawOval(rf, p)
                  if (!sleeping) {
                      val sw = if (moving) sin(v.time * 10f + it0.ph) * ir * 0.35f else 0f
                      p.style = Paint.Style.STROKE; p.strokeWidth = ir * 0.22f; p.strokeCap = Paint.Cap.ROUND
                      p.color = Color.argb(230, 255, 255, 255)
                      c.drawLine(it0.x - ir * 0.3f, fy - ir * 0.55f, it0.x - ir * 0.3f + sw, fy, p)
                      c.drawLine(it0.x + ir * 0.3f, fy - ir * 0.55f, it0.x + ir * 0.3f - sw, fy, p)
                      p.strokeCap = Paint.Cap.BUTT
                  }
                  if (sleeping) { c.save(); c.rotate(90f, it0.x, it0.y); v.drawItem(c, it0); c.restore() } else v.drawItem(c, it0)
                  p.style = Paint.Style.FILL
                  if (sleeping) {
                      p.typeface = Typeface.DEFAULT_BOLD; p.textAlign = Paint.Align.LEFT
                      for (k in 0..2) {
                          val u = (v.time * 0.5f + k * 0.33f) % 1f
                          p.color = Color.argb(((1f - u) * 220).toInt(), 255, 255, 255)
                          p.textSize = ir * (0.5f + u * 0.5f)
                          c.drawText("z", it0.x + ir * (0.9f + u * 0.6f), it0.y - ir * (0.6f + u * 1.4f), p)
                      }
                  } else if (it0.st == 2 && it0.act == 3) {
                      p.color = 0xFFFF8F00.toInt()
                      c.drawCircle(it0.x + ir * 1.1f, fy - ir * 0.4f - abs(sin(v.time * 7f + it0.ph)) * ir * 1.2f, ir * 0.3f, p)
                  } else if (it0.st == 2 && it0.act == 4) {
                      p.color = 0xFF37474F.toInt()
                      rf.set(it0.x - ir * 0.5f, it0.y + ir * 0.8f, it0.x + ir * 0.5f, it0.y + ir * 1.15f)
                      c.drawRoundRect(rf, ir * 0.15f, ir * 0.15f, p)
                  } else if (it0.st == 2 && it0.act == 1) {
                      p.style = Paint.Style.STROKE; p.strokeWidth = ir * 0.12f; p.color = 0xFFBCAAA4.toInt()
                      c.drawLine(it0.x + ir * 0.9f, it0.y + ir * 0.5f, it0.x + ir * 1.3f + sin(v.time * 6f) * ir * 0.2f, it0.y - ir * 0.3f, p)
                      p.style = Paint.Style.FILL
                  }
              }

              override fun draw(c: Canvas) {
                  val ng = night()
                  p.style = Paint.Style.FILL
                  p.shader = sky(ng); c.drawRect(0f, 0f, w, gy, p); p.shader = null
                  if (ng) starField(c, stars, w, gy, 200)
                  p.color = if (ng) 0xFF14301C.toInt() else 0xFF5FAE5B.toInt()
                  c.drawRect(0f, gy, w, h, p)
                  val top = gy - floors * fh
                  path.reset(); path.moveTo(x0 - w * 0.02f, top); path.lineTo(xm(), top - roofH); path.lineTo(x1 + w * 0.02f, top); path.close()
                  p.color = 0xFFB5473B.toInt(); c.drawPath(path, p)
                  p.color = if (ng) 0xFF3A3F63.toInt() else 0xFFF2E8D8.toInt()
                  c.drawRect(x0, top, x1, gy, p)
                  p.style = Paint.Style.STROKE
                  p.color = if (ng) 0xFF1C1F36.toInt() else 0xFF9A8B78.toInt()
                  p.strokeWidth = 4f * v.dn
                  for (f in 0..floors) c.drawLine(x0, floorY(f.toFloat()), x1, floorY(f.toFloat()), p)
                  c.drawLine(x0, top, x0, gy, p); c.drawLine(x1, top, x1, gy, p)
                  p.strokeWidth = 2f * v.dn
                  for (f in 0 until floors) c.drawLine(xm(), floorY(f.toFloat()) - fh, xm(), floorY(f.toFloat()) - fh * 0.5f, p)
                  p.strokeWidth = 5f * v.dn
                  p.color = 0xFF8D6E63.toInt()
                  for (f in 0 until floors - 1) c.drawLine(xm() - fh * 0.22f, floorY(f.toFloat()), xm() + fh * 0.22f, floorY((f + 1).toFloat()), p)
                  for (f in 0 until floors) for (s in 0..1) {
                      furniture(c, kind(f, s), if (s == 0) x0 else xm(), if (s == 0) xm() else x1, floorY(f.toFloat()))
                  }
                  for (it0 in all) drawChar(c, it0)
              }
          }

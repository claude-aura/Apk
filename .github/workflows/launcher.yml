                  p.textAlign = Paint.Align.CENTER
                  p.textSize = h * 0.04f
                  p.typeface = Typeface.DEFAULT_BOLD
                  p.letterSpacing = 0.2f
                  p.setShadowLayer(6f, 0f, 0f, Color.BLACK)
                  c.drawText("JOGOS", w * 0.17f, h * 0.21f, p)
                  c.drawText("APP", w * 0.83f, h * 0.21f, p)
                  p.clearShadowLayer()

                      }
                  }
              }
          }

          // ====================================================================== TERRA
          class TerraEnv(v: SceneView) : Env(v) {
              private var w = 0f
              private var h = 0f
              private var cx = 0f
              private var cy = 0f
              private var re = 0f
              private var ir = 0f
              private val ringR = FloatArray(3)
              private var impItem: AppItem? = null
              private var impT = 0f
              private var hitAng = 0f
              private var dmg = 0f
              private var oceanSh: Shader? = null
              private var glowSh: Shader? = null
              private val stars = FloatArray(160)
              private val blobs = floatArrayOf(0.2f, 0.3f, 0.5f, 1.4f, -0.2f, 0.45f, 2.6f, 0.5f, 0.4f, 3.7f, -0.4f, 0.5f, 4.6f, 0.2f, 0.45f, 5.6f, -0.1f, 0.4f)
              private val green = Color.parseColor("#3E9B4F")

              init { fillStars(stars, 3L) }

              private fun cap(r: Float): Int {
                  var t = 0
                  for (k in 0..2) t += max(1, floor(PIF * 0.76f * ringR[k] / (r * 2.24f)).toInt())
                  return t
              }

              private fun assign(list: List<AppItem>, a0: Float, a1: Float) {
                  var idx = 0
                  for (k in 0..2) {
                      if (idx >= list.size) break
                      val cp = max(1, floor((a1 - a0) * ringR[k] / (ir * 2.24f)).toInt())
                      val n = if (k == 2) list.size - idx else min(cp, list.size - idx)
                      for (j in 0 until n) {
                          val it0 = list[idx + j]
                          it0.ring = k
                          it0.ang = a0 + (a1 - a0) * (j + 0.5f) / n
                          it0.rad = ringR[k]
                          it0.ph = (idx + j) * 0.7f
                      }
                      idx += n
                  }
              }

              override fun layout(w: Int, h: Int) {
                  this.w = w.toFloat(); this.h = h.toFloat()
                  cx = this.w / 2; cy = this.h * 0.5f
                  val maxR = min(this.h * 0.30f, this.w * 0.27f)
                  re = maxR * 0.36f
                  val sp = (maxR - re) / 3f
                  for (k in 0..2) ringR[k] = re + sp * (k + 1)
                  ir = min(v.iconPx / 2f, sp * 0.44f)
                  val need = max(v.games.size, v.apps.size)
                  while (ir > 11f * v.dn && cap(ir) < need) ir *= 0.93f
                  assign(v.games, PIF * 1.12f, PIF * 1.88f)
                  assign(v.apps, PIF * 0.12f, PIF * 0.88f)
                  oceanSh = RadialGradient(cx - re * 0.35f, cy - re * 0.35f, re * 1.5f,
                      intArrayOf(0xFF6EC6FF.toInt(), 0xFF1E6FD0.toInt(), 0xFF0B2A6B.toInt()), floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP)
                  glowSh = RadialGradient(cx, cy, re * 1.45f, intArrayOf(0x6638A9FF, 0x0038A9FF), floatArrayOf(0.7f, 1f), Shader.TileMode.CLAMP)
              }

              override fun busy(): Boolean = impItem != null

              override fun tap(x: Float, y: Float): Boolean {
                  if (impItem != null || hypot(x - cx, y - cy) > re * 1.15f) return false
                  val pool = if (v.games.isNotEmpty()) v.games else v.apps
                  if (pool.isEmpty()) return false
                  impItem = pool[(Math.random() * pool.size).toInt().coerceIn(0, pool.size - 1)]
                  impT = 0f
                  val it0 = impItem!!
                  hitAng = atan2(it0.y - cy, it0.x - cx)
                  return true
              }

              private fun orbit(list: List<AppItem>) {
                  val t = v.time
                  for (it0 in list) {
                      val a = it0.ang + sin(t * 0.5f + it0.ph) * 0.025f
                      it0.x = cx + cos(a) * it0.rad; it0.y = cy + sin(a) * it0.rad
                      it0.r = ir; it0.s = 1f; it0.a = 1f
                  }
              }

              override fun update(dt: Float) {
                  orbit(v.games); orbit(v.apps)
                  val imp = impItem ?: return
                  impT += dt
                  val ox = imp.x
                  val oy = imp.y
                  val d = max(1f, hypot(ox - cx, oy - cy))
                  val sx = cx + (ox - cx) / d * re
                  val sy = cy + (oy - cy) / d * re
                  if (impT < 0.7f) {
                      val u = impT / 0.7f; val e = u * u
                      imp.x = ox + (sx - ox) * e; imp.y = oy + (sy - oy) * e; imp.s = 1f - 0.45f * e
                  } else if (impT < 1.0f) {
                      imp.a = 0f
                  } else if (impT < 1.8f) {
                      val u = (impT - 1f) / 0.8f; val e = 1f - (1f - u) * (1f - u)
                      imp.x = sx + (ox - sx) * e; imp.y = sy + (oy - sy) * e; imp.s = 0.55f + 0.45f * e
                  }
                  dmg = if (impT < 0.7f) 0f else if (impT < 0.9f) 1f else if (impT < 2.7f) 1f - ((impT - 0.9f) / 1.8f).let { it * it * (3f - 2f * it) } else 0f
                  if (impT >= 2.7f) { impItem = null; dmg = 0f }
              }

              override fun draw(c: Canvas) {
                  c.drawColor(0xFF04050E.toInt())
                  starField(c, stars, w, h, 170)
                  val shake = if (impItem != null && impT in 0.7f..1.1f) sin(impT * 70f) * 6f * v.dn * (1f - (impT - 0.7f) / 0.4f) else 0f
                  c.save()
                  c.translate(shake, shake * 0.4f)
                  p.style = Paint.Style.FILL
                  p.shader = glowSh; c.drawCircle(cx, cy, re * 1.45f, p)
                  p.shader = oceanSh; c.drawCircle(cx, cy, re, p)
                  p.shader = null
                  c.save()
                  path.reset(); path.addCircle(cx, cy, re, Path.Direction.CW); c.clipPath(path)
                  p.color = green
                  val rot = v.time * 0.15f
                  var i = 0
                  while (i < blobs.size) {
                      val lon = blobs[i] + rot
                      val cl = cos(lon)
                      if (cl > 0f) {
                          val lat = blobs[i + 1]
                          val bx = cx + re * cos(lat) * sin(lon)
                          val by = cy + re * sin(lat)
                          val sz = re * blobs[i + 2]
                          rf.set(bx - sz * cl, by - sz * 0.6f, bx + sz * cl, by + sz * 0.6f)
                          c.drawOval(rf, p)
                      }
                      i += 3
                  }
                  if (dmg > 0.01f) {
                      val hx = cx + cos(hitAng) * re * 0.8f
                      val hy = cy + sin(hitAng) * re * 0.8f
                      val k = 0.6f + 0.4f * dmg
                      p.style = Paint.Style.FILL
                      p.color = Color.argb((dmg * 220).toInt(), 60, 14, 6)
                      c.drawCircle(hx, hy, re * 0.26f * k, p)
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = re * 0.04f
                      p.color = Color.argb((dmg * 255).toInt(), 255, 140, 40)
                      c.drawCircle(hx, hy, re * 0.3f * k, p)
                      for (q in 0..4) {
                          val a = hitAng + PIF + (q - 2) * 0.5f
                          c.drawLine(hx, hy, hx + cos(a) * re * 0.5f * dmg, hy + sin(a) * re * 0.5f * dmg, p)
                      }
                      p.style = Paint.Style.FILL
                  }
                  c.restore()
                  c.restore()
                  // clarão e estilhaços do impacto
                  if (impItem != null && impT in 0.7f..1.6f) {
                      val u = (impT - 0.7f) / 0.9f
                      val hx = cx + cos(hitAng) * re
                      val hy = cy + sin(hitAng) * re
                      p.style = Paint.Style.FILL
                      p.color = Color.argb(((1f - u) * 200).toInt(), 255, 240, 200)
                      c.drawCircle(hx, hy, re * 0.45f * (1f - u * 0.5f), p)
                      for (q in 0..9) {
                          val a = hitAng + (q - 4.5f) * 0.28f
                          p.color = Color.argb(((1f - u) * 255).toInt(), 255, 190, 110)
                          c.drawCircle(hx + cos(a) * u * re * 0.9f, hy + sin(a) * u * re * 0.9f, 4f * v.dn * (1f - u), p)
                      }
                  }
                  val imp = impItem
                  for (it0 in v.games) if (it0 !== imp) v.drawItem(c, it0)
                  for (it0 in v.apps) if (it0 !== imp) v.drawItem(c, it0)
                  if (imp != null) v.drawItem(c, imp)
              }
          }

          // ====================================================================== BURACO NEGRO
          class BhEnv(v: SceneView) : Env(v) {
              private val order = ArrayList<AppItem>()
              private var sig = ""
              private var w = 0f
              private var h = 0f
              private var cx = 0f
              private var cy = 0f
              private var rb = 0f
              private var ir = 0f

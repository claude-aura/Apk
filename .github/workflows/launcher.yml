                  val t = EditText(this); t.hint = "Título"
                  val u = EditText(this); u.hint = "Endereço (ex: youtube.com)"
                  box.addView(t); box.addView(u)
                  AlertDialog.Builder(this).setTitle("Novo link").setView(box)
                      .setPositiveButton("Adicionar") { _, _ ->
                          val s = u.text.toString().trim()
                          if (s.isNotEmpty()) newWidget("link", t.text.toString().trim(), if (s.startsWith("http")) s else "https://$s")
                      }.setNegativeButton("Cancelar", null).show()
              }

              private fun newWidget(type: String, title: String, data: String): Widget {
                  val all = Store.loadWidgets()
                  val n = all.size % 4
                  val w = Widget(System.currentTimeMillis().toString(), type, title, data, 0.32f + 0.05f * n, 0.26f + 0.07f * n, 0.22f)
                  all.add(w)
                  Store.saveWidgets(all)
                  Prefs.putBool("widgets_on", true)
                  refreshWidgets()
                  return w
              }

              private fun copy(uri: Uri, dst: File): Boolean = try {
                  contentResolver.openInputStream(uri)?.use { i -> FileOutputStream(dst).use { o -> i.copyTo(o) } }
                  true
              } catch (_: Exception) { false }

              private fun nameOf(u: Uri): String {
                  contentResolver.query(u, null, null, null, null)?.use { c ->
                      val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (i >= 0 && c.moveToFirst()) return c.getString(i)
                  }
                  return ""
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  if (requestCode == 210) {
                      val mime = contentResolver.getType(uri) ?: ""
                      val kind = if (mime.startsWith("video")) "video" else "image"
                      if (copy(uri, File(filesDir, "wall.bin"))) {
                          Prefs.putStr("wall_kind", kind)
                          Prefs.putInt("wall_ver", Prefs.int("wall_ver", 0) + 1)
                          toast("Wallpaper importado. Escolha o ambiente WALLPAPER.")
                      } else toast("Não consegui importar esse arquivo.")
                      return
                  }
                  val type = when (requestCode) { 201 -> "gif"; 202 -> "photo"; 203 -> "video"; 204 -> "sound"; else -> return }
                  val id = System.currentTimeMillis().toString()
                  if (!copy(uri, File(filesDir, "w_$id"))) { toast("Não consegui importar esse arquivo."); return }
                  val all = Store.loadWidgets()
                  val n = all.size % 4
                  all.add(Widget(id, type, nameOf(uri), "", 0.32f + 0.05f * n, 0.26f + 0.07f * n, 0.22f))
                  Store.saveWidgets(all)
                  Prefs.putBool("widgets_on", true)
                  refreshWidgets()
                  toast("Widget adicionado. Segure nele na tela inicial para mover.")
              }
          }

              private fun restoreHidden() {
                  Thread {
                      val pm = packageManager
                      val hidden = Prefs.strs("hidden")
                      val list = ArrayList<Pair<String, String>>()
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      for (ri in pm.queryIntentActivities(intent, 0)) {
                          val p = ri.activityInfo.packageName
                          if (hidden.contains(p) && list.none { it.first == p }) list.add(Pair(p, ri.loadLabel(pm).toString()))
                      }
                      runOnUiThread {
                          if (list.isEmpty()) {
                              toast("Nenhum app oculto.")
                          } else {
                              val labels = list.map { it.second }.toTypedArray()
                              val checked = BooleanArray(list.size)
                              AlertDialog.Builder(this).setTitle("Restaurar quais?")
                                  .setMultiChoiceItems(labels, checked) { _, i, c -> checked[i] = c }
                                  .setPositiveButton("Restaurar") { _, _ ->
                                      var h = Prefs.strs("hidden")
                                      for (i in list.indices) if (checked[i]) h = h - list[i].first
                                      Prefs.putStrs("hidden", h)
                                      toast("Restaurado.")
                                  }.setNegativeButton("Cancelar", null).show()
                          }
                      }
                  }.start()
              }


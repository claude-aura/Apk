# Gato dos Toques v3 (corrige o erro de compilação do v2).
# Coloque em .github/workflows/build-gato-v3.yml. Compila na nuvem e publica o APK em "Releases".
name: Gerar APK do Gato dos Toques v3

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar o projeto Android
        run: |
          mkdir -p app app/src/main app/src/main/java/com/gatotoque app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GatoDosToques"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.gatotoque"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.gatotoque"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/star_big_on"
                  android:label="@string/app_name">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".AppsActivity" android:exported="false" android:label="Escolher apps" />

                  <service
                      android:name=".GatoService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="0"
              android:description="@string/service_desc" />
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Gato dos Toques</string>
              <string name="service_desc">Mostra um gato (ou sua foto) por cima dos apps que reage a cada toque na tela. Só vê qual app está aberto, não lê o conteúdo das telas.</string>
          </resources>
          EOF
          cat > app/src/main/java/com/gatotoque/AppsActivity.kt <<'EOF'
          package com.gatotoque

          import android.app.Activity
          import android.content.Intent
          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView

          /** Lista os apps instalados; os marcados são onde o gato aparece (no modo "só nos apps escolhidos"). */
          class AppsActivity : Activity() {
              private class Item(val label: String, val pkg: String, val icon: Drawable)
              private class Row(val icon: ImageView, val name: TextView, val chk: CheckBox)

              private val all = ArrayList<Item>()
              private val shown = ArrayList<Item>()
              private val sel = HashSet<String>()
              private lateinit var adapter: BaseAdapter

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Prefs.init(this)
                  sel.addAll(Prefs.selected())

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.fitsSystemWindows = true
                  root.setPadding(dp(12), dp(12), dp(12), 0)
                  val info = TextView(this)
                  info.text = "Marque os apps onde o gato deve aparecer."
                  val search = EditText(this)
                  search.hint = "Buscar app…"
                  search.setSingleLine()
                  val list = ListView(this)
                  root.addView(info)
                  root.addView(search)
                  root.addView(list, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)

                  adapter = object : BaseAdapter() {
                      override fun getCount() = shown.size
                      override fun getItem(position: Int): Any = shown[position]
                      override fun getItemId(position: Int) = position.toLong()
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val row: Row
                          val v: View
                          if (convertView == null) {
                              val box = LinearLayout(this@AppsActivity)
                              box.orientation = LinearLayout.HORIZONTAL
                              box.gravity = Gravity.CENTER_VERTICAL
                              box.setPadding(0, dp(6), 0, dp(6))
                              val ic = ImageView(this@AppsActivity)
                              val nm = TextView(this@AppsActivity)
                              nm.setPadding(dp(12), 0, dp(12), 0)
                              val ck = CheckBox(this@AppsActivity)
                              ck.isClickable = false
                              ck.isFocusable = false
                              box.addView(ic, LinearLayout.LayoutParams(dp(40), dp(40)))
                              box.addView(nm, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                              box.addView(ck)
                              row = Row(ic, nm, ck)
                              box.tag = row
                              v = box
                          } else {
                              v = convertView
                              row = convertView.tag as Row
                          }
                          val item = shown[position]
                          row.icon.setImageDrawable(item.icon)
                          row.name.text = item.label
                          row.chk.isChecked = sel.contains(item.pkg)
                          return v
                      }
                  }
                  list.adapter = adapter
                  list.setOnItemClickListener { _, _, pos, _ ->
                      val pkg = shown[pos].pkg
                      if (!sel.add(pkg)) sel.remove(pkg)
                      Prefs.setSelected(sel)
                      GatoService.instance?.refresh()
                      adapter.notifyDataSetChanged()
                  }
                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) { filter(s?.toString() ?: "") }
                  })

                  Thread {
                      val pm = packageManager
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val seen = HashSet<String>()
                      val tmp = ArrayList<Item>()
                      for (ri in pm.queryIntentActivities(intent, 0)) {
                          val p = ri.activityInfo.packageName
                          if (p == packageName || !seen.add(p)) continue
                          tmp.add(Item(ri.loadLabel(pm).toString(), p, ri.loadIcon(pm)))
                      }
                      tmp.sortBy { it.label.lowercase() }
                      runOnUiThread {
                          all.addAll(tmp)
                          filter(search.text.toString())
                      }
                  }.start()
              }

              private fun filter(q: String) {
                  shown.clear()
                  val k = q.trim().lowercase()
                  for (i in all) if (k.isEmpty() || i.label.lowercase().contains(k)) shown.add(i)
                  adapter.notifyDataSetChanged()
              }
          }
          EOF
          cat > app/src/main/java/com/gatotoque/CatView.kt <<'EOF'
          package com.gatotoque

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Typeface
          import android.graphics.RectF
          import android.view.View
          import java.io.File

          /** Lê uma imagem do disco reduzindo se for enorme. */
          fun loadBitmap(f: File): Bitmap? {
              if (!f.exists()) return null
              return try {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(f.path, o)
                  var s = 1
                  while (o.outWidth / s > 1024 || o.outHeight / s > 1024) s *= 2
                  BitmapFactory.decodeFile(f.path, BitmapFactory.Options().apply { inSampleSize = s })
              } catch (e: Exception) {
                  null
              }
          }

          /** O gato (desenhado no código) ou a foto do usuário. */
          class CatView(c: Context) : View(c) {
              var idle: Bitmap? = null
              var down: Bitmap? = null
              var tapped = false
              var side = false // false = pata esquerda, true = pata direita
              var editing = false
              var circle = false
              var showSeq = false
              var seq = 0
              var frac = 0f
              var alphaPct = 100

              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val rect = RectF()

              private fun fill(col: Int) { p.style = Paint.Style.FILL; p.color = col }
              private fun stroke(col: Int, w: Float) {
                  p.style = Paint.Style.STROKE; p.color = col; p.strokeWidth = w; p.strokeCap = Paint.Cap.ROUND
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = w // o gato ocupa o quadrado de cima; embaixo fica a sequência
                  val full = height.toFloat()
                  val bmp = if (tapped && down != null) down else idle
                  val layer = c.saveLayerAlpha(0f, 0f, w, h, alphaPct * 255 / 100)
                  if (bmp != null) {
                      val r = minOf(w / bmp.width, h / bmp.height)
                      val dw = bmp.width * r
                      val dh = bmp.height * r
                      rect.set((w - dw) / 2, (h - dh) / 2, (w + dw) / 2, (h + dh) / 2)
                      val save = c.save()
                      if (circle) {
                          path.reset()
                          path.addOval(rect, Path.Direction.CW)
                          c.clipPath(path)
                      }
                      fill(Color.WHITE)
                      c.drawBitmap(bmp, null, rect, p)
                      c.restoreToCount(save)
                  } else {
                      drawCat(c, minOf(w, h) / 100f)
                  }
                  c.restoreToCount(layer)
                  if (showSeq && seq > 0) {
                      val ts = w * 0.38f
                      p.textAlign = Paint.Align.CENTER
                      p.textSize = ts
                      p.typeface = Typeface.DEFAULT_BOLD
                      p.strokeJoin = Paint.Join.ROUND
                      val y = w + ts * 0.95f
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = ts * 0.16f
                      p.color = Color.BLACK
                      c.drawText(seq.toString(), w / 2, y, p)
                      p.style = Paint.Style.FILL
                      p.color = Color.WHITE
                      c.drawText(seq.toString(), w / 2, y, p)
                      val bw = w * 0.7f
                      val bh = w * 0.04f
                      val bx = (w - bw) / 2
                      val by = y + ts * 0.14f
                      fill(Color.BLACK)
                      rect.set(bx - bh * 0.4f, by - bh * 0.4f, bx + bw + bh * 0.4f, by + bh * 1.4f)
                      c.drawRoundRect(rect, bh, bh, p)
                      fill(Color.WHITE)
                      rect.set(bx, by, bx + bw * frac, by + bh)
                      c.drawRoundRect(rect, bh / 2, bh / 2, p)
                      p.typeface = Typeface.DEFAULT
                  }
                  if (editing) {
                      stroke(Color.parseColor("#6D4AFF"), 6f)
                      p.pathEffect = DashPathEffect(floatArrayOf(18f, 12f), 0f)
                      c.drawRect(3f, 3f, w - 3f, full - 3f, p)
                      p.pathEffect = null
                  }
              }

              private fun drawCat(c: Canvas, u: Float) {
                  val fur = Color.parseColor("#F2A65A")
                  val dark = Color.parseColor("#2B2B2B")
                  val light = Color.parseColor("#FFE3BF")
                  val pink = Color.parseColor("#F28B9B")
                  // orelhas
                  fill(fur)
                  path.reset(); path.moveTo(18 * u, 40 * u); path.lineTo(24 * u, 10 * u); path.lineTo(46 * u, 28 * u); path.close(); c.drawPath(path, p)
                  path.reset(); path.moveTo(82 * u, 40 * u); path.lineTo(76 * u, 10 * u); path.lineTo(54 * u, 28 * u); path.close(); c.drawPath(path, p)
                  fill(pink)
                  path.reset(); path.moveTo(25 * u, 33 * u); path.lineTo(27 * u, 19 * u); path.lineTo(38 * u, 28 * u); path.close(); c.drawPath(path, p)
                  path.reset(); path.moveTo(75 * u, 33 * u); path.lineTo(73 * u, 19 * u); path.lineTo(62 * u, 28 * u); path.close(); c.drawPath(path, p)
                  // cabeça e focinho
                  fill(fur); rect.set(12 * u, 22 * u, 88 * u, 76 * u); c.drawOval(rect, p)
                  fill(light); rect.set(30 * u, 50 * u, 70 * u, 74 * u); c.drawOval(rect, p)
                  // olhos: abertos normalmente, fechadinhos quando a pata bate
                  if (tapped) {
                      stroke(dark, 2.5f * u)
                      c.drawLine(29 * u, 47 * u, 41 * u, 47 * u, p)
                      c.drawLine(59 * u, 47 * u, 71 * u, 47 * u, p)
                  } else {
                      fill(Color.WHITE)
                      c.drawCircle(35 * u, 46 * u, 7 * u, p); c.drawCircle(65 * u, 46 * u, 7 * u, p)
                      fill(dark)
                      c.drawCircle(35 * u, 47 * u, 3.5f * u, p); c.drawCircle(65 * u, 47 * u, 3.5f * u, p)
                  }
                  // nariz, boca e bigodes
                  fill(pink)
                  path.reset(); path.moveTo(46 * u, 56 * u); path.lineTo(54 * u, 56 * u); path.lineTo(50 * u, 61 * u); path.close(); c.drawPath(path, p)
                  stroke(dark, 1.6f * u)
                  c.drawLine(50 * u, 61 * u, 50 * u, 64 * u, p)
                  rect.set(42 * u, 61 * u, 50 * u, 68 * u); c.drawArc(rect, 0f, 180f, false, p)
                  rect.set(50 * u, 61 * u, 58 * u, 68 * u); c.drawArc(rect, 0f, 180f, false, p)
                  stroke(dark, 1.2f * u)
                  c.drawLine(30 * u, 58 * u, 10 * u, 54 * u, p); c.drawLine(30 * u, 62 * u, 10 * u, 64 * u, p)
                  c.drawLine(70 * u, 58 * u, 90 * u, 54 * u, p); c.drawLine(70 * u, 62 * u, 90 * u, 64 * u, p)
                  // patas: a que "bate" desce e escurece
                  val hitIndex = if (side) 1 else 0
                  for (i in 0..1) {
                      val hit = tapped && i == hitIndex
                      val x0 = if (i == 0) 22 * u else 56 * u
                      val dy = if (hit) 4 * u else 0f
                      fill(if (hit) Color.parseColor("#E8C9A0") else light)
                      rect.set(x0, 78 * u + dy, x0 + 22 * u, 97 * u + dy)
                      c.drawRoundRect(rect, 9 * u, 9 * u, p)
                      stroke(dark, 1f * u)
                      c.drawLine(x0 + 8 * u, 88 * u + dy, x0 + 8 * u, 94 * u + dy, p)
                      c.drawLine(x0 + 14 * u, 88 * u + dy, x0 + 14 * u, 94 * u + dy, p)
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/gatotoque/GatoService.kt <<'EOF'
          package com.gatotoque

          import android.accessibilityservice.AccessibilityService
          import android.animation.ValueAnimator
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.WindowManager
          import android.view.WindowManager.LayoutParams as LP
          import android.view.accessibility.AccessibilityEvent
          import android.view.animation.LinearInterpolator
          import android.view.animation.OvershootInterpolator
          import android.view.inputmethod.InputMethodManager
          import java.io.File

          /**
           * Como funciona (o Android não deixa nenhum app ver toques de outros apps):
           *  - TOQUE: uma janelinha invisível de 1x1 px recebe ACTION_OUTSIDE a cada toque fora dela, em qualquer app.
           *  - GATO: uma janela por cima de tudo, que não bloqueia toques (só no modo de edição).
           *  - QUAL APP ESTÁ ABERTO: o serviço recebe TYPE_WINDOW_STATE_CHANGED com o nome do app.
           * O Android NÃO avisa quando o dedo sai da tela, então a "pata apertada" dura um tempo fixo.
           */
          class GatoService : AccessibilityService() {
              companion object {
                  var instance: GatoService? = null
              }

              private val ui = Handler(Looper.getMainLooper())
              private var wm: WindowManager? = null
              private var catcher: View? = null
              private var cat: CatView? = null
              private lateinit var lp: LP
              private var fg: String? = null
              private val ignore = HashSet<String>()
              private var seq = 0
              private var seqBar: ValueAnimator? = null
              private var px = 0
              private var py = 0
              private var psize = 100
              private val density get() = resources.displayMetrics.density
              private val unpress = Runnable { cat?.tapped = false; cat?.invalidate() }
              private val endSeq = Runnable { endSequence() }

              private val drag by lazy {
                  object : View.OnTouchListener {
                      var lx = 0f
                      var ly = 0f
                      var fresh = true
                      val sg = ScaleGestureDetector(this@GatoService, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                          override fun onScale(d: ScaleGestureDetector): Boolean {
                              val old = psize
                              psize = (psize * d.scaleFactor).toInt().coerceIn((50 * density).toInt(), (500 * density).toInt())
                              px -= (psize - old) / 2
                              py -= (psize - old) / 2
                              applyLayout()
                              return true
                          }
                      })

                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          sg.onTouchEvent(e)
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> { lx = e.rawX; ly = e.rawY; fresh = false }
                              MotionEvent.ACTION_POINTER_DOWN, MotionEvent.ACTION_POINTER_UP -> fresh = true
                              MotionEvent.ACTION_MOVE -> if (!sg.isInProgress && e.pointerCount == 1) {
                                  if (fresh) {
                                      lx = e.rawX; ly = e.rawY; fresh = false
                                  } else {
                                      px += (e.rawX - lx).toInt()
                                      py += (e.rawY - ly).toInt()
                                      lx = e.rawX; ly = e.rawY
                                      applyLayout()
                                  }
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> saveGeometry()
                          }
                          return true
                      }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Prefs.init(this)
                  instance = this
                  val m = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = m
                  try {
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.enabledInputMethodList.forEach { ignore.add(it.packageName) }
                  } catch (_: Exception) { }
                  ignore.add("com.android.systemui")
                  ignore.add("android")
                  ignore.add(packageName)

                  val c = View(this)
                  c.setOnTouchListener { _, e -> if (e.actionMasked == MotionEvent.ACTION_OUTSIDE) onTap(); false }
                  val clp = LP(1, 1, LP.TYPE_ACCESSIBILITY_OVERLAY,
                      LP.FLAG_NOT_FOCUSABLE or LP.FLAG_NOT_TOUCH_MODAL or LP.FLAG_WATCH_OUTSIDE_TOUCH, PixelFormat.TRANSLUCENT)
                  clp.gravity = Gravity.TOP or Gravity.START
                  m.addView(c, clp)
                  catcher = c

                  val v = CatView(this)
                  lp = LP(100, 100, LP.TYPE_ACCESSIBILITY_OVERLAY, LP.FLAG_NOT_FOCUSABLE or LP.FLAG_NOT_TOUCHABLE, PixelFormat.TRANSLUCENT)
                  lp.gravity = Gravity.TOP or Gravity.START
                  m.addView(v, lp)
                  cat = v
                  refresh(true)
              }

              /** Relê as configurações. images=true também recarrega as fotos. */
              fun refresh(images: Boolean = false) {
                  val v = cat ?: return
                  val d = resources.displayMetrics
                  psize = (Prefs.sizeDp * d.density).toInt()
                  if (Prefs.x < 0 || Prefs.y < 0) {
                      px = d.widthPixels - psize - (16 * d.density).toInt()
                      py = (180 * d.density).toInt()
                  } else {
                      px = Prefs.x
                      py = Prefs.y
                  }
                  if (images) {
                      v.idle = loadBitmap(File(filesDir, "idle.img"))
                      v.down = loadBitmap(File(filesDir, "down.img"))
                  }
                  v.circle = Prefs.circle
                  v.showSeq = Prefs.seqOn
                  v.alphaPct = Prefs.alpha
                  v.editing = Prefs.editing
                  if (!Prefs.seqOn) endSequence()
                  v.setOnTouchListener(if (Prefs.editing) drag else null)
                  applyLayout()
                  updateVisibility()
                  v.invalidate()
              }

              private fun applyLayout() {
                  val v = cat ?: return
                  val m = wm ?: return
                  val d = resources.displayMetrics
                  px = px.coerceIn(-psize / 2, d.widthPixels - psize / 2)
                  py = py.coerceIn(-psize / 2, d.heightPixels - psize / 2)
                  lp.width = psize
                  lp.height = if (Prefs.seqOn) (psize * 1.5f).toInt() else psize
                  lp.x = px
                  lp.y = py
                  lp.flags = LP.FLAG_NOT_FOCUSABLE or (if (Prefs.editing) 0 else LP.FLAG_NOT_TOUCHABLE)
                  try { m.updateViewLayout(v, lp) } catch (_: Exception) { }
              }

              private fun saveGeometry() {
                  Prefs.x = px
                  Prefs.y = py
                  Prefs.sizeDp = (psize / density).toInt()
              }

              private fun visible(): Boolean {
                  if (!Prefs.enabled) return false
                  if (Prefs.editing || !Prefs.onlySelected) return true
                  val f = fg ?: return false
                  return f == packageName || Prefs.selected().contains(f)
              }

              private fun updateVisibility() {
                  cat?.visibility = if (visible()) View.VISIBLE else View.GONE
                  if (!visible()) endSequence()
              }

              /** A tela do próprio app avisa que está na frente (o serviço ignora os eventos do próprio pacote). */
              fun setForeground(pkg: String) {
                  fg = pkg
                  updateVisibility()
              }

              private fun onTap() {
                  val v = cat ?: return
                  if (Prefs.editing || !visible()) return
                  v.side = !v.side
                  v.tapped = true
                  v.invalidate()
                  ui.removeCallbacks(unpress)
                  ui.postDelayed(unpress, Prefs.holdMs.toLong())
                  v.animate().cancel()
                  v.scaleX = 0.88f
                  v.scaleY = 0.88f
                  v.animate().scaleX(1f).scaleY(1f).setDuration(160).setInterpolator(OvershootInterpolator()).start()
                  if (Prefs.seqOn) bump()
              }

              /** Cada toque soma +1. Sem tocar pelo tempo configurado, a sequência acaba e zera. */
              private fun bump() {
                  val v = cat ?: return
                  seq++
                  v.seq = seq
                  v.frac = 1f
                  seqBar?.cancel()
                  val anim = ValueAnimator.ofFloat(1f, 0f)
                  anim.duration = Prefs.seqTmo * 1000L
                  anim.interpolator = LinearInterpolator()
                  anim.addUpdateListener { v.frac = it.animatedValue as Float; v.invalidate() }
                  anim.start()
                  seqBar = anim
                  ui.removeCallbacks(endSeq)
                  ui.postDelayed(endSeq, Prefs.seqTmo * 1000L)
                  v.invalidate()
              }

              private fun endSequence() {
                  ui.removeCallbacks(endSeq)
                  seqBar?.cancel()
                  seq = 0
                  cat?.seq = 0
                  cat?.invalidate()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || e.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val p = e.packageName?.toString() ?: return
                  if (p in ignore) return
                  fg = p
                  updateVisibility()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  instance = null
                  ui.removeCallbacksAndMessages(null)
                  try { catcher?.let { wm?.removeView(it) } } catch (_: Exception) { }
                  try { cat?.let { wm?.removeView(it) } } catch (_: Exception) { }
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/gatotoque/MainActivity.kt <<'EOF'
          package com.gatotoque

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private lateinit var appsBtn: Button
              private lateinit var sizeBar: SeekBar

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              private fun LinearLayout.add(v: View) {
                  addView(v, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      .apply { topMargin = dp(8) })
              }

              private fun label(s: String, size: Float, bold: Boolean) = TextView(this).apply {
                  text = s
                  if (size > 0f) textSize = size
                  if (bold) setTypeface(typeface, Typeface.BOLD)
              }

              private fun button(s: String, onClick: () -> Unit) = Button(this).apply {
                  text = s
                  minHeight = dp(48)
                  setOnClickListener { onClick() }
              }

              private fun toggle(s: String, init: Boolean, on: (Boolean) -> Unit) = Switch(this).apply {
                  text = s
                  isChecked = init
                  minHeight = dp(48)
                  setOnCheckedChangeListener { _, c -> on(c) }
              }

              private fun slider(name: String, lo: Int, hi: Int, v: Int, unit: String, on: (Int) -> Unit): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  val t = label("$name: $v$unit", 0f, false)
                  val s = SeekBar(this)
                  s.min = lo
                  s.max = hi
                  s.progress = v
                  s.contentDescription = name
                  s.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                          t.text = "$name: $p$unit"
                          if (fromUser) on(p)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })
                  box.addView(t)
                  box.addView(s)
                  return box
              }

              private fun upd(images: Boolean = false) {
                  GatoService.instance?.refresh(images)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Prefs.init(this)
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(16), dp(16), dp(16), dp(32))
                  val scroll = ScrollView(this)
                  scroll.fitsSystemWindows = true
                  scroll.addView(col)
                  setContentView(scroll)

                  col.add(label("Gato dos Toques 🐱", 26f, true))
                  col.add(label("Um gato (ou sua foto) fica por cima dos apps e reage a cada toque na tela.", 0f, false))
                  status = label("", 0f, true)
                  col.add(status)
                  col.add(button("Abrir ajustes de acessibilidade") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  col.add(toggle("Ligado", Prefs.enabled) { Prefs.enabled = it; upd() })

                  col.add(label("Onde aparece", 20f, true))
                  col.add(toggle("Só nos apps que eu escolher", Prefs.onlySelected) { Prefs.onlySelected = it; upd() })
                  appsBtn = button("") { startActivity(Intent(this, AppsActivity::class.java)) }
                  col.add(appsBtn)

                  col.add(label("Posição e tamanho", 20f, true))
                  col.add(toggle("Modo de edição (arraste o gato; pinça com 2 dedos muda o tamanho)", Prefs.editing) { Prefs.editing = it; upd() })
                  col.add(label("Desligue o modo de edição quando terminar, senão o gato não reage aos toques.", 0f, false))
                  val sz = slider("Tamanho", 50, 400, Prefs.sizeDp, " dp") { Prefs.sizeDp = it; upd() }
                  sizeBar = sz.getChildAt(1) as SeekBar
                  col.add(sz)
                  col.add(button("Voltar o gato pra posição inicial") { Prefs.x = -1; Prefs.y = -1; upd() })

                  col.add(label("Visual", 20f, true))
                  col.add(button("Escolher foto (parado)") { pick(11) })
                  col.add(button("Escolher foto (apertando), opcional") { pick(12) })
                  col.add(label("Só com a foto de parado, ela balança a cada toque. Com as duas, troca de foto a cada toque.", 0f, false))
                  col.add(toggle("Recortar foto em círculo", Prefs.circle) { Prefs.circle = it; upd() })
                  col.add(button("Voltar pro gato padrão") {
                      File(filesDir, "idle.img").delete()
                      File(filesDir, "down.img").delete()
                      upd(true)
                  })
                  col.add(slider("Tempo do gato apertado", 50, 500, Prefs.holdMs, " ms") { Prefs.holdMs = it; upd() })
                  col.add(slider("Transparência do gato", 10, 100, Prefs.alpha, "%") { Prefs.alpha = it; upd() })

                  col.add(label("Sequência de toques", 20f, true))
                  col.add(label("Cada toque soma +1 num número embaixo do gato. Se ficar o tempo abaixo sem tocar, a sequência acaba e zera. A barrinha mostra o tempo que falta.", 0f, false))
                  col.add(toggle("Mostrar a sequência", Prefs.seqOn) { Prefs.seqOn = it; upd() })
                  col.add(slider("Tempo sem tocar pra acabar", 1, 10, Prefs.seqTmo, " s") { Prefs.seqTmo = it; upd() })

                  col.add(label("Limite do Android: ele avisa quando você TOCA, mas não onde nem quando o dedo sai. Por isso o gato aperta por um tempo fixo.", 0f, false))
              }

              override fun onResume() {
                  super.onResume()
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  status.text = if (s.contains(packageName) && s.contains("GatoService")) "Serviço: ATIVO ✔"
                  else "Serviço: DESATIVADO. Abra os ajustes de acessibilidade e ligue o Gato dos Toques."
                  appsBtn.text = "Escolher apps (" + Prefs.selected().size + " escolhidos)"
                  sizeBar.progress = Prefs.sizeDp
                  GatoService.instance?.setForeground(packageName)
              }

              private fun pick(code: Int) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "image/*"
                  @Suppress("DEPRECATION")
                  startActivityForResult(i, code)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if ((requestCode != 11 && requestCode != 12) || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  try {
                      val name = if (requestCode == 11) "idle.img" else "down.img"
                      contentResolver.openInputStream(uri)?.use { inp ->
                          FileOutputStream(File(filesDir, name)).use { out -> inp.copyTo(out) }
                      }
                      upd(true)
                      Toast.makeText(this, "Pronto!", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Não consegui abrir essa imagem.", Toast.LENGTH_LONG).show()
                  }
              }
          }

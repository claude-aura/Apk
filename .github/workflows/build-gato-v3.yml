          cat > app/src/main/java/com/gatotoque/Prefs.kt <<'EOF'
          package com.gatotoque

          import android.content.Context
          import android.content.SharedPreferences

          /** Configurações salvas no aparelho. */
          object Prefs {
              private lateinit var sp: SharedPreferences

              fun init(c: Context) {
                  if (!::sp.isInitialized) sp = c.applicationContext.getSharedPreferences("gato", Context.MODE_PRIVATE)
              }

              private fun bool(k: String, d: Boolean) = sp.getBoolean(k, d)
              private fun putBool(k: String, v: Boolean) = sp.edit().putBoolean(k, v).apply()
              private fun int(k: String, d: Int) = sp.getInt(k, d)
              private fun putInt(k: String, v: Int) = sp.edit().putInt(k, v).apply()

              var enabled: Boolean
                  get() = bool("enabled", true)
                  set(v) = putBool("enabled", v)
              var onlySelected: Boolean
                  get() = bool("only", false)
                  set(v) = putBool("only", v)
              var editing: Boolean
                  get() = bool("editing", false)
                  set(v) = putBool("editing", v)
              var circle: Boolean
                  get() = bool("circle", false)
                  set(v) = putBool("circle", v)
              var seqOn: Boolean
                  get() = bool("seqon", true)
                  set(v) = putBool("seqon", v)
              var seqTmo: Int
                  get() = int("seqtmo", 3)
                  set(v) = putInt("seqtmo", v)
              var alpha: Int
                  get() = int("alpha", 100)
                  set(v) = putInt("alpha", v)
              var sizeDp: Int
                  get() = int("size", 140)
                  set(v) = putInt("size", v)
              var holdMs: Int
                  get() = int("hold", 150)
                  set(v) = putInt("hold", v)
              var x: Int
                  get() = int("x", -1)
                  set(v) = putInt("x", v)
              var y: Int
                  get() = int("y", -1)
                  set(v) = putInt("y", v)

              fun selected(): Set<String> = sp.getStringSet("sel", emptySet()) ?: emptySet()
              fun setSelected(s: Set<String>) = sp.edit().putStringSet("sel", HashSet(s)).apply()
          }
          EOF

      - name: Compilar
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "=== ERROS DE COMPILACAO (me mande um print disto) ==="
            grep -E "^e: |What went wrong" -A3 build.log | head -60
            exit 1
          }
          echo "Compilou sem erros."

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "gato3-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --title "Gato dos Toques v3 #${{ github.run_number }}" \
            --notes "Baixe o app-debug.apk e instale no celular."
